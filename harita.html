<title>Şimdi Türkiye Zamanı</title>

*{box-sizing:border-box;margin:0;padding:0;}

.bb{font-family:'Bebas Neue',sans-serif;}

.modal-box{background:#161616;border:1px solid #C9A000;border-radius:12px;padding:38px 30px;text-align:center;max-width:380px;width:90%;box-shadow:0 0 0 1px rgba(255,224,0,0.06),0 30px 80px rgba(0,0,0,0.9);position:relative;overflow:hidden;}

<!-- LOGIN -->
<div id="loginScreen" style="position:fixed;inset:0;background:#080808;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#161616;border:1px solid rgba(255,224,0,.3);border-radius:14px;padding:32px 24px;width:100%;max-width:360px;text-align:center;">
    <div style="font-size:3rem;margin-bottom:8px;">🗺️</div>

    <input id="loginName" type="text" placeholder="Adın (örn: Emre Kır)" autocomplete="off" autocorrect="off" style="width:100%;padding:11px 14px;background:#0F0F0F;border:1px solid rgba(255,255,255,.1);color:#F0ECD8;font-family:'Raleway',sans-serif;font-size:.88rem;border-radius:7px;outline:none;margin-bottom:8px;box-sizing:border-box;"/>
    <input id="loginPass" type="password" placeholder="Şifre" style="width:100%;padding:11px 14px;background:#0F0F0F;border:1px solid rgba(255,255,255,.1);color:#F0ECD8;font-family:'Raleway',sans-serif;font-size:.88rem;border-radius:7px;outline:none;margin-bottom:12px;box-sizing:border-box;"/>
    <button onclick="doLogin()" style="width:100%;padding:12px;background:linear-gradient(135deg,#7a6000,#c9a000 50%,#7a6000);border:2px solid #FFE000;border-radius:8px;color:#000;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:3px;cursor:pointer;">GİRİŞ YAP</button>
    <div id="loginErr" style="color:#e74c3c;font-size:.8rem;margin-top:8px;min-height:18px;"></div>
    <div style="margin-top:14px;font-size:.68rem;color:#3A3830;">Şifre: adının ilk 4 harfi küçük</div>
  </div>
</div>

// ── YARDIMCI ──
function escH(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function normStr(s){return s.replace(/İ/g,"i").replace(/I/g,"ı").replace(/Ğ/g,"ğ").replace(/Ü/g,"ü").replace(/Ş/g,"ş").replace(/Ö/g,"ö").replace(/Ç/g,"ç").toLowerCase();}
function tl(n){return n.toLocaleString("tr-TR")+"₺";}
function lsGet(k){try{var v=localStorage.getItem(k);if(v)return JSON.parse(v);}catch(e){}return null;}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function spawnConfetti(){
  var colors=["#FFE000","#FFE000","#ffffff","#F87171","#60A5FA"];
  for(var i=0;i<55;i++){
    var el=document.createElement("div");
    var size=4+Math.random()*8;
    el.style.cssText="position:fixed;pointer-events:none;z-index:9999;width:"+size+"px;height:"+size+"px;left:"+(15+Math.random()*70)+"%;top:-20px;background:"+colors[0|Math.random()*colors.length]+";border-radius:"+(Math.random()>.4?"50%":"2px")+";animation:cfal "+(1.6+Math.random()*.8)+"s "+(Math.random()*.6)+"s ease-in forwards;";
    document.body.appendChild(el);
    setTimeout(function(){el.remove();},2800);
  }
}

// ── LOGIN ──
function doLogin(){
  var name=document.getElementById("loginName").value.trim();
  var pass=document.getElementById("loginPass").value.trim();
  var err=document.getElementById("loginErr");
  if(!name||!pass){err.textContent="Ad ve şifre gir.";return;}
  if(name.toLowerCase()==="admin"&&pass===ADMIN_PASS){currentUser="admin";isAdmin=true;showGame();return;}
  err.textContent="Kontrol ediliyor...";
  var found=null;
  for(var i=0;i<_players.length;i++){
    if(normStr(_players[i].name)===normStr(name)){found=_players[i];break;}
  }
  if(!found){err.textContent="Bu isim listede yok.";return;}
  var exp=normStr(found.name.replace(/\s+/g,"")).substring(0,4);
  if(pass!==exp&&pass!==ADMIN_PASS){err.textContent="Şifre yanlış.";return;}
  currentUser=found.name;isAdmin=false;showGame();
}
function showGame(){
  try{sessionStorage.setItem("hUser",currentUser);sessionStorage.setItem("hAdmin",isAdmin?"1":"0");}catch(e){}
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("app").style.display="block";
  init();
}
function doLogout(){
  try{sessionStorage.removeItem("hUser");sessionStorage.removeItem("hAdmin");}catch(e){}
  currentUser=null;isAdmin=false;currentTab="harita";
  document.getElementById("app").style.display="none";
  document.getElementById("app").innerHTML="";
  document.getElementById("loginScreen").style.display="flex";
  document.getElementById("loginName").value="";
  document.getElementById("loginPass").value="";
  document.getElementById("loginErr").textContent="";
}

// ── INIT ──
function init(){
  // Önce localStorage
  var lp=lsGet("hPlayers");if(lp&&lp.length)_players=lp;
  var lh=lsGet("hHaritaData");if(lh)_haritaData=lh;
  var lc=lsGet("hHaritaCfg");if(lc)_haritaCfg=lc;
  var li=lsGet("hIddiaList");if(li)_iddiaList=li;
  var lt=lsGet("hTaskCfg");if(lt)_taskCfg=lt;
  var lcr=lsGet("hCrmRows");if(lcr)_crmRows=lcr;
  var lpc=lsGet("hPlayerCfg");if(lpc)_playerCfg=lpc;
  render();
  // Firebase'den çek
  if(!_fbReady||!_db)return;
  _db.doc(_FB_PLAYERS).get().then(function(doc){
    if(doc.exists&&doc.data().players){_players=doc.data().players;lsSet("hPlayers",_players);}
  });
  _db.doc(_FB_HARITA).get().then(function(doc){
    if(doc.exists){_haritaData=doc.data().iller||{};lsSet("hHaritaData",_haritaData);render();}
  });
  _db.doc(_FB_CFG).get().then(function(doc){
    if(doc.exists){
      var d=doc.data()||{};
      if(d._playerCfg){_playerCfg=d._playerCfg;lsSet("hPlayerCfg",_playerCfg);delete d._playerCfg;}
      _haritaCfg=d;lsSet("hHaritaCfg",_haritaCfg);
    } else {_haritaCfg={};}
    render();
  });
  _db.doc(_FB_IDDIA).get().then(function(doc){
    if(doc.exists&&doc.data().list){_iddiaList=doc.data().list;lsSet("hIddiaList",_iddiaList);render();}
  });
  _db.doc(_FB_GOREV).get().then(function(doc){
    if(doc.exists){_taskCfg=doc.data();lsSet("hTaskCfg",_taskCfg);render();}
  });
  _db.doc(_FB_CRM).get().then(function(doc){
    if(doc.exists&&doc.data().rows){_crmRows=doc.data().rows;lsSet("hCrmRows",_crmRows);render();}
  });
}

function buildHTML(){
  var tabs=isAdmin
    ?[["harita","🗺️ Harita"],["gorevler","📋 Görevler"],["iddialar","🎯 İddialar"],["skor","🏆 Skor"],["crm","📊 CRM"],["admin","⚙️"]]
    :[["harita","🗺️ Harita"],["iddialar","🎯 İddialar"],["skor","🏆 Skor"],["crm","📊 CRM"]];
  if(!isAdmin&&(currentTab==="gorevler"||currentTab==="admin"))currentTab="harita";

  var tabsHTML=tabs.map(function(t){
    var active=currentTab===t[0];
    return'<button data-tab="'+t[0]+'" style="flex:1;padding:10px 4px;border:none;border-bottom:3px solid '+(active?"#FFE000":"transparent")+';background:transparent;color:'+(active?"#FFE000":"#8A8474")+';font-family:Raleway,sans-serif;font-weight:700;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap;">'+t[1]+'</button>';
  }).join("");

  // Stats
  var toplamAcik=0,toplamOdul=0,_globalOdulSayisal=true;
  Object.keys(_haritaData).forEach(function(sid){
    var s=_haritaData[sid]||{};
    toplamAcik+=Object.keys(s).length;
    Object.keys(s).forEach(function(no){
      var o=s[no].odul;
      if(typeof o==="number")toplamOdul+=o;
      else _globalOdulSayisal=false;
    });
  });
  var havuzGoster=_globalOdulSayisal?tl(toplamOdul):(toplamAcik+" ödül");
  var statsHTML='<div style="display:flex;justify-content:center;background:#161616;border-bottom:1px solid rgba(255,255,255,.06);">'
    +[["AÇILAN",toplamAcik],["KALAN",81*SUBELER.length-toplamAcik],["TOPLAM HAVUZ",havuzGoster],["ŞUBE",SUBELER.length]].map(function(s,i){
      var sep=i<3?"border-right:1px solid rgba(255,255,255,.06);":"";
      return'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px;'+sep+'min-width:0;flex:1;">'
        +'<span class="bb" style="font-size:clamp(.9rem,3.5vw,1.2rem);color:#FFE000;line-height:1;white-space:nowrap;">'+s[1]+'</span>'
        +'<span style="font-size:clamp(.42rem,1.4vw,.52rem);letter-spacing:.14em;text-transform:uppercase;color:#8A8474;margin-top:3px;white-space:nowrap;">'+s[0]+'</span>'
        +'</div>';
    }).join("")
    +'</div>';

  var body="";
  if(currentTab==="harita") body=buildHarita();
  else if(currentTab==="gorevler") body=buildGorevler();
  else if(currentTab==="iddialar") body=buildIddialar();
  else if(currentTab==="skor") body=buildSkor();
  else if(currentTab==="crm") body=buildCRM();
  else if(currentTab==="admin") body=buildAdmin();

  return'<header style="background:#0F0F0F;border-bottom:3px solid #FFE000;text-align:center;padding:18px 16px 12px;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px;">'
    +'<span style="font-size:.72rem;color:#8A8474;">👤 '+escH(currentUser||'')+'</span>'
    +'<button onclick="doLogout()" style="background:none;border:1px solid rgba(255,255,255,.1);color:#8A8474;font-family:Raleway,sans-serif;font-size:.68rem;padding:3px 10px;border-radius:4px;cursor:pointer;">Çıkış</button>'
    +'</div>'
    +'<div class="bb" style="font-size:clamp(1.6rem,5.5vw,2.6rem);color:#FFE000;text-shadow:0 0 40px rgba(255,224,0,.4);line-height:1;">Şimdi Türkiye <span style="color:#fff">Zamanı</span></div>'
    +'</header>'
    +statsHTML
    +'<div style="display:flex;background:#0F0F0F;border-bottom:1px solid rgba(255,224,0,.18);overflow-x:auto;">'+tabsHTML+'</div>'
    +body
    +(modalData?buildModal():"")

      +'<span style="font-size:.72rem;font-weight:800;color:#F0ECD8;letter-spacing:.06em;">'+escH(s.ad)+'</span>'

function buildSvgMap(subeId,acikSet){
  // SVG'yi DOM ile oluştur (string concat değil)
  var svgId="svgmap_"+subeId;
  // Gecikmeli render için placeholder + data
  var acikStr=JSON.stringify(acikSet);
  return'<div id="'+svgId+'" data-sube="'+subeId+'" data-acik="'+escH(acikStr)+'" style="width:100%;min-height:60px;"></div>';
}

function renderSvgMap(divId){
  var div=document.getElementById(divId);
  if(!div)return;
  var subeId=div.dataset.sube;
  var acikSet={};
  try{acikSet=JSON.parse(div.dataset.acik||"{}");}catch(e){}
  
  var ns="http://www.w3.org/2000/svg";
  var svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 800 420");
  svg.style.cssText="width:100%;height:auto;display:block;";
  
  // Arka plan
  var bg=document.createElementNS(ns,"rect");
  bg.setAttribute("x","0");bg.setAttribute("y","0");
  bg.setAttribute("width","800");bg.setAttribute("height","420");
  bg.setAttribute("fill","#0a0a0a");
  svg.appendChild(bg);

  SEHIRLER.forEach(function(s){
    var pd=SVG_PATHS[s.no];
    if(!pd)return;
    var acik=acikSet[s.no];
    var el=document.createElementNS(ns,"path");
    el.setAttribute("d",pd);
    el.setAttribute("fill",acik?"#FFE000":"#2d2d2d");
    el.setAttribute("stroke","#ffffff");
    el.setAttribute("stroke-width","1.2");
    if(acik){
      el.style.filter="drop-shadow(0 0 4px rgba(255,224,0,0.6))";
      el.setAttribute("stroke","#ffffff");
      el.setAttribute("stroke-width","1.2");
    }
    var title=document.createElementNS(ns,"title");
    title.textContent=s.ad+(acik?" ✓":"");
    el.appendChild(title);
    svg.appendChild(el);
  });
  div.innerHTML="";
  div.appendChild(svg);
}

function getBarem(subeId,ilSirasi){
  // Global barem (_global key)
  var globalCfg=_haritaCfg["_global"]||{};
  var barem=globalCfg.barem||[];
  if(barem.length>0){
    for(var i=0;i<barem.length;i++){
      var b=barem[i];
      if(ilSirasi>=b.minIl&&(b.maxIl===0||ilSirasi<=b.maxIl)){
        var havuz=[];
        (b.odulTipler||[]).forEach(function(t){
          for(var k=0;k<(t.sayi||1);k++)havuz.push(t.ad);
        });
        if(!havuz.length)return "Ödül";
        return havuz[Math.floor(Math.random()*havuz.length)];
      }
    }
    return "Ödül";
  }
  // Şubeye özel veya genel odulListesi (eski sistem)
  var cfg=_haritaCfg[subeId]||{};
  var liste=cfg.odulListesi||[200,300,500,1000,2000];
  return liste[Math.floor(Math.random()*liste.length)];
}

function haritaAcIl(subeId,personelAdi){
  var sube=_haritaData[subeId]||{};
  var sonraki=null;
  for(var i=0;i<SEHIRLER.length;i++){if(!sube[SEHIRLER[i].no]){sonraki=SEHIRLER[i];break;}}
  if(!sonraki){showModal("ℹ️","Tamamlandı","Bu şubenin tüm illeri açıldı!",false);return;}
  var acikSayi=Object.keys(sube).length+1;
  var odul=getBarem(subeId,acikSayi);
  // İle özel önceden tanımlı ödül
  var ilOdulCfg=((_haritaCfg["_ilOdulleri"]||{})[subeId]||{})[sonraki.no]||0;
  if(!_haritaData[subeId])_haritaData[subeId]={};
  _haritaData[subeId][sonraki.no]={personel:personelAdi,odul:odul,ilOdul:ilOdulCfg,tarih:new Date().toLocaleDateString("tr-TR")};
  lsSet("hHaritaData",_haritaData);
  fbSaveHarita();
  spawnConfetti();
  render();
  var odulGoster=typeof odul==="number"?tl(odul):('<strong style="color:#FFE000">'+odul+'</strong>');
  var ilOdulGoster=ilOdulCfg>0?('<br>İl Ödülü: <span style="color:#FFE000">+'+tl(ilOdulCfg)+'</span>'):'';
  showModal("🗺️","İl Açıldı!","<strong>"+sonraki.no+" - "+sonraki.ad+"</strong><br>Personel: <strong>"+escH(personelAdi)+"</strong><br>Ödül: "+odulGoster+ilOdulGoster,true);
}

function haritaGeriAl(subeId){
  var sube=_haritaData[subeId]||{};
  var acikNolar=Object.keys(sube);
  if(!acikNolar.length){alert("Geri alınacak il yok.");return;}
  // En son açılan ili bul (SEHIRLER sırasına göre en büyük index)
  var sonIlNo=null;
  for(var i=SEHIRLER.length-1;i>=0;i--){
    if(sube[SEHIRLER[i].no]){sonIlNo=SEHIRLER[i].no;break;}
  }
  if(!sonIlNo)return;
  var sehir=SEHIRLER.find(function(s){return s.no===sonIlNo;});
  showConfirm("Geri Al?","<strong>"+sonIlNo+" - "+(sehir?sehir.ad:"")+"</strong> ilini geri almak istediğine emin misin?",function(){
    delete _haritaData[subeId][sonIlNo];
    lsSet("hHaritaData",_haritaData);
    fbSaveHarita();
    render();
  });
}

function haritaIlDetay(subeId,ilNo){
  var d=(_haritaData[subeId]||{})[ilNo];if(!d)return;
  var sehir=SEHIRLER.find(function(s){return s.no===ilNo;});
  var odulGoster=typeof d.odul==="number"?tl(d.odul):d.odul;
  showModal("🗺️",ilNo+" - "+(sehir?sehir.ad:""),"Personel: <strong>"+escH(d.personel)+"</strong><br>Ödül: <span style='color:#FFE000'>"+odulGoster+"</span><br>Tarih: "+d.tarih,false);
}

function buildGorevler(){
  var cal=_taskCfg.calendar||[];
  var today=new Date();
  var mm=today.getMonth()+1;var dd=today.getDate();
  var tk=today.getFullYear()+"-"+(mm<10?"0"+mm:""+mm)+"-"+(dd<10?"0"+dd:""+dd);

  // Bugünün görevi
  var todayTask=cal.find(function(c){return c.dayKey===tk;});
  var todayHtml="";
  if(todayTask){
    var done=todayTask.winners&&todayTask.winners.length&&todayTask.winners[0]!=="__none__";
    todayHtml='<div style="margin-bottom:16px;">'
      +'<div style="display:flex;align-items:center;padding:9px 14px;background:linear-gradient(90deg,rgba(255,224,0,.2),rgba(255,224,0,.05));border-left:3px solid #FFE000;border-radius:6px 6px 0 0;">'
      +'<div class="bb" style="font-size:.9rem;color:#FFE000;letter-spacing:.1em;">📋 BUGÜNÜN GÖREVİ</div>'
      +'</div>'
      +'<div style="background:#161616;border:1px solid rgba(255,224,0,.25);border-top:none;border-radius:0 0 6px 6px;padding:12px 14px;">'
      +'<div style="font-size:.92rem;color:#F0ECD8;font-weight:700;margin-bottom:6px;">'+escH(todayTask.taskText)+'</div>'
      +(todayTask.prize>0?'<div style="font-size:.78rem;color:#FFE000;margin-bottom:6px;">Ödül: '+tl(todayTask.prize)+'</div>':"")
      +(done?'<div style="font-size:.74rem;color:#FFE000;">✅ '+escH(todayTask.winners.filter(function(w){return w!=="__none__";}).join(", "))+'</div>'
            :(isAdmin?'<button onclick="gorevYonet(\''+todayTask.id+'\')" style="margin-top:6px;padding:5px 14px;background:#FFE000;border:none;border-radius:5px;color:#000;font-family:Raleway,sans-serif;font-weight:800;font-size:.72rem;cursor:pointer;">Tamamlayanı Seç</button>':'<div style="font-size:.74rem;color:#F5C800;">⏳ Bekliyor</div>'))
      +'</div></div>';
  }

  // Geçmiş görevler
  var dateFilter='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);">'
    +'<span style="font-size:.62rem;color:#FFE000;letter-spacing:.1em;text-transform:uppercase;font-weight:700;">📅 Tarih</span>'
    +'<input type="date" id="gorevStart" value="'+(_gorevStart||'')+'" style="padding:5px 8px;background:#0F0F0F;border:1px solid rgba(255,255,255,.08);color:#F0ECD8;font-family:Raleway,sans-serif;font-size:.78rem;border-radius:5px;outline:none;">'
    +'<span style="color:#8A8474;">—</span>'
    +'<input type="date" id="gorevEnd" value="'+(_gorevEnd||'')+'" style="padding:5px 8px;background:#0F0F0F;border:1px solid rgba(255,255,255,.08);color:#F0ECD8;font-family:Raleway,sans-serif;font-size:.78rem;border-radius:5px;outline:none;">'
    +'<button onclick="gorevFilter()" style="padding:5px 12px;background:#FFE000;border:none;border-radius:5px;color:#000;font-family:Raleway,sans-serif;font-weight:800;font-size:.72rem;cursor:pointer;">Filtrele</button>'
    +'<button onclick="gorevClear()" style="padding:5px 10px;background:none;border:1px solid rgba(255,255,255,.08);border-radius:5px;color:#8A8474;font-family:Raleway,sans-serif;font-size:.72rem;cursor:pointer;">Tümü</button>'

      +'<div style="font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#FFE000;font-weight:700;margin-bottom:10px;">📅 Görev Ekle</div>'
      +'<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px;">'
      +'<input id="calDate" type="date" style="flex:1;min-width:120px;padding:8px 10px;background:#0F0F0F;border:1px solid rgba(255,255,255,.06);color:#F0ECD8;font-family:Raleway,sans-serif;font-size:.8rem;border-radius:5px;outline:none;">'
      +'<input id="calTask" type="text" placeholder="Görev metni" style="flex:3;min-width:150px;padding:8px 10px;background:#0F0F0F;border:1px solid rgba(255,255,255,.06);color:#F0ECD8;font-family:Raleway,sans-serif;font-size:.8rem;border-radius:5px;outline:none;">'
      +'<input id="calPrize" type="number" min="0" placeholder="Ödül TL" style="width:84px;padding:8px 10px;background:#0F0F0F;border:1px solid rgba(255,255,255,.06);color:#F0ECD8;font-family:Raleway,sans-serif;font-size:.8rem;border-radius:5px;outline:none;">'
      +'</div>'
      +'<button id="addCalBtn" style="padding:8px 16px;background:#FFE000;border:none;border-radius:5px;color:#000;font-family:Raleway,sans-serif;font-weight:800;font-size:.78rem;cursor:pointer;">+ Ekle</button>'
      +'</div>';
  }

  return'<div style="padding:16px 12px;max-width:820px;margin:0 auto;">'
    +'<div class="bb" style="font-size:1.6rem;color:#FFE000;margin-bottom:14px;">📋 Görevler</div>'
    +adminAdd
    +todayHtml
    +(past.length?'<div style="margin-top:10px;margin-bottom:20px;">'
      +'<div style="display:flex;align-items:center;padding:8px 14px;background:rgba(255,255,255,.03);border-left:3px solid #3A3830;border-radius:6px 6px 0 0;">'
      +'<div class="bb" style="font-size:.82rem;color:#8A8474;letter-spacing:.1em;">⏮ GEÇMİŞ GÖREVLER</div>'
      +'</div>'
      +'<div style="background:#111;border:1px solid rgba(255,255,255,.04);border-top:none;border-radius:0 0 8px 8px;overflow:hidden;">'
      +dateFilter+pastRows
      +'</div></div>':"")
    +'</div>';
}

function gorevYonet(calId){
  var cal=_taskCfg.calendar||[];
  var task=cal.find(function(c){return c.id===calId;});
  if(!task)return;
  var old=document.getElementById("gorevOv");if(old&&old.parentNode)old.parentNode.removeChild(old);
  var pOpts=_players.map(function(p){
    return'<label style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;"><input type="checkbox" class="gwcb" value="'+escH(p.name)+'" '+(task.winners&&task.winners.includes(p.name)?"checked":"")+' style="accent-color:#FFE000;width:16px;height:16px;flex-shrink:0;"><span style="font-size:.86rem;color:#F0ECD8;">'+escH(p.name)+'</span></label>';

// ── SKOR ──
// Prim hesaplama: Her personel hangi şubeden prim alıyorsa o şubenin
// toplam TL havuzunu, o şubedeki kendi il açma oranıyla çarpar.
// String ödüllü şubelerde il sayısı bazlı oran gösterilir.
function calcHaritaPrimleri(){
  var haritaOdul={};
  var haritaIlOdul={}; // il bazlı sabit ödüller (personele direkt)
  SUBELER.forEach(function(s){
    var sube=_haritaData[s.id]||{};
    var toplamAcik=Object.keys(sube).length;
    if(!toplamAcik)return;

    // Havuz: sayısal barem ödülleri + il bazlı sabit ödüller
    var toplamTL=0;
    var kisiIl={};   // personel → açtığı il sayısı (bu şubede)
    var kisiIlTL={}; // personel → açtığı illerin TL toplamı (sayısal barem)

    Object.keys(sube).forEach(function(no){
      var d=sube[no];
      var p=d.personel;if(!p)return;
      kisiIl[p]=(kisiIl[p]||0)+1;

      // Sayısal barem ödülü
      var o=d.odul;
      if(typeof o==="number"){
        toplamTL+=o;
        kisiIlTL[p]=(kisiIlTL[p]||0)+o;
      }

      // İl bazlı sabit nakit ödül → personele direkt ekle
      var ilO=d.ilOdul||0;
      if(ilO>0){haritaIlOdul[p]=(haritaIlOdul[p]||0)+ilO;}
    });

    // Personel → şube ataması filtresi
    Object.keys(kisiIl).forEach(function(p){
      var pcfg=_playerCfg[p]||{};
      var atamaSubeId=pcfg.subeId||null;
      if(atamaSubeId&&atamaSubeId!==s.id)return; // başka şubeye atanmış

      if(toplamTL>0){
        // Oransal: personelin açtığı illerin TL değeri / şube toplam TL
        var kisiTL=kisiIlTL[p]||0;
        var oran=kisiTL/toplamTL;
        haritaOdul[p]=(haritaOdul[p]||0)+Math.round(toplamTL*oran);
      } else if(toplamAcik>0){
        // Barem string ise: oransal il sayısı bazlı (TL yok, skor 0 kalır — il ödülleri ayrıca eklenir)
      }
    });
  });
  return{haritaOdul:haritaOdul,haritaIlOdul:haritaIlOdul};
}

function buildSkor(){
  var prim=calcHaritaPrimleri();
  var haritaOdul=prim.haritaOdul;
  var haritaIlOdul=prim.haritaIlOdul;

  // Görev ödülleri
  var gorevOdul={};

  var iddiaOdul={};
  _iddiaList.filter(function(x){return x.status==="kazandi"||x.status==="kaybetti";}).forEach(function(x){
    iddiaOdul[x.player]=(iddiaOdul[x.player]||0)+(x.delta||0);
  });

  var scores=_players.map(function(p){

    var hil=haritaIlOdul[p.name]||0;

  var medals=["🥇","🥈","🥉"];

      +'<div style="flex:1;min-width:0;">'

      +'</div></div>';

  // Şube havuzları — sadece özet (oran + toplam)
  var subeRows=SUBELER.map(function(s){
    var sube=_haritaData[s.id]||{};
    var acik=Object.keys(sube).length;
    var havuz=0;var ilEk=0;var sayisal=true;
    Object.keys(sube).forEach(function(no){

function crmLoad(inp){
  var file=inp.files[0];if(!file)return;
  var nm=document.getElementById("crmFName");if(nm)nm.textContent="Yükleniyor...";
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var wb=XLSX.read(ev.target.result,{type:"array"});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      _crmRows=rows;
      lsSet("hCrmRows",rows);
      if(_fbReady&&_db){_db.doc(_FB_CRM).set({rows:rows,ts:Date.now()}).catch(function(e){console.warn(e);});}
      render();
    }catch(ex){alert("Hata: "+String(ex));}
  };
  reader.readAsArrayBuffer(file);
}

function _buildCRMData(rows){
  var dan={};
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    var name=(r["Son Eğitim Ekleyen"]||r["Son Egitim Ekleyen"]||r["Danışman"]||"").toString().trim();
    var ciro=parseFloat(String(r["Eğitim Ciro"]||r["Egitim Ciro"]||0).replace(/[^\d.]/g,""))||0;
    var tah=parseFloat(String(r["Tahsilat"]||0).replace(/[^\d.]/g,""))||0;
    var kur=parseInt(r["Kur"])||0;
    var ref=(r["Referans"]||"").toString().toUpperCase();
    var uzatma=ref.indexOf("UZATMA")>=0;
    if(!name)continue;
    if(!dan[name])dan[name]={name:name,ciro:0,tah:0,ogr:0,kur:0,yOgr:0,uOgr:0};
    dan[name].ciro+=ciro;dan[name].tah+=tah;dan[name].ogr++;dan[name].kur+=kur;
    if(uzatma)dan[name].uOgr++;else dan[name].yOgr++;
  }
  var arr=[];for(var k in dan)arr.push(dan[k]);
  return arr.sort(function(a,b){return b.ciro-a.ciro;});
}

function _buildCRMTable(arr,total){
  if(!arr.length)return'<div style="font-size:.8rem;color:#8A8474;padding:8px 0;">Veri yok.</div>';
  var th='padding:5px 7px;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;text-align:right;border-bottom:2px solid rgba(255,224,0,.3);white-space:nowrap;';
  var thL=th+'text-align:left;';
  var td='padding:4px 7px;font-size:.7rem;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap;';
  var tdL=td+'text-align:left;font-weight:700;color:#FFE000;';
  var rows=arr.map(function(d,i){
    var bg=i%2===0?"background:#161616;":"background:#141414;";
    return'<tr style="'+bg+'"><td style="'+tdL+'">'+(i+1)+'. '+escH(d.name)+'</td>'
      +'<td style="'+td+'color:#FFE000;font-weight:700;">'+tl(d.ciro)+'</td>'
      +'<td style="'+td+'">'+tl(d.tah)+'</td>'
      +'<td style="'+td+'">'+d.ogr+'</td>'
      +'<td style="'+td+'color:#a78bfa;">'+d.yOgr+'</td>'
      +'<td style="'+td+'color:#e67e22;">'+d.uOgr+'</td>'
      +'</tr>';
  }).join("");
  var tC=arr.reduce(function(s,d){return s+d.ciro;},0);
  var tT=arr.reduce(function(s,d){return s+d.tah;},0);
  var tO=arr.reduce(function(s,d){return s+d.ogr;},0);
  var tY=arr.reduce(function(s,d){return s+d.yOgr;},0);
  var tU=arr.reduce(function(s,d){return s+d.uOgr;},0);
  var tdT='padding:5px 7px;font-size:.68rem;font-weight:800;text-align:right;border-top:2px solid rgba(255,224,0,.3);background:rgba(255,224,0,.04);white-space:nowrap;';
  rows+='<tr><td style="'+tdT+'text-align:left;">TOPLAM ('+total+')</td>'
    +'<td style="'+tdT+'color:#FFE000;">'+tl(tC)+'</td>'
    +'<td style="'+tdT+'">'+tl(tT)+'</td>'
    +'<td style="'+tdT+'">'+tO+'</td>'
    +'<td style="'+tdT+'color:#a78bfa;">'+tY+'</td>'
    +'<td style="'+tdT+'color:#e67e22;">'+tU+'</td></tr>';
  return'<div style="overflow-x:auto;border-radius:8px;border:1px solid rgba(255,255,255,.08);">'
    +'<table style="width:100%;border-collapse:collapse;min-width:500px;"><thead><tr>'
    +'<th style="'+thL+'color:#FFE000;">Danışman</th>'
    +'<th style="'+th+'color:#FFE000;">Ciro</th>'
    +'<th style="'+th+'">Tahsilat</th>'
    +'<th style="'+th+'">T.Öğr.</th>'
    +'<th style="'+th+'color:#a78bfa;">Y.Öğr.</th>'
    +'<th style="'+th+'color:#e67e22;">K.Uzatma</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

        +'</div>';
    }).join("");
    body='<div style="background:#161616;border:1px solid rgba(192,57,43,.2);border-radius:8px;padding:14px;">'
      +'<div style="font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#c0392b;font-weight:700;margin-bottom:10px;">🗑 Şube Harita Sıfırla</div>'
      +sifirlaRows+'</div>';
  }

  else if(_adminTab==="firebase"){
    body='<div style="background:#161616;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:14px;">'
      +'<div style="font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#FFE000;font-weight:700;margin-bottom:10px;">☁️ Firebase Senkron</div>'
      +'<div style="display:flex;gap:7px;flex-wrap:wrap;">'
      +'<button id="fbPushBtn" style="padding:8px 14px;background:#FFE000;border:none;border-radius:5px;color:#000;font-family:Raleway,sans-serif;font-weight:800;font-size:.78rem;cursor:pointer;">⬆ Buluta Yükle</button>'
      +'<button id="fbPullBtn" style="padding:8px 12px;background:#0F0F0F;border:1px solid #7a6000;border-radius:5px;color:#FFE000;font-family:Raleway,sans-serif;font-weight:800;font-size:.78rem;cursor:pointer;">⬇ Buluttan Al</button>'
      +'</div>'
      +'<div id="fbSyncMsg" style="font-size:.74rem;min-height:16px;margin-top:6px;"></div>'
      +'</div>';
  }

  return'<div style="padding:16px 12px;max-width:820px;margin:0 auto;">'
    +'<div class="bb" style="font-size:1.6rem;color:#FFE000;margin-bottom:12px;">⚙️ Admin</div>'
    +tabBar+body+'</div>';
}

      +'<span style="color:#666;font-size:.7rem;">–</span>'
      +'<input class="barem-max" type="number" min="0" value="'+b.maxIl+'" placeholder="Son il (0=∞)" style="width:54px;padding:5px 6px;background:#0F0F0F;border:1px solid rgba(255,255,255,.08);color:#F0ECD8;font-family:Raleway,sans-serif;font-size:.74rem;border-radius:4px;outline:none;">'
      +'<input class="barem-odulstr" type="text" value="'+escH(b.odulStr||"")+'" placeholder="Ödül:adet,Ödül2:adet2" style="flex:1;min-width:150px;padding:5px 8px;background:#0F0F0F;border:1px solid rgba(255,255,255,.08);color:#F0ECD8;font-family:Raleway,sans-serif;font-size:.74rem;border-radius:4px;outline:none;">'
      +'<button onclick="baremDilimSil('+i+')" style="padding:4px 8px;background:none;border:1px solid rgba(192,57,43,.3);border-radius:4px;color:#c0392b;font-family:Raleway,sans-serif;font-size:.66rem;cursor:pointer;">✕</button>'
      +'</div>';
  }).join("");
  var preview=barem.length?'<div style="margin-top:8px;padding:8px 10px;background:#0a0a0a;border-radius:6px;border:1px solid rgba(255,255,255,.04);">'
    +'<div style="font-size:.6rem;color:#FFE000;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;">📋 Özet</div>'
    +barem.map(function(b){
      return'<div style="font-size:.68rem;color:#F0ECD8;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04);">'
        +'<span style="color:#FFE000;font-weight:700;">'+b.minIl+'–'+(b.maxIl===0?"∞":b.maxIl)+'. il:</span> '+escH(b.odulStr||"")+'</div>';
    }).join("")+'</div>':"";
  return'<div id="baremRows">'+rows+'</div>'+preview;

function baremDilimEkle(){
  var barem=(_haritaCfg["_global"]||{}).barem||[];
  barem.push({minIl:1,maxIl:0,odulStr:"Ödül:1"});
  if(!_haritaCfg["_global"])_haritaCfg["_global"]={};
  _haritaCfg["_global"].barem=barem;
  render();
}

function baremDilimSil(idx){
  var barem=(_haritaCfg["_global"]||{}).barem||[];
  barem.splice(idx,1);
  if(!_haritaCfg["_global"])_haritaCfg["_global"]={};
  _haritaCfg["_global"].barem=barem;
  render();
}

function baremKaydet(){
  var rows=document.querySelectorAll("#baremRows [data-barem]");
  var barem=[];
  for(var i=0;i<rows.length;i++){
    var minV=parseInt(rows[i].querySelector(".barem-min").value)||1;
    var maxV=parseInt(rows[i].querySelector(".barem-max").value)||0;
    var odulStr=rows[i].querySelector(".barem-odulstr").value.trim();
    if(!odulStr)continue;
    var odulTipler=odulStr.split(",").map(function(tok){
      var parts=tok.trim().split(":");
      return{ad:(parts[0]||"").trim(),sayi:parseInt(parts[1])||1};
    }).filter(function(t){return t.ad;});
    barem.push({minIl:minV,maxIl:maxV,odulStr:odulStr,odulTipler:odulTipler});
  }
  if(!_haritaCfg["_global"])_haritaCfg["_global"]={};
  _haritaCfg["_global"].barem=barem;
  lsSet("hHaritaCfg",_haritaCfg);
  fbSaveCfg();
  var msg=document.getElementById("baremMsg");
  if(msg){msg.textContent="✅ Barem kaydedildi!";msg.style.color="#FFE000";setTimeout(function(){if(msg)msg.textContent="";},2000);}
}

function haritaSifirla(subeId){
  showConfirm("Sıfırla?","<strong>"+subeId+"</strong> şubesinin tüm harita verisi silinecek.",function(){
    if(_haritaData[subeId])delete _haritaData[subeId];
    lsSet("hHaritaData",_haritaData);fbSaveHarita();render();
  });
}

    +'<p style="color:#8A8474;font-size:.84rem;margin-bottom:20px;line-height:1.7;">'+m.desc+'</p>'

    +'<button id="confirmOk" style="padding:11px 28px;background:#FFE000;border:none;border-radius:6px;color:#000;font-family:Raleway,sans-serif;font-weight:800;font-size:.84rem;cursor:pointer;">Evet</button>'
    +'</div></div></div>';

// ── EVENTS ──
function attachEvents(){
  // Tablar
  document.querySelectorAll("[data-tab]").forEach(function(btn){
    btn.addEventListener("click",function(){currentTab=btn.dataset.tab;render();});
  });

  // Şube seçici
  var subeSelect=document.getElementById("subeSelect");
  if(subeSelect)subeSelect.addEventListener("change",function(){_haritaSube=subeSelect.value;render();});

  // İl aç
  var ilAcBtn=document.getElementById("ilAcBtn");
  if(ilAcBtn)ilAcBtn.addEventListener("click",function(){
    var sel=document.getElementById("haritaPersonel");
    if(!sel||!sel.value)return;
    haritaAcIl(_haritaSube,sel.value);
  });

  // İl geri al
  var ilGeriBtn=document.getElementById("ilGeriBtn");
  if(ilGeriBtn)ilGeriBtn.addEventListener("click",function(){
    haritaGeriAl(_haritaSube);
  });

  // Admin sekme seçimi
  document.querySelectorAll("[data-admintab]").forEach(function(btn){
    btn.addEventListener("click",function(){_adminTab=btn.dataset.admintab;render();});
  });

  // Atama kaydet
  var atamaKaydetBtn=document.getElementById("atamaKaydetBtn");
  if(atamaKaydetBtn)atamaKaydetBtn.addEventListener("click",function(){
    document.querySelectorAll("[data-atama-player]").forEach(function(sel){
      var pn=sel.dataset.atamaPlayer;
      if(!_playerCfg[pn])_playerCfg[pn]={};
      _playerCfg[pn].subeId=sel.value||null;
    });
    lsSet("hPlayerCfg",_playerCfg);fbSaveCfg();
    var msg=document.getElementById("atamaMsg");
    if(msg){msg.textContent="✅ Atamalar kaydedildi!";msg.style.color="#FFE000";setTimeout(function(){if(msg)msg.textContent="";},2000);}
  });

  // İl ödül şube seçici
  var ilOdulSubeSel=document.getElementById("ilOdulSubeSelect");
  if(ilOdulSubeSel)ilOdulSubeSel.addEventListener("change",function(){
    _haritaSube=ilOdulSubeSel.value;
    _adminTab="ilodulleri";
    render();
  });

  // İl ödül kaydet — _haritaCfg'ye yaz (açılmadan önce tanımlı)
  var ilOdulKaydetBtn=document.getElementById("ilOdulKaydetBtn");
  if(ilOdulKaydetBtn)ilOdulKaydetBtn.addEventListener("click",function(){
    var inputs=document.querySelectorAll(".ilodul-input");
    if(!_haritaCfg["_ilOdulleri"])_haritaCfg["_ilOdulleri"]={};
    if(!_haritaCfg["_ilOdulleri"][_haritaSube])_haritaCfg["_ilOdulleri"][_haritaSube]={};
    inputs.forEach(function(inp){
      var no=inp.dataset.ilno;
      var val=parseInt(inp.value)||0;
      if(val>0)_haritaCfg["_ilOdulleri"][_haritaSube][no]=val;
      else delete _haritaCfg["_ilOdulleri"][_haritaSube][no];
    });
    lsSet("hHaritaCfg",_haritaCfg);fbSaveCfg();
    var msg=document.getElementById("ilOdulMsg");
    if(msg){msg.textContent="✅ İl ödülleri kaydedildi!";msg.style.color="#FFE000";setTimeout(function(){if(msg)msg.textContent="";},2000);}
  });

  // SVG haritaları render et
  document.querySelectorAll("[data-sube][data-acik]").forEach(function(div){
    renderSvgMap(div.id);
  });

  // İl detay
  document.querySelectorAll("[data-ildetay]").forEach(function(el){
    el.addEventListener("click",function(){
      var p=el.dataset.ildetay.split(",");haritaIlDetay(p[0],p[1]);
    });
  });

  // Modal
  var cm=document.getElementById("closeModal");
  if(cm)cm.addEventListener("click",function(){modalData=null;render();});
  var mOv=document.getElementById("modalOverlay");
  if(mOv)mOv.addEventListener("click",function(e){if(e.target===mOv){modalData=null;render();}});
  var cOk=document.getElementById("confirmOk");
  if(cOk)cOk.addEventListener("click",function(){var ok=confirmData.onOk;confirmData=null;render();ok();});
  var cCn=document.getElementById("confirmCancel");
  if(cCn)cCn.addEventListener("click",function(){confirmData=null;render();});
  var cOv=document.getElementById("confirmOverlay");
  if(cOv)cOv.addEventListener("click",function(e){if(e.target===cOv){confirmData=null;render();}});

  // Görev ekle
  var addCalBtn=document.getElementById("addCalBtn");
  if(addCalBtn)addCalBtn.addEventListener("click",function(){
    var dv=document.getElementById("calDate").value;
    var tv=document.getElementById("calTask").value.trim();
    var pv=parseInt(document.getElementById("calPrize").value)||0;
    if(!dv||!tv){alert("Tarih ve görev gerekli.");return;}
    var parts=dv.split("-");
    var dayKey=parts[0]+"-"+(parts[1].length<2?"0":"")+parts[1]+"-"+(parts[2].length<2?"0":"")+parts[2];
    var label=parseInt(parts[2])+"/"+parseInt(parts[1])+"/"+parts[0];
    var calId="hcal-"+Date.now();
    if(!_taskCfg.calendar)_taskCfg.calendar=[];
    _taskCfg.calendar.push({id:calId,dayKey:dayKey,label:label,taskText:tv,prize:pv,winners:[]});
    lsSet("hTaskCfg",_taskCfg);fbSaveGorev();
    document.getElementById("calTask").value="";document.getElementById("calPrize").value="";
    render();
  });

  // Admin: oyuncu ekle
  var addPlayerBtn=document.getElementById("addPlayerBtn");
  if(addPlayerBtn)addPlayerBtn.addEventListener("click",function(){
    var nm=document.getElementById("npName").value.trim();
    if(!nm)return;
    if(_players.find(function(p){return p.name.toLowerCase()===nm.toLowerCase();})){alert("Bu isim zaten var.");return;}
    _players.push({name:nm});lsSet("hPlayers",_players);fbSavePlayers();render();
  });

  // Admin: oyuncu sil
  document.querySelectorAll("[data-rmp]").forEach(function(btn){
    btn.addEventListener("click",function(){
      var i=parseInt(btn.dataset.rmp);
      showConfirm("Oyuncuyu Sil","<strong>"+escH(_players[i].name)+"</strong> silinsin mi?",function(){
        _players.splice(i,1);lsSet("hPlayers",_players);fbSavePlayers();render();
      });
    });
  });

  // Firebase push/pull
  var fbPushBtn=document.getElementById("fbPushBtn");
  if(fbPushBtn)fbPushBtn.addEventListener("click",function(){
    var msg=document.getElementById("fbSyncMsg");
    if(!_fbReady){if(msg)msg.textContent="Firebase bağlı değil.";return;}
    if(msg){msg.textContent="Yükleniyor...";msg.style.color="#F5C800";}
    var batch=_db.batch();
    batch.set(_db.doc(_FB_HARITA),{iller:_haritaData,ts:Date.now()});
    var _cfgMerged=Object.assign({},_haritaCfg,{_playerCfg:_playerCfg});
    batch.set(_db.doc(_FB_CFG),_cfgMerged);
    batch.set(_db.doc(_FB_IDDIA),{list:_iddiaList,ts:Date.now()});
    batch.set(_db.doc(_FB_GOREV),_taskCfg);
    batch.set(_db.doc(_FB_PLAYERS),{players:_players,ts:Date.now()});
    batch.commit().then(function(){if(msg){msg.textContent="✅ Buluta yüklendi!";msg.style.color="#FFE000";}})
      .catch(function(e){if(msg){msg.textContent="❌ "+String(e);msg.style.color="#c0392b";}});
  });

  var fbPullBtn=document.getElementById("fbPullBtn");
  if(fbPullBtn)fbPullBtn.addEventListener("click",function(){
    var msg=document.getElementById("fbSyncMsg");
    if(!_fbReady){if(msg)msg.textContent="Firebase bağlı değil.";return;}
    if(msg){msg.textContent="İndiriliyor...";msg.style.color="#F5C800";}
    init();
    setTimeout(function(){if(msg){msg.textContent="✅ Buluttan alındı!";msg.style.color="#FFE000";}},2000);
  });

  // Görev tarih filter
  var gs=document.getElementById("gorevStart");
  var ge=document.getElementById("gorevEnd");
  // (inline onclick ile çalışıyor)
}

// ── DOMContentLoaded ──
document.addEventListener("DOMContentLoaded",function(){
  var p=document.getElementById("loginPass");
  if(p)p.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
  var n=document.getElementById("loginName");
  if(n)n.addEventListener("keydown",function(e){if(e.key==="Enter"&&document.getElementById("loginPass"))document.getElementById("loginPass").focus();});
  try{
    var su=sessionStorage.getItem("hUser");var sa=sessionStorage.getItem("hAdmin");
    if(su){currentUser=su;isAdmin=sa==="1";showGame();return;}
  }catch(e){}
  // Firebase'den oyuncu listesini çek (login öncesi doğrulama için)
  if(_fbReady&&_db){
    _db.doc(_FB_PLAYERS).get().then(function(doc){
      if(doc.exists&&doc.data().players){_players=doc.data().players;}
    });
  }
});
</script>
