var ADMIN_USER="admin";
var ADMIN_PASS="admin123";
var currentUser=null;
var isAdmin=false;

function normStr(s){
  return s.replace(/İ/g,"i").replace(/I/g,"ı").replace(/Ğ/g,"ğ")
   .replace(/Ü/g,"ü").replace(/Ş/g,"ş").replace(/Ö/g,"ö").replace(/Ç/g,"ç").toLowerCase();
}
function doLogin(){
  var name=document.getElementById("loginName").value.trim();
  var pass=document.getElementById("loginPass").value.trim();
  var err=document.getElementById("loginErr");
  if(!name||!pass){err.textContent="Ad ve şifre gir.";return;}
  if(name.toLowerCase()===ADMIN_USER&&pass===ADMIN_PASS){
    currentUser="admin";isAdmin=true;showGame();return;
  }
  err.textContent="Kontrol ediliyor...";
  // Önce Firebase'den güncel cfg çek, sonra kontrol et
  function tryCheck(playerList){
    var found=null;
    for(var i=0;i<playerList.length;i++){
      if(normStr(playerList[i].name)===normStr(name)){found=playerList[i];break;}
    }
    if(!found){err.textContent="Bu isim listede yok.";return;}
    var exp=normStr(found.name.replace(/\s+/g,"")).substring(0,4);
    if(pass!==exp&&pass!==ADMIN_PASS){err.textContent="Şifre yanlış. (İpucu: adının ilk 4 harfi küçük)";return;}
    currentUser=found.name;isAdmin=false;showGame();
  }
  // Firebase'den çek
  if(_fbReady&&_db){
    _db.doc(_FB_DOC).get().then(function(doc){
      var fbCfg=doc.exists?doc.data()[SK_CFG]:null;
      if(fbCfg&&fbCfg.players&&fbCfg.players.length>0){
        // Firebase'deki cfg'yi kaydet
        cfg=fbCfg;
        try{localStorage.setItem(SK_CFG,JSON.stringify(cfg));}catch(e){}
        tryCheck(cfg.players);
      } else {
        // Firebase'de yok, local'den dene
        var lc=lsGet(SK_CFG);
        if(lc&&lc.players) tryCheck(lc.players);
        else err.textContent="Oyuncu listesi yüklenemedi. Admin ile iletişime geçin.";
      }
    }).catch(function(){
      // Firebase hatası, local'den dene
      var lc=lsGet(SK_CFG);
      if(lc&&lc.players) tryCheck(lc.players);
      else err.textContent="Bağlantı hatası. Tekrar deneyin.";
    });
  } else {
    // Firebase yok, local
    var lc=lsGet(SK_CFG);
    if(lc&&lc.players) tryCheck(lc.players);
    else{err.textContent="Yükleniyor...";setTimeout(doLogin,800);}
  }
}

  var ls=document.getElementById("loginScreen");
  var app=document.getElementById("app");
  if(ls) ls.style.display="none";
  if(app) app.style.display="block";
  init();
}
function loadTalepler(){
  var el=document.getElementById("talepList");
  if(!el)return;
  if(!_fbReady||!_db){el.textContent="Firebase bağlı değil.";return;}
  el.textContent="Yükleniyor...";
  _db.doc(_FB_DOC).get().then(function(doc){
    var data=doc.exists?doc.data():{};
    var talepler=data.talepler||[];
    if(!talepler.length){el.innerHTML="<span style='color:#3A3830;'>Henüz talep yok.</span>";return;}
    // En yeniden eskiye sırala
    talepler.sort(function(a,b){return b.ts-a.ts;});
    var html="";
    for(var i=0;i<Math.min(talepler.length,20);i++){
      var d=talepler[i];
      var dt=new Date(d.ts).toLocaleString("tr-TR");
      html+="<div style='display:flex;align-items:flex-start;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);gap:8px;'>"
        +"<div>"
        +"<div style='color:#FFE000;font-weight:700;font-size:.82rem;'>"+escH(d.from||"Anonim")+"</div>"
        +"<div style='color:#F0ECD8;margin:3px 0;font-size:.84rem;'>"+escH(d.req)+"</div>"
        +"<div style='color:#3A3830;font-size:.7rem;'>"+dt+"</div>"
        +"</div>"
        +"<button onclick='silTalep("+i+")' style='background:none;border:none;color:#c0392b;cursor:pointer;font-size:.9rem;flex-shrink:0;padding:2px 4px;'>✕</button>"
        +"</div>";
    }
    el.innerHTML=html;
  }).catch(function(e){el.textContent="Hata: "+String(e);});
}
function silTalep(idx){
  if(!_fbReady||!_db)return;
  _db.doc(_FB_DOC).get().then(function(doc){
    var data=doc.exists?doc.data():{};
    var talepler=data.talepler||[];
    talepler.sort(function(a,b){return b.ts-a.ts;});
    talepler.splice(idx,1);
    return _db.doc(_FB_DOC).set({talepler:talepler},{merge:true});
  }).then(function(){loadTalepler();})
  .catch(function(e){console.warn(e);});
}

function fbWrite(key,val){
  if(!_fbReady||!_db)return;
  var obj={};obj[key]=val;
  _db.doc(_FB_DOC).set(obj,{merge:true}).then(function(){
    // Başarılı yazma — badge göster
    var el=document.getElementById("fbBadge");
    if(el){el.textContent="☁ Kaydedildi";el.style.color="#4ADE80";el.style.display="block";setTimeout(function(){el.style.display="none";},1500);}

  });

function fbReadAll(cb){
  if(!_fbReady||!_db){cb(null);return;}
  _db.doc(_FB_DOC).get().then(function(doc){
    cb(doc.exists?doc.data():null);
  }).catch(function(e){console.warn("FB read:",e);cb(null);});
}
function fbListen(){
  if(!_fbReady||!_db)return;
  _db.doc(_FB_DOC).onSnapshot(function(doc){
    if(!doc.exists)return;
    var data=doc.data();
    var changed=false;
    ["iddiaList",SK_CFG,SK_GAME,SK_TASKS].forEach(function(k){
      if(!data[k])return;
      var nv=JSON.stringify(data[k]);
      var ov=localStorage.getItem(k);
      if(nv!==ov){
        localStorage.setItem(k,nv);
        sessionStorage.setItem(k,nv);
        changed=true;
      }
    });
    if(changed){
      // Diğer cihaz değiştirdi — yeniden yükle
      var fc=data[SK_CFG];
      if(fc&&fc.players){
        if(!fc.tiers)fc.tiers=DEF_TIERS;
        cfg=fc;
      }
      var fg=data[SK_GAME];
      if(fg) gs=mergeGame(fg,cfg);
      // iddiaList ayrıca güncelle
      if(data["iddiaList"]!==undefined){
        gs=Object.assign({},gs,{iddiaList:data["iddiaList"]});
        safeSetIddiaList(data["iddiaList"]);
      }
      if(data[SK_TASKS]) taskCfg=data[SK_TASKS];
      render();
      // Kısa bağlantı bildirimi
      var el=document.getElementById("fbBadge");
      if(el){el.style.display="block";setTimeout(function(){el.style.display="none";},2500);}
    }
  },function(e){console.warn("FB listen:",e);});
}
function lsGet(k){
  try{
    var v=localStorage.getItem(k);
    if(v) return JSON.parse(v);
    // localStorage boşsa sessionStorage'dan dene
    var sv=sessionStorage.getItem(k);
    if(sv) return JSON.parse(sv);
    return null;
  }catch(e){return null;}
}
function lsSet(k,v){
  // Timestamp ekle — senkron çakışması çözmek için
  if(k===SK_GAME&&v&&typeof v==="object") v._ts=Date.now();
  var s=JSON.stringify(v);
  try{localStorage.setItem(k,s);}catch(e){}
  try{sessionStorage.setItem(k,s);}catch(e){}
  if(k===SK_CFG||k===SK_GAME||k===SK_TASKS) fbWrite(k,v);
}
function shuffle(arr){
var a=arr.slice();
for(var i=a.length-1;i>0;i--){var j=0|Math.random()*(i+1);var tmp=a[i];a[i]=a[j];a[j]=tmp;}
return a;
}
function buildNewGame(cfg){
var pool=[];
cfg.prizes.forEach(p=>{for(var i=0;i<p.count;i++)pool.push(p.amount);});
var shuffled=shuffle(pool);
var boxes=[];var id=1;
cfg.players.forEach(p=>{
for(var n=1;n<=p.boxes;n++)boxes.push({id:id++,owner:p.name,num:n,prize:null,opened:false,openOrder:null});
});
return{boxes,prizePool:shuffled,openCount:0};
}
function safeGetIddiaList(){
  // iddiaList'i en güvenilir kaynaktan al
  if(gs&&gs.iddiaList&&gs.iddiaList.length>0) return gs.iddiaList;
  try{
    var raw=localStorage.getItem("iddiaListBackup");
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}
function safeSetIddiaList(list){
  if(!list||!list.length) return;
  try{localStorage.setItem("iddiaListBackup",JSON.stringify(list));}catch(e){}
}
function mergeGame(saved,cfg){
if(!saved||!saved.boxes||!saved.boxes.length)return buildNewGame(cfg);
var maxId=saved.boxes.reduce((m,b)=>Math.max(m,b.id),0);
var boxes=saved.boxes.slice();
var addedBoxCount=0;
cfg.players.forEach(p=>{
var existing=boxes.filter(b=>b.owner===p.name);
if(existing.length===0){
for(var n=1;n<=p.boxes;n++){
boxes.push({id:++maxId,owner:p.name,num:n,prize:null,opened:false,openOrder:null});
addedBoxCount++;
}
}else if(existing.length<p.boxes){
var nums=existing.map(b=>b.num);
for(var n=1;n<=p.boxes;n++)if(!nums.includes(n)){
boxes.push({id:++maxId,owner:p.name,num:n,prize:null,opened:false,openOrder:null});
addedBoxCount++;
}
}else if(existing.length>p.boxes){
var toRm=existing.filter(b=>!b.opened).slice(-(existing.length-p.boxes));
boxes=boxes.filter(b=>!toRm.includes(b));
}
});
var names=cfg.players.map(p=>p.name);
boxes=boxes.filter(function(b){return b.calendarId||b.task||names.includes(b.owner);});
var prizePool=(saved.prizePool||[]).slice();
if(addedBoxCount>0 && cfg.prizes && cfg.prizes.length>0){
var allPrizes=[];
cfg.prizes.forEach(p=>{for(var i=0;i<p.count;i++)allPrizes.push(p.amount);});
if(allPrizes.length>0){
for(var i=0;i<addedBoxCount;i++){
prizePool.push(allPrizes[0|Math.random()*allPrizes.length]);
}
for(var i=prizePool.length-1;i>0;i--){
var j=0|Math.random()*(i+1);
var tmp=prizePool[i];prizePool[i]=prizePool[j];prizePool[j]=tmp;
}
}
}
var savedIddiaList=saved.iddiaList&&saved.iddiaList.length>0
  ?saved.iddiaList
  :(gs&&gs.iddiaList&&gs.iddiaList.length>0?gs.iddiaList:[]);
return{
boxes:boxes,
prizePool:prizePool,
openCount:saved.openCount||0,
taskEarnings:saved.taskEarnings||{},
ruletDeltas:saved.ruletDeltas||{},
carkDeltas:saved.carkDeltas||{},
iddiaList:savedIddiaList,
iddiaDeltas:saved.iddiaDeltas||{}
};
}
function getTieredCap(openedCount,tiers){
for(var t of tiers)if(openedCount>=t.from&&openedCount<=t.to)return{min:t.minPrize||0,max:t.maxPrize};
var last=tiers[tiers.length-1];return{min:last.minPrize||0,max:last.maxPrize};
}
function computePrize(ownerName,boxes,prizePool,cfg){
if(!prizePool.length)return{prize:0,newPool:prizePool};
var ownerTotal=(cfg.players.find(p=>p.name===ownerName)||{boxes:1}).boxes;
var ownerOpened=boxes.filter(b=>b.owner===ownerName&&b.opened).length;
var ownerEarned=boxes.filter(b=>b.owner===ownerName&&b.opened&&b.prize>0).reduce((s,b)=>s+b.prize,0);
var nextOpen=ownerOpened+1;
var tier=getTieredCap(nextOpen,cfg.tiers);
var compRatio=Math.min(1,nextOpen/ownerTotal);
var rawCap=Math.round(tier.min+(tier.max-tier.min)*Math.pow(compRatio,0.5));
var pool=prizePool.slice();
var poolMin=Math.min.apply(null,pool);
var effectiveCap=Math.max(rawCap, ownerEarned===0 ? poolMin : 0);
var remaining=effectiveCap-ownerEarned;
var eligibleIdx=[];
for(var i=0;i<pool.length;i++){
if(pool[i]<=remaining) eligibleIdx.push(i);
}
if(eligibleIdx.length>0){
var candidates=eligibleIdx.slice(0,8);
var pick=candidates[0|Math.random()*candidates.length];
var prize=pool[pick];pool.splice(pick,1);
return{prize,newPool:pool};
}
if(ownerEarned===0){
var minIdx=pool.indexOf(poolMin);
var prize=pool[minIdx];pool.splice(minIdx,1);
return{prize,newPool:pool};
}
return{prize:0,newPool:pool};
}

function kaydetIddia(){
  var iddia=getIddiaForm();if(!iddia)return;
  // gs.iddiaList'e ekle
  if(!gs.iddiaList)gs.iddiaList=[];
  iddia.id=Date.now();
  gs=Object.assign({},gs,{iddiaList:gs.iddiaList.concat([iddia])});
  lsSet(SK_GAME,gs);
  closeIddiaModal();
  showModal("🎯","İddia Başlatıldı","<strong>"+escH(iddia.player)+"</strong>: "+escH(iddia.text)+"<br/>Tutar: "+iddia.tutar.toLocaleString("tr-TR")+" ₺",true);
  render();
}

function teklifIddia(){
  var iddia=getIddiaForm();if(!iddia)return;
  iddia.status="teklif";
  iddia.id=Date.now();
  // gs'e ekle
  if(!gs.iddiaList)gs.iddiaList=[];
  gs=Object.assign({},gs,{iddiaList:gs.iddiaList.concat([iddia])});
  lsSet(SK_GAME,gs);
  // Firebase'e AYRICA direkt yaz — senkron garantisi
  if(_fbReady&&_db){
    _db.doc(_FB_DOC).set({iddiaList:gs.iddiaList},{merge:true})
    .then(function(){console.log("Iddia Firebase yazildi");})
    .catch(function(e){console.warn("Iddia Firebase hata:",e);});
  }
  closeIddiaModal();
  showModal("📨","Teklif Gönderildi","Admin onaylaması bekleniyor.",true);
  render();
}

function sonuclandirIddia(iddiaId, kazandi){
  if(!gs.iddiaList)return;
  var newList=gs.iddiaList.map(function(id){
    if(id.id!==iddiaId)return id;
    var delta=kazandi?id.kazanc:-id.kayip;
    var updated=Object.assign({},id,{status:kazandi?"kazandi":"kaybetti",delta:delta,sonucTs:Date.now()});
    // Skora yansıt
    if(!gs.iddiaDeltas)gs.iddiaDeltas={};
    var newDeltas=Object.assign({},gs.iddiaDeltas);
    newDeltas[id.player]=(newDeltas[id.player]||0)+delta;
    gs=Object.assign({},gs,{iddiaDeltas:newDeltas});
    return updated;
  });
  gs=Object.assign({},gs,{iddiaList:newList});
  lsSet(SK_GAME,gs);
  render();
}

function requestGorev(){
  var req=prompt("Görev talebini yaz. Admin görecek:");
  if(!req||!req.trim())return;
  var msg={from:currentUser||"Anonim",req:req.trim(),ts:Date.now()};
  // Talepleri oyun dokümanına yaz (ayrı koleksiyon yerine)
  if(_fbReady&&_db){
    _db.doc(_FB_DOC).get().then(function(doc){
      var data=doc.exists?doc.data():{};
      var talepler=data.talepler||[];
      talepler.push(msg);
      return _db.doc(_FB_DOC).set({talepler:talepler},{merge:true});
    }).then(function(){
      showModal("📨","Talep Gönderildi","Talebiniz admin'e iletildi.",true);
    }).catch(function(e){
      showModal("📨","Hata",""+String(e),false);
    });
  } else {
    showModal("📨","Talep","Firebase bağlı değil.",false);
  }
}
function openTodayTask(){
  var today3=new Date();
  var tk3=today3.getFullYear()+"-"+(today3.getMonth()+1<10?"0"+(today3.getMonth()+1):""+(today3.getMonth()+1))+"-"+(today3.getDate()<10?"0"+today3.getDate():""+today3.getDate());
  var box=null;
  for(var i=0;i<gs.boxes.length;i++){if(gs.boxes[i].calendarDay===tk3){box=gs.boxes[i];break;}}
  if(!box){showModal("📅","Bugün Görev Yok","Bugüne ait takvim kutusu bulunamadı.",false);return;}
  if(!box.opened){
    if(!isAdmin){showModal("🔒","Kilitli","Bu kutuyu yönetici açacak.",false);return;}
    openBox(box.id);
  } else {
    showTaskIntro(box);
  }
}

function silIddia(iddiaId){
  if(!confirm("Bu iddia silinsin mi?"))return;
  if(!gs.iddiaList)return;
  gs=Object.assign({},gs,{iddiaList:gs.iddiaList.filter(function(id){return id.id!==iddiaId;})});
  lsSet(SK_GAME,gs);syncIddiaFB();render();
}

function kaydetDuzenle(iddiaId){
  var player=document.getElementById("editIddiaPlayer").value;
  var text=document.getElementById("editIddiaText").value.trim();
  var tutar=parseFloat(document.getElementById("editIddiaTutar").value)||0;
  var winOran=parseFloat(document.getElementById("editWinOran").value)||1.5;
  var loseOran=parseFloat(document.getElementById("editLoseOran").value)||2;
  if(!player||!text||!tutar){alert("Tüm alanları doldur.");return;}
  var newList=(gs.iddiaList||[]).map(function(id){
    if(id.id!==iddiaId)return id;
    return Object.assign({},id,{
      player:player,text:text,tutar:tutar,winOran:winOran,loseOran:loseOran,
      kazanc:Math.round(tutar*winOran),kayip:Math.round(tutar*loseOran)
    });
  });
  gs=Object.assign({},gs,{iddiaList:newList});
  lsSet(SK_GAME,gs);
  closeIddiaModal();
  render();
}

function syncIddiaFB(){
  if(_fbReady&&_db&&gs.iddiaList){
    _db.doc(_FB_DOC).set({iddiaList:gs.iddiaList},{merge:true}).catch(function(e){console.warn(e);});
  }
}
function onaylaIddia(iddiaId){
  if(!gs.iddiaList)return;
  var newList=gs.iddiaList.map(function(id){
    return id.id===iddiaId?Object.assign({},id,{status:"bekliyor"}):id;
  });
  gs=Object.assign({},gs,{iddiaList:newList});
  lsSet(SK_GAME,gs);syncIddiaFB();render();
}
function reddetIddia(iddiaId){
  if(!gs.iddiaList)return;
  var newList=gs.iddiaList.filter(function(id){return id.id!==iddiaId;});
  gs=Object.assign({},gs,{iddiaList:newList});
  lsSet(SK_GAME,gs);syncIddiaFB();render();
}

function initCRMEvents(){
  var inp=document.getElementById("crmFileInput");
  if(!inp||inp._crmBound)return;
  inp._crmBound=true;
  inp.addEventListener("change",function(e){

      try{

function parseCRM(rows){
  // Danışman bazlı topla
  var danismanlar={};
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    var dan=(r["Son Eğitim Ekleyen"]||r["Son Egitim Ekleyen"]||"").toString().trim();
    var ref=(r["Referans"]||"").toString().trim().toUpperCase();
    var kur=parseInt(r["Kur"])||0;
    var ciro=parseFloat(r["Eğitim Ciro"]||r["Egitim Ciro"]||0)||0;
    var tahsilat=parseFloat(r["Tahsilat"]||0)||0;
    var isKurUzatma=ref.indexOf("KUR UZATMA")>=0;
    if(!dan)continue;
    if(!danismanlar[dan])danismanlar[dan]={
      dan:dan,
      toplamCiro:0,toplamTahsilat:0,
      toplamOgrenci:0,toplamKur:0,
      yeniOgrenci:0,yeniKur:0,
      kurUzatmaOgrenci:0,kurUzatmaKur:0
    };
    var d=danismanlar[dan];
    d.toplamCiro+=ciro;
    d.toplamTahsilat+=tahsilat;
    d.toplamOgrenci++;
    d.toplamKur+=kur;
    if(isKurUzatma){
      d.kurUzatmaOgrenci++;
      d.kurUzatmaKur+=kur;
    }else{
      d.yeniOgrenci++;
      d.yeniKur+=kur;
    }
  }
  // Diziye çevir ve toplam ciroya göre sırala
  var arr=[];
  for(var k in danismanlar)arr.push(danismanlar[k]);
  arr.sort(function(a,b){return b.toplamCiro-a.toplamCiro;});
  renderCRM(arr,rows.length);
}

function openBox(boxId){
var box=gs.boxes.find(function(b){return b.id===boxId;});
if(!isAdmin){showModal("🔒","Sadece Admin","Kutular sadece yönetici tarafından açılabilir.",false);return;}
if(!box||box.opened)return;
if(box.calendarDay){
var today=new Date(),todayKey=today.getFullYear()+"-"+(today.getMonth()+1)+"-"+today.getDate();
if(box.calendarDay>todayKey){
showModal("🔒","Henüz Açılamaz","Bu kutu <strong>"+escH(box.calendarLabel)+"</strong> gününe ait.",false);
return;
}
}
var snap=JSON.parse(JSON.stringify(gs));
undoStack=undoStack.concat([snap]).slice(-10);lsSet(SK_UNDO,undoStack);
if(box.task){
gs.boxes=gs.boxes.map(function(b){return b.id===boxId?Object.assign({},b,{opened:true,openOrder:null}):b;});
lsSet(SK_GAME,gs);
var elc=document.querySelector("[data-boxid=\""+boxId+"\"");
if(elc){elc.classList.add("flipped","opened");}
setTimeout(function(){showTaskIntro(box);},650);
return;
}
// Sabit atanmış ödül varsa onu kullan, yoksa computePrize
var prize, newPool;
var fixedPrize = box.prize && box.prize > 0 ? box.prize : 0;
if(fixedPrize > 0){
  prize = fixedPrize;
  newPool = gs.prizePool;
} else {
  var res = computePrize(box.owner, gs.boxes, gs.prizePool, cfg, box.id);
  prize = res.prize;
  newPool = res.newPool;
  // Boş kutu önlemi: her zaman en az min ödül ver
  if(prize === 0 && newPool.length > 0){
    var minP = Math.min.apply(null, newPool);
    var minIdx = newPool.indexOf(minP);
    prize = minP;
    newPool = newPool.slice();
    newPool.splice(minIdx, 1);
  }
  if(prize === 0 && cfg.prizes && cfg.prizes.length > 0){
    prize = cfg.prizes.reduce(function(m,p){return Math.min(m,p.amount);}, cfg.prizes[0].amount);
  }
}
gs.boxes=gs.boxes.map(function(b){return b.id===boxId?Object.assign({},b,{prize:prize,opened:true,openOrder:gs.openCount+1}):b;});
gs=Object.assign({},gs,{prizePool:newPool,openCount:gs.openCount+1});
lsSet(SK_GAME,gs);
var el=document.querySelector("[data-boxid=\""+boxId+"\"]");
if(el){el.classList.add("flipped","opened");el.style.cursor="default";}
setTimeout(function(){
showModal(prize>0?"🎉":"😔",prize>0?prize.toLocaleString("tr-TR")+" ₺":"Boş Kutu",
prize>0?"<strong>"+escH(box.owner)+"</strong>'in <strong>#"+box.num+"</strong> kutusundan ödül çıktı!":"<strong>"+escH(box.owner)+"</strong>'in kutusu boştu.",prize>0);
if(prize>0)spawnConfetti();
},650);
}

function addPrize(){
var amount=parseInt(newPrizeAmount)||0,count=parseInt(newPrizeCount)||0;
if(amount<1||count<1)return;
var prizes=cfg.prizes.slice();var ex=prizes.find(function(p){return p.amount===amount;});
if(ex)ex.count+=count;else prizes.push({amount:amount,count:count});
prizes.sort(function(a,b){return a.amount-b.amount;});
cfg=Object.assign({},cfg,{prizes:prizes});
var newItems=[];for(var i=0;i<count;i++)newItems.push(amount);
var merged=gs.prizePool.concat(newItems);
for(var i=merged.length-1;i>0;i--){var j=0|Math.random()*(i+1);var tmp=merged[i];merged[i]=merged[j];merged[j]=tmp;}
gs=Object.assign({},gs,{prizePool:merged});
lsSet(SK_CFG,cfg);lsSet(SK_GAME,gs);
newPrizeAmount="";newPrizeCount="";
var saved=lsGet(SK_GAME);var mn=saved&&saved.prizePool&&saved.prizePool.length?Math.min.apply(null,saved.prizePool):"?";
render();
var fl=document.createElement("div");
fl.textContent="✅ "+count+"× "+amount.toLocaleString("tr-TR")+"₺ eklendi · Min: "+mn+"₺";
fl.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a3a1a;border:1px solid #FFE000;color:#FFE000;padding:9px 18px;border-radius:8px;font-family:Raleway,sans-serif;font-weight:700;font-size:.8rem;z-index:9999;max-width:90vw;text-align:center;";
document.body.appendChild(fl);setTimeout(function(){fl.remove();},3000);
}
function rebuildPool(){
var full=[];cfg.prizes.forEach(function(p){for(var i=0;i<p.count;i++)full.push(p.amount);});
var used=[];gs.boxes.forEach(function(b){if(b.opened&&b.prize>0)used.push(b.prize);});
var rem=full.slice();used.forEach(function(v){var idx=rem.indexOf(v);if(idx>=0)rem.splice(idx,1);});
for(var i=rem.length-1;i>0;i--){var j=0|Math.random()*(i+1);var t=rem[i];rem[i]=rem[j];rem[j]=t;}
gs=Object.assign({},gs,{prizePool:rem});lsSet(SK_GAME,gs);render();
var mn=rem.length?Math.min.apply(null,rem):"—";
var fl=document.createElement("div");
fl.textContent="✅ Havuz yeniden oluşturuldu · "+rem.length+" ödül · Min: "+mn+"₺";
fl.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a3a1a;border:1px solid #FFE000;color:#FFE000;padding:9px 18px;border-radius:8px;font-family:Raleway,sans-serif;font-weight:700;font-size:.8rem;z-index:9999;max-width:90vw;";
document.body.appendChild(fl);setTimeout(function(){fl.remove();},3500);
}
function closeBox(){
var pn=document.getElementById("closeBoxPlayer").value;
var bn=parseInt(document.getElementById("closeBoxNum").value)||0;
var msg=document.getElementById("closeBoxMsg");
if(!pn||!bn){msg.textContent="Oyuncu ve kutu # gir.";msg.style.color="#c0392b";return;}
var box=null;
for(var i=0;i<gs.boxes.length;i++){
  if(gs.boxes[i].owner===pn&&gs.boxes[i].num===bn){box=gs.boxes[i];break;}
}
if(!box){msg.textContent="Kutu bulunamadi.";msg.style.color="#c0392b";return;}
if(!box.opened){msg.textContent="Bu kutu zaten kapali.";msg.style.color="#8A8474";return;}
// Ödülü havuza iade et
var newPool=gs.prizePool.slice();
if(box.prize&&box.prize>0) newPool.push(box.prize);
// Kutuyu sifirla
var newBoxes=gs.boxes.map(function(b){
  return b.id===box.id?Object.assign({},b,{opened:false,prize:null,openOrder:null,taskWinners:null}):b;
});
// openCount'u bir azalt
var newCount=Math.max(0,(gs.openCount||1)-1);
gs=Object.assign({},gs,{boxes:newBoxes,prizePool:newPool,openCount:newCount});
lsSet(SK_GAME,gs);
msg.textContent="✅ "+pn+" #"+bn+" kapatialdi, ödül havuza iade edildi.";
msg.style.color="#4ADE80";
render();
}

function fixBox(){
var pn=document.getElementById("fixBoxPlayer").value;
var bn=parseInt(document.getElementById("fixBoxNum").value)||0;
var bp=parseInt(document.getElementById("fixBoxPrize").value)||0;
var msg=document.getElementById("fixBoxMsg");
if(!pn||!bn||!bp){msg.textContent="Tüm alanları doldur.";msg.style.color="#c0392b";return;}
var box=null;
for(var i=0;i<gs.boxes.length;i++){
  if(gs.boxes[i].owner===pn&&gs.boxes[i].num===bn&&!gs.boxes[i].task&&!gs.boxes[i].calendarId){
    box=gs.boxes[i];break;
  }
}
if(!box){msg.textContent="Kutu bulunamadi (takvim/gorev kutulari atanamaz).";msg.style.color="#c0392b";return;}
gs=Object.assign({},gs,{boxes:gs.boxes.map(function(b){return b.id===box.id?Object.assign({},b,{prize:bp}):b;})});
lsSet(SK_GAME,gs);msg.textContent="✅ "+pn+" #"+bn+" → "+bp.toLocaleString("tr-TR")+"₺";msg.style.color="#4ADE80";render();
}
function addCalBox(){
var dv=document.getElementById("calDate").value;
var tv=document.getElementById("calTask").value.trim();
var pv=parseInt(document.getElementById("calPrize").value)||0;
var ov=document.getElementById("calOwner").value;
if(!dv||!tv){alert("Tarih ve görev gerekli.");return;}
var parts=dv.split("-");
var label=parseInt(parts[2])+"/"+parseInt(parts[1])+"/"+parts[0];
var dayKey=parts[0]+"-"+(parts[1].length<2?"0":"")+parts[1]+"-"+(parts[2].length<2?"0":"")+parts[2];
var calId="cal-"+Date.now();
taskCfg.calendar.push({id:calId,date:dv,dayKey:dayKey,label:label,taskText:tv,prize:pv,owner:ov});
var maxId=gs.boxes.reduce(function(m,b){return Math.max(m,b.id);},0);
gs.boxes.push({id:++maxId,owner:ov||"__ortak__",num:taskCfg.calendar.length,prize:null,opened:false,openOrder:null,task:{text:tv,prize:pv},calendarId:calId,calendarDay:dayKey,calendarLabel:label});
lsSet(SK_TASKS,taskCfg);lsSet(SK_GAME,gs);
document.getElementById("calTask").value="";document.getElementById("calPrize").value="";render();
}
function addMayBoxes(){
// confirm() kaldırıldı — direkt çalışır
var newBoxes=gs.boxes.filter(function(b){if(!b.calendarId||!b.calendarDay)return true;return b.calendarDay.indexOf("2026-05-")<0&&b.calendarDay.indexOf("2026-5-")<0;});
if(!taskCfg.calendar)taskCfg.calendar=[];
taskCfg.calendar=(taskCfg.calendar||[]).filter(function(c){return !c.id||c.id.indexOf("cal-may26-")<0;});
var maxId=newBoxes.reduce(function(m,b){return Math.max(m,b.id);},0);
var dT=[
"Bugun ilk kayit girene",
"Bugun en fazla kayit girene",
"Bugun geri donus alan kisiye",
"Bugun randevu alan kisiye",
"Bugun demo yapana",
"Bugun en cok arama yapana",
"Bugun en erken gelene",
"Bugun en gec kalanina",
"Bugun cift kayit girene",
"Bugun kapanis yapana",
"Bugun hedefini asana",
"Bugun yeni musteri getirene",
"Bugun en iyi sunum yapana",
"Bugun sosyal medya paylasimi yapana",
"Bugun ilk ise gelene",
"Bugun musteri memnuniyeti alana",
"Bugun referans getirene",
"Bugun en hizli donus yapana",
"Bugun takim oyuncusu olan",
"Bugun en cok guldurence",
"Bugun motivasyon konusmasi yapana",
"Bugun hedefe en yakin olana",
"Bugun en iyi iletisim kurana",
"Bugun en cok caba gosterene",
"Bugun yaratici fikir getirene",
"Bugun en pozitif olan",
"Bugun surpriz odul",
"Bugun en verimli calisana",
"Bugun mentorluk yapana",
"Bugun tum hedeflerini tamamlayana",
"Mayis ayinin en iyisi"
];
for(var d=1;d<=31;d++){
var mm="05";var dd=d<10?"0"+d:""+d;var dKey="2026-"+mm+"-"+dd;
var lbl=d+"/05";
var cId="cal-may26-"+d;
var txt=dT[d-1]||("Mayis "+d+". gun gorevi");
taskCfg.calendar.push({id:cId,date:"2026-05-"+(d<10?"0"+d:""+d),dayKey:dKey,label:lbl,taskText:txt,prize:0,owner:""});
newBoxes.push({id:++maxId,owner:"__ortak__",num:d,prize:null,opened:false,openOrder:null,task:{text:txt,prize:0},calendarId:cId,calendarDay:dKey,calendarLabel:lbl});
}
gs=Object.assign({},gs,{boxes:newBoxes});
lsSet(SK_TASKS,taskCfg);lsSet(SK_GAME,gs);
currentTab="game";
render();
}
function addTaskBox(){
var owner=document.getElementById("taskOwner").value;
var num=parseInt(document.getElementById("taskBoxNum").value)||0;
var text=document.getElementById("taskText").value.trim();
var prize=parseInt(document.getElementById("taskPrize").value)||0;
var msg=document.getElementById("taskBoxMsg");
if(!owner||!num||!text){msg.textContent="Oyuncu, kutu # ve görev metni gerekli.";msg.style.color="#c0392b";return;}
var box=null;for(var i=0;i<gs.boxes.length;i++){if(gs.boxes[i].owner===owner&&gs.boxes[i].num===num&&!gs.boxes[i].opened){box=gs.boxes[i];break;}}
if(!box){msg.textContent="Kutu bulunamadı veya açık.";msg.style.color="#c0392b";return;}
gs=Object.assign({},gs,{boxes:gs.boxes.map(function(b){return b.id===box.id?Object.assign({},b,{task:{text:text,prize:prize},prize:null}):b;})});
lsSet(SK_GAME,gs);msg.textContent="✅ Görev atandı.";msg.style.color="#4ADE80";render();
}
// Kapanırken sessionStorage'a yedekle
window.addEventListener("pagehide",function(){
  try{
    if(cfg) sessionStorage.setItem(SK_CFG, JSON.stringify(cfg));
    if(gs)  sessionStorage.setItem(SK_GAME, JSON.stringify(gs));
    if(taskCfg) sessionStorage.setItem(SK_TASKS, JSON.stringify(taskCfg));
  }catch(e){}
});
window.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"){
    try{
      if(cfg) sessionStorage.setItem(SK_CFG, JSON.stringify(cfg));
      if(gs)  sessionStorage.setItem(SK_GAME, JSON.stringify(gs));
      if(taskCfg) sessionStorage.setItem(SK_TASKS, JSON.stringify(taskCfg));
    }catch(e){}
  }
});
init();</script>
