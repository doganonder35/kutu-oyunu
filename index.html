var ADMIN_PASS="admin123";
var currentUser=null;

function normStr(s){
  return s.replace(/İ/g,"i").replace(/I/g,"ı").replace(/Ğ/g,"ğ")
    .replace(/Ü/g,"ü").replace(/Ş/g,"ş").replace(/Ö/g,"ö").replace(/Ç/g,"ç").toLowerCase();
}
function doLogin(){
  var name=document.getElementById("loginName").value.trim();
  var pass=document.getElementById("loginPass").value.trim();
  var err=document.getElementById("loginErr");
  if(!name||!pass){err.textContent="Ad ve şifre gir.";return;}
  if(name.toLowerCase()==="admin"&&pass===ADMIN_PASS){
    currentUser="admin";isAdmin=true;showGame();return;
  }
  err.textContent="Kontrol ediliyor...";
  function tryCheck(players){
    var found=null;
    for(var i=0;i<players.length;i++){
      if(normStr(players[i].name)===normStr(name)){found=players[i];break;}
    }
    if(!found){err.textContent="Bu isim listede yok.";return;}
    var exp=normStr(found.name.replace(/\s+/g,"")).substring(0,4);
    if(pass!==exp&&pass!==ADMIN_PASS){err.textContent="Şifre yanlış. (İlk 4 harf küçük)";return;}
    currentUser=found.name;isAdmin=false;showGame();
  }
  if(_fbReady&&_db){
    _db.doc(_FB_DOC).get().then(function(doc){
      var fbCfg=doc.exists?doc.data()[SK_CFG]:null;
      if(fbCfg&&fbCfg.players&&fbCfg.players.length>0){
        cfg=fbCfg;try{localStorage.setItem(SK_CFG,JSON.stringify(cfg));}catch(e){}
        tryCheck(cfg.players);
      } else {
        var lc=lsGet(SK_CFG);
        if(lc&&lc.players)tryCheck(lc.players);
        else err.textContent="Oyuncu listesi yüklenemedi.";
      }
    }).catch(function(){
      var lc=lsGet(SK_CFG);
      if(lc&&lc.players)tryCheck(lc.players);
      else err.textContent="Bağlantı hatası.";
    });
  } else {
    var lc=lsGet(SK_CFG);
    if(lc&&lc.players)tryCheck(lc.players);
    else{err.textContent="Yükleniyor...";setTimeout(doLogin,800);}
  }
}

function doLogout(){

function fbWrite(key,val){
  if(!_fbReady||!_db)return;
  var obj={};obj[key]=val;
  _db.doc(_FB_DOC).set(obj,{merge:true}).catch(function(e){console.warn("FB write:",e);});
}
function fbLoad(cb){
  if(!_fbReady||!_db){cb(null);return;}
  _db.doc(_FB_DOC).get().then(function(doc){cb(doc.exists?doc.data():null);}).catch(function(){cb(null);});
}
function fbListen(){
  if(!_fbReady||!_db)return;
  _db.doc(_FB_DOC).onSnapshot(function(doc){
    if(!doc.exists)return;
    var data=doc.data();
    var changed=false;
    [SK_CFG,SK_GAME,SK_TASKS,"iddiaList"].forEach(function(k){
      if(!data[k])return;
      var nv=JSON.stringify(data[k]);
      var ov=localStorage.getItem(k);
      if(nv!==ov){localStorage.setItem(k,nv);changed=true;}
    });
    if(changed){
      var fc=data[SK_CFG];
      if(fc&&fc.players){if(!fc.tiers)fc.tiers=DEF_TIERS;cfg=fc;}
      var fg=data[SK_GAME];
      if(fg)gs=mergeGame(fg,cfg);
      if(data.iddiaList)gs=Object.assign({},gs,{iddiaList:data.iddiaList});
      if(data[SK_TASKS])taskCfg=data[SK_TASKS];
      render();
    }
  },function(e){console.warn("FB listen:",e);});
}
function lsGet(k){
  try{
    var v=localStorage.getItem(k);
    if(v) return JSON.parse(v);
    // localStorage boşsa sessionStorage'dan dene
    var sv=sessionStorage.getItem(k);
    if(sv) return JSON.parse(sv);
    return null;
  }catch(e){return null;}
}
function lsSet(k,v){
  var s=JSON.stringify(v);
  try{localStorage.setItem(k,s);}catch(e){}
  try{sessionStorage.setItem(k,s);}catch(e){}
  if(k===SK_CFG||k===SK_GAME||k===SK_TASKS)fbWrite(k,v);
}
function shuffle(arr){
var a=arr.slice();
for(var i=a.length-1;i>0;i--){var j=0|Math.random()*(i+1);var tmp=a[i];a[i]=a[j];a[j]=tmp;}
return a;
}
function buildNewGame(cfg){
var pool=[];
cfg.prizes.forEach(p=>{for(var i=0;i<p.count;i++)pool.push(p.amount);});
var shuffled=shuffle(pool);
var boxes=[];var id=1;
cfg.players.forEach(p=>{
for(var n=1;n<=p.boxes;n++)boxes.push({id:id++,owner:p.name,num:n,prize:null,opened:false,openOrder:null});
});
return{boxes,prizePool:shuffled,openCount:0};
}
function mergeGame(saved,cfg){
if(!saved||!saved.boxes||!saved.boxes.length)return buildNewGame(cfg);
var maxId=saved.boxes.reduce((m,b)=>Math.max(m,b.id),0);
var boxes=saved.boxes.slice();
var addedBoxCount=0;
cfg.players.forEach(p=>{
var existing=boxes.filter(b=>b.owner===p.name);
if(existing.length===0){
for(var n=1;n<=p.boxes;n++){
boxes.push({id:++maxId,owner:p.name,num:n,prize:null,opened:false,openOrder:null});
addedBoxCount++;
}
}else if(existing.length<p.boxes){
var nums=existing.map(b=>b.num);
for(var n=1;n<=p.boxes;n++)if(!nums.includes(n)){
boxes.push({id:++maxId,owner:p.name,num:n,prize:null,opened:false,openOrder:null});
addedBoxCount++;
}
}else if(existing.length>p.boxes){
var toRm=existing.filter(b=>!b.opened).slice(-(existing.length-p.boxes));
boxes=boxes.filter(b=>!toRm.includes(b));
}
});
var names=cfg.players.map(p=>p.name);
boxes=boxes.filter(function(b){return b.calendarId||b.task||names.includes(b.owner);});
var prizePool=(saved.prizePool||[]).slice();
if(addedBoxCount>0 && cfg.prizes && cfg.prizes.length>0){
var allPrizes=[];
cfg.prizes.forEach(p=>{for(var i=0;i<p.count;i++)allPrizes.push(p.amount);});
if(allPrizes.length>0){
for(var i=0;i<addedBoxCount;i++){
prizePool.push(allPrizes[0|Math.random()*allPrizes.length]);
}
for(var i=prizePool.length-1;i>0;i--){
var j=0|Math.random()*(i+1);
var tmp=prizePool[i];prizePool[i]=prizePool[j];prizePool[j]=tmp;
}
}
}
return{
boxes:boxes,
prizePool:prizePool,
openCount:saved.openCount||0,
taskEarnings:saved.taskEarnings||{},
ruletDeltas:saved.ruletDeltas||{},
carkDeltas:saved.carkDeltas||{},
iddiaList:saved.iddiaList||(gs?gs.iddiaList:[]),
iddiaDeltas:saved.iddiaDeltas||{}
};
}
function getTieredCap(openedCount,tiers){
for(var t of tiers)if(openedCount>=t.from&&openedCount<=t.to)return{min:t.minPrize||0,max:t.maxPrize};
var last=tiers[tiers.length-1];return{min:last.minPrize||0,max:last.maxPrize};
}
function computePrize(ownerName,boxes,prizePool,cfg){
if(!prizePool.length)return{prize:0,newPool:prizePool};
var ownerTotal=(cfg.players.find(p=>p.name===ownerName)||{boxes:1}).boxes;
var ownerOpened=boxes.filter(b=>b.owner===ownerName&&b.opened).length;
var ownerEarned=boxes.filter(b=>b.owner===ownerName&&b.opened&&b.prize>0).reduce((s,b)=>s+b.prize,0);
var nextOpen=ownerOpened+1;
var tier=getTieredCap(nextOpen,cfg.tiers);
var compRatio=Math.min(1,nextOpen/ownerTotal);
var rawCap=Math.round(tier.min+(tier.max-tier.min)*Math.pow(compRatio,0.5));
var pool=prizePool.slice();
var poolMin=Math.min.apply(null,pool);
var effectiveCap=Math.max(rawCap, ownerEarned===0 ? poolMin : 0);
var remaining=effectiveCap-ownerEarned;
var eligibleIdx=[];
for(var i=0;i<pool.length;i++){
if(pool[i]<=remaining) eligibleIdx.push(i);
}
if(eligibleIdx.length>0){
var candidates=eligibleIdx.slice(0,8);
var pick=candidates[0|Math.random()*candidates.length];
var prize=pool[pick];pool.splice(pick,1);
return{prize,newPool:pool};
}
if(ownerEarned===0){
var minIdx=pool.indexOf(poolMin);
var prize=pool[minIdx];pool.splice(minIdx,1);
return{prize,newPool:pool};
}
return{prize:0,newPool:pool};
}

function init(){
  // Önce localStorage'dan göster
  var c=lsGet(SK_CFG);
  if(!c||!c.players)c={players:DEF_PLAYERS,prizes:DEF_PRIZES,tiers:DEF_TIERS};
  if(!c.tiers||!Array.isArray(c.tiers))c.tiers=DEF_TIERS;
  var g=lsGet(SK_GAME);
  g=mergeGame(g,c);
  cfg=c;gs=g;
  undoStack=lsGet(SK_UNDO)||[];
  taskCfg=lsGet(SK_TASKS)||{tasks:[],calendar:[]};
  // CRM verilerini yükle
  if(!_kRows){try{var ks=localStorage.getItem("kisiRows");if(ks)_kRows=JSON.parse(ks);}catch(e){}}
  if(!_crmRows){try{var cs=localStorage.getItem("crmRows");if(cs)_crmRows=JSON.parse(cs);}catch(e){}}
  render();
  // Firebase'den güncel veriyi çek
  fbLoad(function(data){
    if(!data)return fbListen();
    var changed=false;
    var fc=data[SK_CFG];
    if(fc&&fc.players){if(!fc.tiers)fc.tiers=DEF_TIERS;cfg=fc;changed=true;}
    var fg=data[SK_GAME];
    if(fg){gs=mergeGame(fg,cfg);if(data.iddiaList)gs=Object.assign({},gs,{iddiaList:data.iddiaList});changed=true;}
    if(data[SK_TASKS]){taskCfg=data[SK_TASKS];changed=true;}
    // CRM verisi
    if(data.crmRows&&data.crmRows.length){_crmRows=data.crmRows;try{localStorage.setItem("crmRows",JSON.stringify(_crmRows));}catch(e){}}
    if(changed)render();
    fbListen();
    // kisiRows — oyun/kisilercrm'den çek
    if(_db){
      _db.doc("oyun/kisilercrm").get().then(function(doc){
        if(!doc.exists)return;
        var d2=doc.data();
        if(!d2||!d2.rows||!d2.rows.length)return;
        var fbTs=d2.ts||0;
        var localTs=0;try{var lt=localStorage.getItem("kisiRowsTs");if(lt)localTs=parseInt(lt);}catch(e){}
        // Her zaman Firebase ile güncelle
        _kRows=d2.rows;
        try{localStorage.setItem("kisiRows",JSON.stringify(_kRows));localStorage.setItem("kisiRowsTs",String(fbTs));}catch(e){}
        if(currentTab==="kisilercrm"){var rep=document.getElementById("kisiReport");if(rep)_renderKisiCRM();}
        // Sekmede değilse de _kRows hazır olsun
      }).catch(function(){});
    }
  });

function sonuclandirIddia(id,kazandi){
  gs.iddiaList=(gs.iddiaList||[]).map(function(x){
    if(x.id!==id)return x;
    var delta=kazandi?x.kazanc:-x.kayip;
    if(!gs.iddiaDeltas)gs.iddiaDeltas={};
    gs.iddiaDeltas[x.player]=(gs.iddiaDeltas[x.player]||0)+delta;
    return Object.assign({},x,{status:kazandi?"kazandi":"kaybetti",delta:delta});
  });

function makeRow(box,isToday){
  var won=box.taskWinners&&box.taskWinners.length&&box.taskWinners[0]!=="__none__";
  var lbl=box.calendarLabel||box.calendarDay;
  // Tarihi GG/AA formatından GG/AA/YYYY yap
  if(lbl&&lbl.indexOf("/")>=0){
    var parts=lbl.split("/");
    if(parts.length===2) lbl=parts[0]+"/"+parts[1]+"/2026";
  }
  var taskText=box.task?box.task.text:"";
  var taskPrize=box.task&&box.task.prize>0?box.task.prize:0;
  var statusIcon=won?"✅":box.opened?"⏳":"📅";
  var statusColor=won?"#4ADE80":box.opened?"#F5C800":"#FFE000";
  var statusText=won?"Tamamlandı":box.opened?"Bekliyor":"Açık";

      +"<span style='font-size:.62rem;color:"+statusColor+";'>"+statusIcon+" "+statusText+"</span>"
      +"</div>"
    :"<span style='font-size:.66rem;color:"+statusColor+";flex-shrink:0;'>"+statusIcon+" "+statusText+"</span>";
  var bg=isToday?"background:rgba(138,92,246,.1);":"";
  return "<div style='display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);"+bg+"'>"
    +"<div style='font-size:.64rem;color:#8A8474;flex-shrink:0;min-width:32px;'>"+escH(lbl)+"</div>"
    +"<div style='flex:1;min-width:0;'>"
    +"<div style='font-size:"+txtSize+";color:#F0ECD8;font-weight:"+(isToday?"700":"400")+";line-height:1.35;'>"+escH(taskText)+"</div>"

    +"<button data-gorevcal='next' style='background:none;border:1px solid rgba(255,255,255,.1);color:#8A8474;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:.8rem;'>›</button>"

function _buildGorevMonth(year,month,dateSet,selDate,todayKey){
  var firstDay=new Date(year,month-1,1).getDay();
  var daysInMonth=new Date(year,month,0).getDate();
  var thS="font-size:.55rem;color:#8A8474;text-align:center;padding:2px 0;";
  var html="<div style='background:#0F0F0F;border:1px solid rgba(255,255,255,.06);border-radius:7px;padding:8px;min-width:196px;'>"
    +"<div style='font-size:.68rem;font-weight:700;color:#8A8474;text-align:center;margin-bottom:6px;'>"+TR_MONTHS[month]+" "+year+"</div>"
    +"<table style='width:100%;border-collapse:collapse;'><thead><tr>";
  for(var di=0;di<7;di++) html+="<th style='"+thS+"'>"+TR_DAYS[di]+"</th>";
  html+="</tr></thead><tbody><tr>";
  for(var blank=0;blank<firstDay;blank++) html+="<td></td>";
  for(var day=1;day<=daysInMonth;day++){
    var dStr=year+"-"+(month<10?"0"+month:""+month)+"-"+(day<10?"0"+day:""+day);
    var hasTasks=dateSet[dStr]||false;
    var isSel=dStr===selDate;
    var isPast=dStr<todayKey;
    if(!isPast){html+="<td></td>";var dow2=(firstDay+day-1)%7;if(dow2===6&&day<daysInMonth)html+="</tr><tr>";continue;}
    var bg=isSel?"#a78bfa":hasTasks?"rgba(138,92,246,.15)":"transparent";
    var col=isSel?"#000":hasTasks?"#a78bfa":"#3A3830";
    var brd=isSel?"1px solid #a78bfa":hasTasks?"1px solid rgba(138,92,246,.3)":"1px solid transparent";
    var attr=hasTasks?" data-gorevdate=\""+dStr+"\"":"";
    html+="<td style='text-align:center;padding:2px;'>"
      +"<div"+attr+" style='width:24px;height:24px;margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:4px;background:"+bg+";border:"+brd+";color:"+col+";font-size:.68rem;font-weight:"+(hasTasks?"700":"400")+";cursor:"+(hasTasks?"pointer":"default")+";'>"+day+"</div>"
      +"</td>";
    var dow=(firstDay+day-1)%7;
    if(dow===6&&day<daysInMonth) html+="</tr><tr>";
  }
  html+="</tr></tbody></table></div>";
  return html;
}

function crmLoad(inp){
  var file=inp.files[0];if(!file)return;
  var nm=document.getElementById("crmFName");
  if(nm)nm.textContent=file.name;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var wb=XLSX.read(ev.target.result,{type:"array"});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      _crmRows=rows;
      try{localStorage.setItem("crmRows",JSON.stringify(rows));}catch(e){}
      // Firebase'e kaydet
      if(_fbReady&&_db){
        _db.doc("oyun/crm").set({rows:rows,ts:Date.now()}).catch(function(e){console.warn(e);});
      }
      var rep=document.getElementById("crmReport");
      if(rep){_renderCRM(_buildCRMData(rows),rows.length);setTimeout(_bindDateBtns,100);}
    }catch(ex){
      var rep=document.getElementById("crmReport");
      if(rep)rep.innerHTML="<div style='color:#e74c3c;'>Hata: "+String(ex)+"</div>";
    }
  };
  reader.readAsArrayBuffer(file);
}

function _buildCRMData(rows){
  var dan={};
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    var name=(r["Son Eğitim Ekleyen"]||r["Son Egitim Ekleyen"]||r["Danışman"]||"").toString().trim();
    var ref=(r["Referans"]||"").toString().toUpperCase();
    var kur=parseInt(r["Kur"])||0;
    var ciro=parseFloat(String(r["Eğitim Ciro"]||r["Egitim Ciro"]||0).replace(/[^\d.]/g,""))||0;
    var tah=parseFloat(String(r["Tahsilat"]||0).replace(/[^\d.]/g,""))||0;
    var refN=ref.replace(/İ/g,"I").replace(/Ğ/g,"G").replace(/Ü/g,"U").replace(/Ş/g,"S").replace(/Ö/g,"O").replace(/Ç/g,"C").toUpperCase();var uzatma=refN.indexOf("KUR UZATMA")>=0||refN.indexOf("UZATMA")>=0;
    if(!name)continue;
    if(!dan[name])dan[name]={name:name,ciro:0,tah:0,ogr:0,kur:0,yOgr:0,yKur:0,uOgr:0,uKur:0};
    var d=dan[name];
    d.ciro+=ciro;d.tah+=tah;d.ogr++;d.kur+=kur;
    if(uzatma){d.uOgr++;d.uKur+=kur;}else{d.yOgr++;d.yKur+=kur;}
  }
  var arr=[];for(var k in dan)arr.push(dan[k]);
  arr.sort(function(a,b){return b.ciro-a.ciro;});
  return arr;
}

// Excel serial date → JS Date
function _excelDateToStr(val){
  if(!val&&val!==0) return null;
  if(typeof val==="string"&&val.indexOf("-")>=0) return val.substring(0,10);
  if(typeof val==="number"){
    // Excel epoch: 1900-01-01 = 1, JS epoch: 1970-01-01
    var d=new Date(Math.round((val-25569)*86400*1000));
    var y=d.getUTCFullYear(),m=d.getUTCMonth()+1,dd=d.getUTCDate();
    return y+"-"+(m<10?"0"+m:""+m)+"-"+(dd<10?"0"+dd:""+dd);
  }
  return null;
}

var _selectedDate="";

function _getAvailableDates(rows){
  var dates={};
  for(var i=0;i<rows.length;i++){
    var d=_excelDateToStr(rows[i]["Kayıt Tarihi"]);
    if(d) dates[d]=true;
  }
  return Object.keys(dates).sort().reverse();
}

// _crmCalYear/_crmCalMonth: CRM takvim görünüm durumu
var _crmCalYear=0,_crmCalMonth=0;

function _buildMiniCal(dates,selDate){
  if(!dates||!dates.length) return "";
  var dateSet={};
  for(var i=0;i<dates.length;i++) dateSet[dates[i]]=true;
  // Görüntülenecek ay
  if(!_crmCalYear){
    var ref=selDate||dates[0];
    _crmCalYear=parseInt(ref.split("-")[0]);
    _crmCalMonth=parseInt(ref.split("-")[1]);
  }
  // Ay/Yıl seçim başlığı
  var prevM=_crmCalMonth-1,prevY=_crmCalYear;
  if(prevM<1){prevM=12;prevY--;}
  var nextM=_crmCalMonth+1,nextY=_crmCalYear;
  if(nextM>12){nextM=1;nextY++;}
  var header="<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;'>"
    +"<button data-crmcal='prev' style='background:none;border:1px solid rgba(255,255,255,.1);color:#8A8474;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:.8rem;'>‹</button>"
    +"<span style='font-size:.78rem;font-weight:700;color:#C9A000;'>"+TR_MONTHS[_crmCalMonth]+" "+_crmCalYear+"</span>"
    +"<button data-crmcal='next' style='background:none;border:1px solid rgba(255,255,255,.1);color:#8A8474;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:.8rem;'>›</button>"
    +"</div>";
  return "<div style='background:#161616;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px;max-width:230px;margin-bottom:12px;'>"
    +header
    +_buildMonthCal(_crmCalYear,_crmCalMonth,dateSet,selDate)
    +"</div>";
}

var TR_MONTHS=["","Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var TR_DAYS=["Pz","Pt","Sa","Çr","Pr","Cu","Ct"];

function _buildMonthCal(year,month,dateSet,selDate){
  var firstDay=new Date(year,month-1,1).getDay(); // 0=Sun
  var daysInMonth=new Date(year,month,0).getDate();
  var thStyle="font-size:.58rem;color:#8A8474;text-align:center;padding:2px 0;font-weight:600;";
  var html="<div style='background:#161616;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:10px;min-width:210px;'>"
    +"<div style='font-size:.72rem;font-weight:700;color:#C9A000;text-align:center;margin-bottom:8px;letter-spacing:.08em;'>"+TR_MONTHS[month]+" "+year+"</div>"
    +"<table style='width:100%;border-collapse:collapse;'><thead><tr>";
  for(var di=0;di<7;di++) html+="<th style='"+thStyle+"'>"+TR_DAYS[di]+"</th>";
  html+="</tr></thead><tbody><tr>";
  // Boş hücreler (Pazar=0 başlangıç)
  for(var blank=0;blank<firstDay;blank++) html+="<td></td>";
  for(var day=1;day<=daysInMonth;day++){
    var dStr=year+"-"+(month<10?"0"+month:""+month)+"-"+(day<10?"0"+day:""+day);
    var hasData=dateSet[dStr]||false;
    var isSel=dStr===selDate;
    var col=isSel?"#000":hasData?"#FFE000":"#3A3830";
    var bg=isSel?"#FFE000":hasData?"rgba(255,224,0,.08)":"transparent";
    var brd=isSel?"1px solid #FFE000":hasData?"1px solid rgba(255,224,0,.3)":"1px solid transparent";
    var cur=hasData?"pointer":"default";
    var attr=hasData?" data-seldate=\""+dStr+"\"":"";
    html+="<td style='text-align:center;padding:2px;'>"
      +"<div"+attr+" style='width:26px;height:26px;margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:4px;background:"+bg+";border:"+brd+";color:"+col+";font-size:.7rem;font-weight:"+(hasData?"700":"400")+";cursor:"+cur+";'>"+day+"</div>"
      +"</td>";
    var dow=(firstDay+day-1)%7;
    if(dow===6&&day<daysInMonth) html+="</tr><tr>";
  }
  html+="</tr></tbody></table></div>";
  return html;
}

function _getRefSubeTable(rows){
  if(!rows||!rows.length) return "";
  // Referans × Şube ciro matrisi
  var refMap={};  // ref -> {sube -> ciro}
  var subeSet={};
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    var ref=(r["Referans"]||"").toString().trim();
    var sube=(r["Şube"]||r["Sube"]||"").toString().trim();
    var ciro=parseFloat(String(r["Eğitim Ciro"]||r["Egitim Ciro"]||0).replace(/[^\d.]/g,""))||0;
    if(!ref||!sube) continue;
    if(!refMap[ref]) refMap[ref]={};
    refMap[ref][sube]=(refMap[ref][sube]||0)+ciro;
    subeSet[sube]=true;
  }
  var subes=Object.keys(subeSet).sort();
  // Referans toplam cirolarını hesapla, sırala
  var refs=Object.keys(refMap).map(function(ref){
    var total=0;
    for(var s in refMap[ref]) total+=refMap[ref][s];
    return{ref:ref,total:total};
  }).sort(function(a,b){return b.total-a.total;});
  if(!refs.length) return "";

  var thS="padding:5px 8px;font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;text-align:right;border-bottom:2px solid rgba(255,224,0,.3);white-space:nowrap;color:#C9A000;";
  var thL="padding:5px 8px;font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;text-align:left;border-bottom:2px solid rgba(255,224,0,.3);white-space:nowrap;color:#C9A000;";
  var td="padding:4px 8px;font-size:.68rem;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap;";
  var tdL="padding:4px 8px;font-size:.68rem;font-weight:700;text-align:left;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap;color:#F0ECD8;";
  var tdT="padding:5px 8px;font-size:.66rem;font-weight:800;text-align:right;border-top:2px solid rgba(255,224,0,.3);background:rgba(255,224,0,.04);white-space:nowrap;";
  var tdTL="padding:5px 8px;font-size:.66rem;font-weight:800;text-align:left;border-top:2px solid rgba(255,224,0,.3);background:rgba(255,224,0,.04);white-space:nowrap;color:#F5C800;";

  // Başlık satırı
  var thead="<tr><th style='"+thL+"'>Referans Kanalı</th>";
  for(var si=0;si<subes.length;si++) thead+="<th style='"+thS+"'>"+escH(subes[si].replace("İZMİR-","İZM.").replace("ANKARA-","ANK."))+"</th>";
  thead+="<th style='"+thS+"color:#4ADE80;'>Toplam</th></tr>";

  // Veri satırları
  var tbody="";
  var subeTotals={};
  var grandTotal=0;
  for(var ri=0;ri<refs.length;ri++){
    var ref=refs[ri].ref;
    var row=refMap[ref];
    var bg=ri%2===0?"background:#161616;":"background:#141414;";
    tbody+="<tr style='"+bg+"'><td style='"+tdL+"'>"+escH(ref)+"</td>";
    for(var si=0;si<subes.length;si++){
      var val=row[subes[si]]||0;
      subeTotals[subes[si]]=(subeTotals[subes[si]]||0)+val;
      tbody+="<td style='"+td+(val>0?"color:#F0ECD8;":"color:#3A3830;")+"'>"+(val>0?_tl(val):"—")+"</td>";
    }
    grandTotal+=refs[ri].total;
    tbody+="<td style='"+td+"color:#4ADE80;font-weight:700;'>"+_tl(refs[ri].total)+"</td></tr>";
  }
  // Toplam satırı
  tbody+="<tr><td style='"+tdTL+"'>TOPLAM</td>";
  for(var si=0;si<subes.length;si++){
    tbody+="<td style='"+tdT+"color:#F5C800;'>"+_tl(subeTotals[subes[si]]||0)+"</td>";
  }
  tbody+="<td style='"+tdT+"color:#4ADE80;'>"+_tl(grandTotal)+"</td></tr>";

  return "<div style='margin-top:16px;'>"
    +"<div style='font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#C9A000;font-weight:700;margin-bottom:8px;'>📡 Referans Kanalı × Şube Ciro Tablosu</div>"
    +"<div style='overflow-x:auto;border-radius:8px;border:1px solid rgba(255,255,255,.08);'>"
    +"<table style='width:100%;border-collapse:collapse;min-width:500px;'>"
    +"<thead>"+thead+"</thead><tbody>"+tbody+"</tbody></table></div></div>";
}

function kisiDateChange(){
  var s=document.getElementById("kisiStart");
  var e=document.getElementById("kisiEnd");
  if(s)_kStartDate=s.value;
  if(e)_kEndDate=e.value;
  _renderKisiCRM();
}

var _kChunkSize=200; // küçük chunk — güvenli boyut

function kisiLoad(inp){
  var file=inp.files[0];if(!file)return;
  var nm=document.getElementById("kisiFName");
  if(nm)nm.textContent="Yükleniyor...";
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var wb=XLSX.read(ev.target.result,{type:"array"});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      _kRows=rows;
      var _kTs=Date.now();
      try{localStorage.setItem("kisiRows",JSON.stringify(rows));localStorage.setItem("kisiRowsTs",String(_kTs));}catch(e){}
      _renderKisiCRM();
      if(_fbReady&&_db){
        _kisiSaveChunks(rows,_kTs,file.name);
      }
    }catch(ex){
      var rep=document.getElementById("kisiReport");
      if(rep)rep.innerHTML="<div style='color:#e74c3c;'>Hata: "+String(ex)+"</div>";
    }
  };
  reader.readAsArrayBuffer(file);
}

function _kisiSaveChunks(rows,ts,fname){
  var chunks=[];
  for(var i=0;i<rows.length;i+=_kChunkSize){
    chunks.push(rows.slice(i,i+_kChunkSize));
  }
  var total=chunks.length;
  var nm=document.getElementById("kisiFName");
  if(nm)nm.textContent="Firebase'e kaydediliyor... (0/"+total+")";

  // Meta yaz, sonra chunk'ları SIRAYLA yaz
  _db.doc("oyun/kisilercrm").set({ts:ts,chunks:total,fname:fname||""}).then(function(){
    function writeChunk(idx){
      if(idx>=total){
        var nm2=document.getElementById("kisiFName");
        if(nm2)nm2.textContent=(fname||"")+" ✅ ("+rows.length+" satır kaydedildi)";
        return;
      }
      var nm2=document.getElementById("kisiFName");
      if(nm2)nm2.textContent="Firebase'e kaydediliyor... ("+idx+"/"+total+")";
      _db.doc("oyun/kisilercrm_"+idx).set({rows:chunks[idx],ts:ts}).then(function(){
        writeChunk(idx+1);
      }).catch(function(e){
        console.warn("Chunk "+idx+" hata:",e);
        // Hata olsa da devam et
        writeChunk(idx+1);
      });
    }
    writeChunk(0);
  }).catch(function(e){console.warn("Meta hata:",e);});
}

function _kisiLoadChunks(cb){
  if(!_fbReady||!_db){cb(null);return;}
  _db.doc("oyun/kisilercrm").get().then(function(doc){
    if(!doc.exists){cb(null);return;}
    var meta=doc.data();
    var total=meta.chunks||0;
    var ts=meta.ts||0;
    if(!total){cb(null);return;}
    var all=[];
    // Sıralı oku
    function readChunk(idx){
      if(idx>=total){cb({rows:all,ts:ts});return;}
      _db.doc("oyun/kisilercrm_"+idx).get().then(function(cdoc){
        if(cdoc.exists&&cdoc.data().rows)all=all.concat(cdoc.data().rows);
        readChunk(idx+1);
      }).catch(function(){readChunk(idx+1);});
    }
    readChunk(0);
  }).catch(function(){cb(null);});
}

function _renderKisiCRM(){
  var rep=document.getElementById("kisiReport");
  if(rep&&_kRows)rep.innerHTML=_buildKisiReport(_kRows,_kStartDate,_kEndDate);
}

// Tarih string'ini YYYY-MM-DD'ye çevir (DD.MM.YYYY veya timestamp)
function _parseKisiDate(val){
  if(!val) return null;
  var s=String(val).trim();
  // DD.MM.YYYY formatı
  if(/^\d{2}\.\d{2}\.\d{4}/.test(s)){
    var p=s.split(" ")[0].split(".");
    return p[2]+"-"+p[1]+"-"+p[0];
  }
  // YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
  // Excel serial number
  if(!isNaN(val)&&Number(val)>10000){
    var d=new Date(Math.round((Number(val)-25569)*86400*1000));
    var y=d.getUTCFullYear(),m=d.getUTCMonth()+1,dd=d.getUTCDate();
    return y+"-"+(m<10?"0"+m:""+m)+"-"+(dd<10?"0"+dd:""+dd);
  }
  return null;
}

function _kisiPot(note){
  // Notları tara — yüksek/orta/düşük potansiyel
  var n=(note||"").toString().toUpperCase();
  var yuksek=["RANDEVU","GELECEĞİM","GELECEM","KURUMA GEL","KESİNLİKLE","KESINLIKLE","MUTLAKA",
    "ALACAĞIM","ALACAGIM","KAYDOLMAK","KAYIT OLMAK","HAFTA","YARIN","BUGÜN GEL","TAM OLUR",
    "FİYAT","FIYAT","ÜCRET","UCRET","TEKLİF","TEKLIF","İLGİLENİYOR","ILGILENIY","BİLGİ VER","BILGI VER",
    "DÜŞÜNÜYORUM","DUSUNUYORUM","MERAK ETTİM","MERAK ETTIM"];
  var dusuk=["AÇMADI","ACMADI","ULAŞILAMIYOR","ULASI","MEŞGUL","MESGU","İLGİLENMİYOR","İSTEMİYOR",
    "ISTEMIY","ALAKASIZ","YANLIŞLIKLA","REDDETTİ","KAPAT","RAHATSIZ","TEKRAR ARAMAYACAK",
    "GÖRÜŞMEK İSTEMİYORUM","GORUSMEK ISTEM",".","AÇMADI AÇMADI"];
  var hasY=yuksek.some(function(k){return n.indexOf(k)>=0;});
  var hasD=dusuk.some(function(k){return n.indexOf(k)>=0;});
  if(n.length<3) return "dusuk";
  if(hasY&&!hasD) return "yuksek";
  if(hasD) return "dusuk";
  return "orta";
}

function _buildKisiReport(rows,startDate,endDate){
  var filtered=rows.filter(function(r){
    var d=_parseKisiDate(r["Kayıt Tarihi"]);
    if(!d) return false;
    if(startDate&&d<startDate) return false;
    if(endDate&&d>endDate) return false;
    return true;
  });

  if(!filtered.length) return "<div style='font-size:.82rem;color:#8A8474;padding:12px 0;'>Seçili tarih aralığında veri yok.</div>";

  // Sütun tespiti
  var _cK="Kaydeden",_cS="Şube",_cSonuc="Sonuç",_cRef="Referans",_cNot="Notlar";
  var sk=Object.keys(filtered[0]);
  for(var ki=0;ki<sk.length;ki++){
    var kn=sk[ki].replace(/[\s ﻿]/g,"").toLowerCase()
      .replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
      .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");
    if(kn==="kaydeden"||kn==="dansman") _cK=sk[ki];
    else if(kn==="sube") _cS=sk[ki];
    else if(kn==="sonuc"||kn==="sonuç") _cSonuc=sk[ki];
    else if(kn==="referans") _cRef=sk[ki];
    else if(kn==="notlar"||kn==="not") _cNot=sk[ki];
  }

  function cat(s){
    s=(s||"").toString().toUpperCase().trim();
    return{
      randevu:s==="RANDEVU"||s.indexOf("RANDEVU")>=0,
      olumlu:s==="OLUMLU",
      olumsuz:s==="OLUMSUZ"||s==="TEKRAR",
      sonraAranacak:s==="SONRA ARANACAK",
      alakasiz:s.indexOf("ALAKASIZ")>=0||s.indexOf("ILGISIZ")>=0||s.indexOf("İLGİSİZ")>=0
    };
  }

  function emptyRow(){return{toplam:0,rand:0,olumlu:0,olumsuz:0,sonra:0,alakasiz:0,pot_y:0,pot_o:0,pot_d:0};}
  function addRow(d,r,sonuc,note){
    d.toplam++;
    var c=cat(sonuc);
    if(c.randevu)d.rand++;
    if(c.olumlu)d.olumlu++;
    if(c.olumsuz)d.olumsuz++;
    if(c.sonraAranacak)d.sonra++;
    if(c.alakasiz)d.alakasiz++;
    var p=_kisiPot(note);
    if(p==="yuksek")d.pot_y++;
    else if(p==="orta")d.pot_o++;
    else d.pot_d++;
  }

  var pMap={},sMap={},rsMap={},refSet={};
  for(var i=0;i<filtered.length;i++){
    var r=filtered[i];
    var p=String(r[_cK]||"").trim();
    var sh=String(r[_cS]||"").trim();
    var ref=String(r[_cRef]||"").trim();
    var sonuc=r[_cSonuc];
    var note=r[_cNot];
    if(p){if(!pMap[p])pMap[p]=emptyRow();addRow(pMap[p],r,sonuc,note);}
    if(sh){if(!sMap[sh])sMap[sh]=emptyRow();addRow(sMap[sh],r,sonuc,note);}
    if(sh&&ref){
      if(!rsMap[sh])rsMap[sh]={};
      if(!rsMap[sh][ref])rsMap[sh][ref]={toplam:0,rand:0,olumlu:0,olumsuz:0,sonra:0,alakasiz:0,pot_y:0,pot_o:0,pot_d:0};
      var c2=cat(sonuc);var pt=_kisiPot(note);
      rsMap[sh][ref].toplam++;
      if(c2.randevu)rsMap[sh][ref].rand++;
      if(c2.olumlu)rsMap[sh][ref].olumlu++;
      if(c2.olumsuz)rsMap[sh][ref].olumsuz++;
      if(c2.sonraAranacak)rsMap[sh][ref].sonra++;
      if(c2.alakasiz)rsMap[sh][ref].alakasiz++;
      if(pt==="yuksek")rsMap[sh][ref].pot_y++;
      else if(pt==="orta")rsMap[sh][ref].pot_o++;
      else rsMap[sh][ref].pot_d++;
      refSet[ref]=true;
    }
  }

  var pArr=Object.keys(pMap).map(function(k){return Object.assign({name:k},pMap[k]);}).sort(function(a,b){return b.toplam-a.toplam;});
  var shArr=Object.keys(sMap).map(function(k){return Object.assign({name:k},sMap[k]);}).sort(function(a,b){return b.toplam-a.toplam;});
  var refs=Object.keys(refSet).sort();
  var subes=Object.keys(rsMap).sort();

  return _kisiTable("👤 Personel Bazlı Data","Personel",pArr)
    +_kisiTable("🏢 Şube Bazlı Data","Şube",shArr)
    +_kisiRefSubeTable(rsMap,refs,subes);
}

function _buildOzetData(kRows,cRows,sd,ed,showKU){
  // ── Tarih filtresi ──
  function inRangeCRM(r){
    var d=_parseKisiDate(r["Kayıt Tarihi"]);
    if(!d)return false;
    if(sd&&d<sd)return false;
    if(ed&&d>ed)return false;
    return true;

  function inRangeCiro(r){
    var d=_excelDateToStr(r["Kayıt Tarihi"]);
    if(!d)return false;
    if(sd&&d<sd)return false;
    if(ed&&d>ed)return false;
    return true;

  var kFilt=kRows.filter(inRangeCRM);
  var cFiltAll=cRows.filter(inRangeCiro);
  var cFilt=showKU?cFiltAll:cFiltAll.filter(function(r){return!_isKU(r["Referans"]);});

  var debugInfo="<div style='font-size:.7rem;color:#8A8474;margin-bottom:8px;padding:6px 10px;background:#161616;border-radius:5px;'>"
    +"🔍 CRM: "+kFilt.length+" satır | Ciro: "+cFilt.length+" satır | Tarih: "
    +(sd?sd.split("-").reverse().join("."):"tümü")+" → "+(ed?ed.split("-").reverse().join("."):"tümü")
    +"</div>";

  if(!kFilt.length&&!cFilt.length)
    return debugInfo+"<div style='font-size:.8rem;color:#8A8474;padding:8px 0;'>Seçili tarih aralığında veri yok.</div>";

  // CRM sütun adlarını dinamik tespit et
  var _cK="Kaydeden",_cS="Şube",_cRef="Referans",_cTeklif="Son Teklif Fiyatı";
  if(kFilt.length>0){
    var skeys=Object.keys(kFilt[0]);
    for(var ki=0;ki<skeys.length;ki++){
      var kn=skeys[ki].replace(/[\s ﻿]/g,"").toLowerCase()
        .replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
        .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");
      if(kn==="kaydeden"||kn==="dansman") _cK=skeys[ki];
      else if(kn==="sube") _cS=skeys[ki];
      else if(kn==="referans") _cRef=skeys[ki];
      else if(kn.indexOf("teklifficiyati")>=0||kn.indexOf("tekliffiyati")>=0||kn==="sonteklifficiyati"||kn==="sontekl") _cTeklif=skeys[ki];
    }
  }

  // Ciro sütun adları
  var _cP="Son Eğitim Ekleyen",_cSube="Şube",_cCiro="Eğitim Ciro",_cCRef="Referans";
  if(cFilt.length>0){
    var ckeys=Object.keys(cFilt[0]);
    for(var ci2=0;ci2<ckeys.length;ci2++){
      var cn=ckeys[ci2].replace(/[\s ﻿]/g,"").toLowerCase()
        .replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
        .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");
      if(cn==="sonegitimekleyen"||cn==="dansman"||cn==="egitimekleyen") _cP=ckeys[ci2];
      else if(cn==="sube") _cSube=ckeys[ci2];
      else if(cn==="egitimciro"||cn==="ejitimciro"||cn.indexOf("egitimciro")>=0||cn.indexOf("ciro")>=0) _cCiro=ckeys[ci2];
      else if(cn==="referans") _cCRef=ckeys[ci2];
    }
  }

  function emptyR(){return{crmData:0,teklifSayi:0,teklifCiro:0,kayitSayi:0,kayitCiro:0,refMap:{}};}

  function addToMap(map,key,fromCRM,ref,teklifFiyat,kayitCiro){
    if(!key)return;
    if(!map[key])map[key]=emptyR();
    var d=map[key];
    if(!d.refMap[ref])d.refMap[ref]=emptyR();
    var dr=d.refMap[ref];
    if(fromCRM){
      d.crmData++; dr.crmData++;
      if(teklifFiyat>0){d.teklifSayi++;d.teklifCiro+=teklifFiyat;dr.teklifSayi++;dr.teklifCiro+=teklifFiyat;}
    } else {
      // Ciro satırı: kayıt = teklif verilmiş
      d.teklifSayi++;d.teklifCiro+=kayitCiro;
      d.kayitSayi++;d.kayitCiro+=kayitCiro;
      dr.teklifSayi++;dr.teklifCiro+=kayitCiro;
      dr.kayitSayi++;dr.kayitCiro+=kayitCiro;
    }
  }

  var pMap={},sMap={};

  // Boşluk normalize: çift boşluk, trim
  function normKey(s){return(s||"").toString().replace(/\s+/g," ").trim();}

  // CRM satırları
  for(var i=0;i<kFilt.length;i++){
    var r=kFilt[i];
    var p=normKey(r[_cK]);
    var sh=normKey(r[_cS]);
    var ref=normKey(r[_cRef]).toUpperCase();
    var teklif=_parseTeklif(r[_cTeklif]);
    if(p)addToMap(pMap,p,true,ref,teklif,0);
    if(sh)addToMap(sMap,sh,true,ref,teklif,0);
  }

  // Ciro satırları
  for(var i=0;i<cFilt.length;i++){
    var r=cFilt[i];
    var p=normKey(r[_cP]);
    var sh=normKey(r[_cSube]);
    var ref=normKey(r[_cCRef]).toUpperCase();
    var ciro=parseFloat(String(r[_cCiro]||0).replace(/[^\d.]/g,""))||0;
    if(p)addToMap(pMap,p,false,ref,0,ciro);
    if(sh)addToMap(sMap,sh,false,ref,0,ciro);
  }

  function calcR(d){
    var toplamData=d.crmData+d.kayitSayi;
    return{
      toplamData:toplamData,
      teklifSayi:d.teklifSayi,
      kayitSayi:d.kayitSayi,
      randOrani:_pct(d.teklifSayi,toplamData),
      kayitOrani:_pct(d.kayitSayi,d.teklifSayi),
      kayitCiro:d.kayitCiro,
      teklifCiro:d.teklifCiro,
      ciroOrani:_pct(d.kayitCiro,d.teklifCiro)
    };
  }

  function renderT(title,map,dbg){
    var arr=Object.keys(map).map(function(k){return{name:k,d:map[k]};});
    arr.sort(function(a,b){return(b.d.kayitSayi+b.d.crmData)-(a.d.kayitSayi+a.d.crmData);});
    if(!arr.length)return"";
    var thS="padding:4px 7px;font-size:.56rem;letter-spacing:.04em;text-transform:uppercase;font-weight:700;text-align:right;border-bottom:2px solid rgba(255,224,0,.3);white-space:nowrap;";
    var thL=thS+"text-align:left;color:#C9A000;";
    var td=function(v,c){return"<td style='padding:3px 7px;font-size:.7rem;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap;"+(c?"color:"+c+";":"")+">"+v+"</td>";};
    var tdL=function(v,sub){return"<td style='padding:3px 7px;font-size:"+(sub?".64rem":".72rem")+";text-align:left;border-bottom:1px solid rgba(255,255,255,.04);color:"+(sub?"#8A8474":"#FFE000")+";font-weight:"+(sub?"400":"700")+"'>"+escH(v)+"</td>";};
    var thead="<thead><tr>"
      +"<th style='"+thL+"'>İsim</th>"
      +"<th style='"+thS+"color:#C9A000;'>T.Data</th>"
      +"<th style='"+thS+"color:#a78bfa;'>Teklif</th>"
      +"<th style='"+thS+"color:#4ADE80;'>Kayıt</th>"
      +"<th style='"+thS+"color:#F5C800;'>Rdv%</th>"
      +"<th style='"+thS+"color:#4ADE80;'>Kyt%</th>"
      +"<th style='"+thS+"color:#a78bfa;'>Kayıt Ciro</th>"
      +"<th style='"+thS+"color:#e67e22;'>Top.Teklif Ciro</th>"
      +"<th style='"+thS+"color:#e74c3c;'>Ciro%</th>"
      +"</tr></thead>";
    var tbody="";
    var tot={toplamData:0,teklifSayi:0,kayitSayi:0,kayitCiro:0,teklifCiro:0};
    for(var i=0;i<arr.length;i++){
      var item=arr[i];var d=item.d;var c=calcR(d);
      var bg=i%2===0?"background:#161616;":"background:#141414;";
      var _td=c.toplamData;
      var _ts=c.teklifSayi;
      var _ks=c.kayitSayi;
      var _rdv=c.randOrani;
      var _kyt=c.kayitOrani;
      var _kc=_tl2(c.kayitCiro);
      var _tc=_tl2(c.teklifCiro);
      var _co=c.ciroOrani;
      tbody+="<tr style='"+bg+"'>"
        +tdL(item.name,false)
        +td(_td)
        +td(_ts,"#a78bfa")
        +td(_ks,"#4ADE80")
        +td(_rdv,"#F5C800")
        +td(_kyt,"#4ADE80")
        +td(_kc,"#a78bfa")
        +td(_tc,"#e67e22")
        +td(_co,"#e74c3c")
        +"</tr>";
      // Referans kırılımı
      var refs=Object.keys(d.refMap).sort(function(a,b){
        return(d.refMap[b].teklifSayi+d.refMap[b].crmData)-(d.refMap[a].teklifSayi+d.refMap[a].crmData);
      });
      for(var ri=0;ri<refs.length;ri++){
        var rd=d.refMap[refs[ri]];var rc=calcR(rd);
        if(!rc.toplamData)continue;
        var _rtd=rc.toplamData;
        var _rts=rc.teklifSayi||0;
        var _rks=rc.kayitSayi||0;
        var _rrdv=rc.randOrani;
        var _rkyt=rc.kayitOrani;
        var _rkc=_tl2(rc.kayitCiro);
        var _rtc=_tl2(rc.teklifCiro);
        var _rco=rc.ciroOrani;
        tbody+="<tr style='background:#111;'>"
          +tdL("↳ "+refs[ri],true)
          +td(_rtd,"#3A3830")
          +td(_rts>0?_rts:"—","#a78bfa")
          +td(_rks>0?_rks:"—","#4ADE80")
          +td(_rrdv,"#F5C800")
          +td(_rkyt,"#4ADE80")
          +td(_rkc,"#a78bfa")
          +td(_rtc,"#e67e22")
          +td(_rco,"#e74c3c")
          +"</tr>";
      }
      tot.toplamData+=c.toplamData;tot.teklifSayi+=d.teklifSayi;
      tot.kayitSayi+=d.kayitSayi;tot.kayitCiro+=d.kayitCiro;tot.teklifCiro+=d.teklifCiro;
    }
    var tdT=function(v,c){return"<td style='padding:4px 7px;font-size:.7rem;font-weight:800;text-align:right;border-top:2px solid rgba(255,224,0,.3);background:rgba(255,224,0,.04);white-space:nowrap;"+(c?"color:"+c+";":"")+">"+v+"</td>";};
    var _totTd=tot.toplamData;
    var _totTs=tot.teklifSayi;
    var _totKs=tot.kayitSayi;
    var _totRdv=_pct(tot.teklifSayi,tot.toplamData);
    var _totKyt=_pct(tot.kayitSayi,tot.teklifSayi);
    var _totKc=_tl2(tot.kayitCiro);
    var _totTc=_tl2(tot.teklifCiro);
    var _totCo=_pct(tot.kayitCiro,tot.teklifCiro);
    tbody+="<tr>"
      +"<td style='padding:4px 7px;font-size:.7rem;font-weight:800;text-align:left;border-top:2px solid rgba(255,224,0,.3);background:rgba(255,224,0,.04);color:#F5C800;'>TOPLAM</td>"
      +tdT(_totTd)+tdT(_totTs,"#a78bfa")+tdT(_totKs,"#4ADE80")
      +tdT(_totRdv,"#F5C800")+tdT(_totKyt,"#4ADE80")
      +tdT(_totKc,"#a78bfa")+tdT(_totTc,"#e67e22")+tdT(_totCo,"#e74c3c")
      +"</tr>";
    return"<div style='margin-bottom:16px;'>"
      +(dbg||"")
      +"<div style='font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#C9A000;font-weight:700;margin-bottom:8px;'>"+title+"</div>"
      +"<div style='overflow-x:auto;border-radius:8px;border:1px solid rgba(255,255,255,.08);'>"
      +"<table style='width:100%;border-collapse:collapse;min-width:700px;'>"
      +thead+"<tbody>"+tbody+"</tbody></table></div></div>";
  }

  var kuSuffix=showKU?" (KU Dahil)":" (KU Hariç)";
  return renderT("👤 Personel Bazlı Özet"+kuSuffix,pMap,debugInfo)
    +renderT("🏢 Şube Bazlı Özet"+kuSuffix,sMap);
}

function openBox(boxId){
if(!isAdmin)return;
var box=gs.boxes.find(function(b){return b.id===boxId;});
if(!box||box.opened)return;
if(box.calendarDay){
var today=new Date(),todayKey=today.getFullYear()+"-"+(today.getMonth()+1)+"-"+today.getDate();
if(box.calendarDay>todayKey){
showModal("🔒","Henüz Açılamaz","Bu kutu <strong>"+escH(box.calendarLabel)+"</strong> gününe ait.",false);
return;
}
}
var snap=JSON.parse(JSON.stringify(gs));
undoStack=undoStack.concat([snap]).slice(-10);lsSet(SK_UNDO,undoStack);
if(box.task){
gs.boxes=gs.boxes.map(function(b){return b.id===boxId?Object.assign({},b,{opened:true,openOrder:null}):b;});
lsSet(SK_GAME,gs);
var elc=document.querySelector("[data-boxid=\""+boxId+"\"");
if(elc){elc.classList.add("flipped","opened");}
setTimeout(function(){showTaskIntro(box);},650);
return;
}
// Sabit atanmış ödül varsa onu kullan, yoksa computePrize
var prize, newPool;
var fixedPrize = box.prize && box.prize > 0 ? box.prize : 0;
if(fixedPrize > 0){
  prize = fixedPrize;
  newPool = gs.prizePool;
} else {
  var res = computePrize(box.owner, gs.boxes, gs.prizePool, cfg, box.id);
  prize = res.prize;
  newPool = res.newPool;
  // Boş kutu önlemi: her zaman en az min ödül ver
  if(prize === 0 && newPool.length > 0){
    var minP = Math.min.apply(null, newPool);
    var minIdx = newPool.indexOf(minP);
    prize = minP;
    newPool = newPool.slice();
    newPool.splice(minIdx, 1);
  }
  if(prize === 0 && cfg.prizes && cfg.prizes.length > 0){
    prize = cfg.prizes.reduce(function(m,p){return Math.min(m,p.amount);}, cfg.prizes[0].amount);
  }
}
gs.boxes=gs.boxes.map(function(b){return b.id===boxId?Object.assign({},b,{prize:prize,opened:true,openOrder:gs.openCount+1}):b;});
gs=Object.assign({},gs,{prizePool:newPool,openCount:gs.openCount+1});
lsSet(SK_GAME,gs);
var el=document.querySelector("[data-boxid=\""+boxId+"\"]");
if(el){el.classList.add("flipped","opened");el.style.cursor="default";}
setTimeout(function(){
showModal(prize>0?"🎉":"😔",prize>0?prize.toLocaleString("tr-TR")+" ₺":"Boş Kutu",
prize>0?"<strong>"+escH(box.owner)+"</strong>'in <strong>#"+box.num+"</strong> kutusundan ödül çıktı!":"<strong>"+escH(box.owner)+"</strong>'in kutusu boştu.",prize>0);
if(prize>0)spawnConfetti();
},650);
}

function addPrize(){
var amount=parseInt(newPrizeAmount)||0,count=parseInt(newPrizeCount)||0;
if(amount<1||count<1)return;
var prizes=cfg.prizes.slice();var ex=prizes.find(function(p){return p.amount===amount;});
if(ex)ex.count+=count;else prizes.push({amount:amount,count:count});
prizes.sort(function(a,b){return a.amount-b.amount;});
cfg=Object.assign({},cfg,{prizes:prizes});
var newItems=[];for(var i=0;i<count;i++)newItems.push(amount);
var merged=gs.prizePool.concat(newItems);
for(var i=merged.length-1;i>0;i--){var j=0|Math.random()*(i+1);var tmp=merged[i];merged[i]=merged[j];merged[j]=tmp;}
gs=Object.assign({},gs,{prizePool:merged});
lsSet(SK_CFG,cfg);lsSet(SK_GAME,gs);
newPrizeAmount="";newPrizeCount="";
var saved=lsGet(SK_GAME);var mn=saved&&saved.prizePool&&saved.prizePool.length?Math.min.apply(null,saved.prizePool):"?";
render();
var fl=document.createElement("div");
fl.textContent="✅ "+count+"× "+amount.toLocaleString("tr-TR")+"₺ eklendi · Min: "+mn+"₺";
fl.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a3a1a;border:1px solid #FFE000;color:#FFE000;padding:9px 18px;border-radius:8px;font-family:Raleway,sans-serif;font-weight:700;font-size:.8rem;z-index:9999;max-width:90vw;text-align:center;";
document.body.appendChild(fl);setTimeout(function(){fl.remove();},3000);
}
function rebuildPool(){
var full=[];cfg.prizes.forEach(function(p){for(var i=0;i<p.count;i++)full.push(p.amount);});
var used=[];gs.boxes.forEach(function(b){if(b.opened&&b.prize>0)used.push(b.prize);});
var rem=full.slice();used.forEach(function(v){var idx=rem.indexOf(v);if(idx>=0)rem.splice(idx,1);});
for(var i=rem.length-1;i>0;i--){var j=0|Math.random()*(i+1);var t=rem[i];rem[i]=rem[j];rem[j]=t;}
gs=Object.assign({},gs,{prizePool:rem});lsSet(SK_GAME,gs);render();
var mn=rem.length?Math.min.apply(null,rem):"—";
var fl=document.createElement("div");
fl.textContent="✅ Havuz yeniden oluşturuldu · "+rem.length+" ödül · Min: "+mn+"₺";
fl.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a3a1a;border:1px solid #FFE000;color:#FFE000;padding:9px 18px;border-radius:8px;font-family:Raleway,sans-serif;font-weight:700;font-size:.8rem;z-index:9999;max-width:90vw;";
document.body.appendChild(fl);setTimeout(function(){fl.remove();},3500);
}
function closeBox(){
var pn=document.getElementById("closeBoxPlayer").value;
var bn=parseInt(document.getElementById("closeBoxNum").value)||0;
var msg=document.getElementById("closeBoxMsg");
if(!pn||!bn){msg.textContent="Oyuncu ve kutu # gir.";msg.style.color="#c0392b";return;}
var box=null;
for(var i=0;i<gs.boxes.length;i++){
  if(gs.boxes[i].owner===pn&&gs.boxes[i].num===bn){box=gs.boxes[i];break;}
}
if(!box){msg.textContent="Kutu bulunamadi.";msg.style.color="#c0392b";return;}
if(!box.opened){msg.textContent="Bu kutu zaten kapali.";msg.style.color="#8A8474";return;}
// Ödülü havuza iade et
var newPool=gs.prizePool.slice();
if(box.prize&&box.prize>0) newPool.push(box.prize);
// Kutuyu sifirla
var newBoxes=gs.boxes.map(function(b){
  return b.id===box.id?Object.assign({},b,{opened:false,prize:null,openOrder:null,taskWinners:null}):b;
});
// openCount'u bir azalt
var newCount=Math.max(0,(gs.openCount||1)-1);
gs=Object.assign({},gs,{boxes:newBoxes,prizePool:newPool,openCount:newCount});
lsSet(SK_GAME,gs);
msg.textContent="✅ "+pn+" #"+bn+" kapatialdi, ödül havuza iade edildi.";
msg.style.color="#4ADE80";
render();
}

function fixBox(){
var pn=document.getElementById("fixBoxPlayer").value;
var bn=parseInt(document.getElementById("fixBoxNum").value)||0;
var bp=parseInt(document.getElementById("fixBoxPrize").value)||0;
var msg=document.getElementById("fixBoxMsg");
if(!pn||!bn||!bp){msg.textContent="Tüm alanları doldur.";msg.style.color="#c0392b";return;}
var box=null;
for(var i=0;i<gs.boxes.length;i++){
  if(gs.boxes[i].owner===pn&&gs.boxes[i].num===bn&&!gs.boxes[i].task&&!gs.boxes[i].calendarId){
    box=gs.boxes[i];break;
  }
}
if(!box){msg.textContent="Kutu bulunamadi (takvim/gorev kutulari atanamaz).";msg.style.color="#c0392b";return;}
gs=Object.assign({},gs,{boxes:gs.boxes.map(function(b){return b.id===box.id?Object.assign({},b,{prize:bp}):b;})});
lsSet(SK_GAME,gs);msg.textContent="✅ "+pn+" #"+bn+" → "+bp.toLocaleString("tr-TR")+"₺";msg.style.color="#4ADE80";render();
}
function addCalBox(){
var dv=document.getElementById("calDate").value;
var tv=document.getElementById("calTask").value.trim();
var pv=parseInt(document.getElementById("calPrize").value)||0;
var ov=document.getElementById("calOwner").value;
if(!dv||!tv){alert("Tarih ve görev gerekli.");return;}
var parts=dv.split("-");
var label=parseInt(parts[2])+"/"+parseInt(parts[1])+"/"+parts[0];
var dayKey=parts[0]+"-"+(parts[1].length<2?"0":"")+parts[1]+"-"+(parts[2].length<2?"0":"")+parts[2];
var calId="cal-"+Date.now();
taskCfg.calendar.push({id:calId,date:dv,dayKey:dayKey,label:label,taskText:tv,prize:pv,owner:ov});
var maxId=gs.boxes.reduce(function(m,b){return Math.max(m,b.id);},0);
gs.boxes.push({id:++maxId,owner:ov||"__ortak__",num:taskCfg.calendar.length,prize:null,opened:false,openOrder:null,task:{text:tv,prize:pv},calendarId:calId,calendarDay:dayKey,calendarLabel:label});
lsSet(SK_TASKS,taskCfg);lsSet(SK_GAME,gs);
document.getElementById("calTask").value="";document.getElementById("calPrize").value="";render();
}

taskCfg.calendar=(taskCfg.calendar||[]).filter(function(c){return !c.id||c.id.indexOf("cal-may26-")<0;});
var maxId=newBoxes.reduce(function(m,b){return Math.max(m,b.id);},0);

function addTaskBox(){
var owner=document.getElementById("taskOwner").value;
var num=parseInt(document.getElementById("taskBoxNum").value)||0;
var text=document.getElementById("taskText").value.trim();
var prize=parseInt(document.getElementById("taskPrize").value)||0;
var msg=document.getElementById("taskBoxMsg");
if(!owner||!num||!text){msg.textContent="Oyuncu, kutu # ve görev metni gerekli.";msg.style.color="#c0392b";return;}
var box=null;for(var i=0;i<gs.boxes.length;i++){if(gs.boxes[i].owner===owner&&gs.boxes[i].num===num&&!gs.boxes[i].opened){box=gs.boxes[i];break;}}
if(!box){msg.textContent="Kutu bulunamadı veya açık.";msg.style.color="#c0392b";return;}
gs=Object.assign({},gs,{boxes:gs.boxes.map(function(b){return b.id===box.id?Object.assign({},b,{task:{text:text,prize:prize},prize:null}):b;})});
lsSet(SK_GAME,gs);msg.textContent="✅ Görev atandı.";msg.style.color="#4ADE80";render();
}

window.addEventListener("pagehide",function(){
  try{
    if(cfg) sessionStorage.setItem(SK_CFG, JSON.stringify(cfg));
    if(gs)  sessionStorage.setItem(SK_GAME, JSON.stringify(gs));
    if(taskCfg) sessionStorage.setItem(SK_TASKS, JSON.stringify(taskCfg));
  }catch(e){}
});
window.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"){
    try{
      if(cfg) sessionStorage.setItem(SK_CFG, JSON.stringify(cfg));
      if(gs)  sessionStorage.setItem(SK_GAME, JSON.stringify(gs));
      if(taskCfg) sessionStorage.setItem(SK_TASKS, JSON.stringify(taskCfg));
    }catch(e){}
  }
});
