<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0A;color:#F0ECD8;font-family:'Raleway',sans-serif;min-height:100vh;padding:16px}
h1{font-size:1.5rem;font-weight:800;color:#FFE000;margin-bottom:14px}
.card{background:#161616;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font-size:.6rem;color:#C9A000;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
input[type=date]{padding:5px 8px;background:#0F0F0F;border:1px solid rgba(255,255,255,.1);color:#F0ECD8;font-family:Raleway,sans-serif;font-size:.76rem;border-radius:5px;outline:none}
button{padding:5px 12px;border:none;border-radius:5px;font-family:Raleway,sans-serif;font-weight:800;font-size:.72rem;cursor:pointer}
.btn-y{background:#FFE000;color:#000}
.btn-g{background:none;border:1px solid rgba(255,255,255,.12);color:#8A8474}
.file-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.file-btn{padding:6px 14px;background:#FFE000;border-radius:5px;color:#000;font-weight:800;font-size:.74rem;cursor:pointer;white-space:nowrap;display:inline-block}
.file-name{font-size:.7rem;color:#8A8474}
.debug{font-size:.64rem;color:#8A8474;padding:5px 10px;background:#111;border-radius:5px;margin-bottom:10px}
.sec-title{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:#C9A000;font-weight:700;margin-bottom:8px;margin-top:16px}
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid rgba(255,255,255,.08);margin-bottom:4px}
table{width:100%;border-collapse:collapse;min-width:1100px}
thead th{padding:5px 8px;font-size:.54rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;text-align:right;border-bottom:2px solid rgba(255,224,0,.3);white-space:nowrap;color:#C9A000}
thead th:first-child{text-align:left}
tbody td{padding:4px 8px;font-size:.7rem;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap;color:#F0ECD8}
tbody td:first-child{text-align:left;font-weight:700;color:#FFE000;cursor:pointer;user-select:none}
tbody td:first-child:hover{color:#fff}
tbody tr.ref-row{display:none}
tbody tr.ref-row.open{display:table-row}
tbody tr.ref-row td{font-size:.62rem;font-weight:400;background:#0F0F0F;color:#F0ECD8}
tbody tr.ref-row td:first-child{color:#8A8474;padding-left:20px}
tfoot td{padding:4px 8px;font-size:.7rem;font-weight:800;text-align:right;border-top:2px solid rgba(255,224,0,.3);background:rgba(255,224,0,.04);color:#F0ECD8}
tfoot td:first-child{text-align:left;color:#F5C800}
.loading{padding:20px;color:#8A8474;font-size:.8rem}
.arrow{font-size:.6rem;margin-left:4px;color:#8A8474}
.rdv-section{margin-bottom:24px}
.rdv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.rdv-grid{grid-template-columns:1fr}}
.rdv-tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid rgba(255,255,255,.08)}
.rdv-tbl-wrap table{width:100%;border-collapse:collapse;min-width:280px}
.rdv-tbl-wrap thead th{padding:6px 10px;font-size:.55rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;text-align:right;border-bottom:2px solid rgba(255,224,0,.3);color:#C9A000;white-space:nowrap}
.rdv-tbl-wrap thead th:first-child{text-align:left}
.rdv-tbl-wrap tbody td{padding:5px 10px;font-size:.72rem;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);color:#F0ECD8;white-space:nowrap}
.rdv-tbl-wrap tbody td:first-child{text-align:left;font-weight:700;color:#FFE000}
.rdv-tbl-wrap tfoot td{padding:5px 10px;font-size:.72rem;font-weight:800;text-align:right;border-top:2px solid rgba(255,224,0,.3);background:rgba(255,224,0,.04);color:#F0ECD8}
.rdv-tbl-wrap tfoot td:first-child{text-align:left;color:#F5C800}
.rdv-badge{display:inline-block;background:#FFE000;color:#000;font-size:.6rem;font-weight:800;padding:1px 7px;border-radius:20px;margin-left:6px;vertical-align:middle}
.rdv-empty{padding:14px;color:#8A8474;font-size:.75rem;text-align:center}
.rdv-date-lbl{font-size:.64rem;color:#8A8474;margin-left:8px;font-weight:400}

<div id="rdvReport"></div>
<div id="report"></div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAk2oK4iQPQFIF5Z-aUCNTBfjP9NyP-GBQ",
  authDomain:"kutu-oyunu-8769b.firebaseapp.com",
  projectId:"kutu-oyunu-8769b"
});

const db=firebase.firestore();
let CRM=null;
let CIRO=null;
let _tableIdx=0;

const CHUNK=500;

const fbTimeout=(promise,ms=30000)=>{
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error("Firebase timeout")),ms))
  ]);
};

const _pot=note=>{
  const n=(note||"").toString().toUpperCase();
  const y=[
    "RANDEVU","GELECEĞİM","GELECEM","KESİNLİKLE","MUTLAKA","ALACAĞIM","KAYDOLMAK",
    "FİYAT","FIYAT","ÜCRET","TEKLİF","İLGİLENİYOR","BİLGİ VER","DÜŞÜNÜYORUM","MERAK",
    "HAFTA","YARIN","BUGÜN","TAM OLUR","PLANLAMA"
  ];
  const d=[
    "AÇMADI","ULAŞILAMIYOR","MEŞGUL","İLGİLENMİYOR","İSTEMİYOR","ALAKASIZ",
    "REDDETTİ","KAPAT","RAHATSIZ","TEKRAR ARAMAYACAK","YANLIŞLIKLA"
  ];
  if(n.length<3)return"d";
  if(y.some(k=>n.includes(k))&&!d.some(k=>n.includes(k)))return"y";
  if(d.some(k=>n.includes(k)))return"d";
  return"o";
};

const _cat=s=>{
  s=(s||"").toString().toUpperCase().trim();
  return{
    olumlu:s==="OLUMLU",
    olumsuz:s==="OLUMSUZ"||s==="TEKRAR",
    sonra:s==="SONRA ARANACAK",
    alakasiz:s.includes("ALAKASIZ")||s.includes("İLGİSİZ")||s.includes("ILGISIZ")
  };
};

const norm=s=>(s||"").toString().replace(/\s+/g," ").trim();

const normSube=s=>{
  s=(s||"").toString().trim();
  return s.includes("=>")?s.split("=>").pop().trim():s;
};

const parseTeklif=v=>{
  if(!v||String(v).trim()===""||String(v).trim()==="-")return 0;
  try{
    return parseInt(String(v).split(",")[0].replace(/\./g,"").trim())||0;
  }catch{
    return 0;
  }
};

const parseCiroVal=v=>{
  if(!v)return 0;
  if(typeof v==="number")return v;
  return parseFloat(String(v).replace(/[^\d.]/g,""))||0;
};

const parseDateCRM=v=>{
  if(!v)return null;
  const s=String(v).trim();

  if(/^\d{2}\.\d{2}\.\d{4}/.test(s)){
    const p=s.split(" ")[0].split(".");
    return`${p[2]}-${p[1]}-${p[0]}`;
  }

  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    return s.substring(0,10);
  }

  if(!isNaN(v)&&Number(v)>10000){
    const d=new Date(Math.round((Number(v)-25569)*86400*1000));
    return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
  }

  return null;
};

const parseDateCiro=v=>{
  if(!v)return null;

  if(v instanceof Date||String(v).includes("T")){
    const d=new Date(v);
    return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  if(typeof v==="number"&&v>10000){
    const d=new Date(Math.round((v-25569)*86400*1000));
    return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
  }

  return parseDateCRM(v);
};

const pct=(a,b)=>b>0?`${Math.round(a/b*100)}%`:"—";
const tl=n=>n>0?`${Math.round(n).toLocaleString("tr-TR")}₺`:"—";

const esc=s=>String(s||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");

const findCol=(keys,pats)=>{
  for(const k of keys){
    const n=k.replace(/[\s\u00a0]/g,"").toLowerCase()
      .replace(/ı/g,"i")
      .replace(/ş/g,"s")
      .replace(/ğ/g,"g")
      .replace(/ü/g,"u")
      .replace(/ö/g,"o")
      .replace(/ç/g,"c");

    if(pats.some(p=>n===p||n.includes(p)))return k;
  }
  return null;
};

const readXLSX=(file,cb)=>{
  const r=new FileReader();

  r.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    cb(XLSX.utils.sheet_to_json(ws,{defval:"",raw:false}));
  };

  r.onerror=()=>{
    alert("Excel dosyası okunamadı.");
  };

  r.readAsArrayBuffer(file);
};

function loadCRM(inp){
  const f=inp.files[0];
  if(!f)return;

  document.getElementById("crmFN").textContent="Yükleniyor...";

  readXLSX(f,rows=>{
    CRM=rows;
    document.getElementById("crmFN").textContent=`${f.name} ✅ (${rows.length} satır)`;
    saveToFB("crm",rows,f.name);
    build();
  });
}

function loadCiro(inp){
  const f=inp.files[0];
  if(!f)return;

  document.getElementById("ciroFN").textContent="Yükleniyor...";

  readXLSX(f,rows=>{
    CIRO=rows;
    document.getElementById("ciroFN").textContent=`${f.name} ✅ (${rows.length} satır)`;
    saveToFB("ciro",rows,f.name);
    build();
  });
}

function saveToFB(type,rows,fname){
  const chunks=[];

  for(let i=0;i<rows.length;i+=CHUNK){
    chunks.push(rows.slice(i,i+CHUNK));
  }

  const ts=Date.now();

  db.doc(`ozet/${type}meta`).set({
    ts,
    chunks:chunks.length,
    fname:fname||"",
    totalRows:rows.length
  }).catch(e=>console.warn("Meta kayıt hatası:",type,e));

  const writes=chunks.map((chunk,i)=>{
    return db.doc(`ozet/${type}_${i}`).set({
      rows:chunk,
      ts
    });
  });

  Promise.all(writes)
    .then(()=>console.log(`${type} Firebase kayıt tamamlandı:`,rows.length))
    .catch(e=>console.warn("Chunk kayıt hatası:",type,e));
}

async function loadFromFB(){
  document.getElementById("crmFN").textContent="Firebase kontrol ediliyor...";
  document.getElementById("ciroFN").textContent="Firebase kontrol ediliyor...";

  for(const type of ["ciro","crm"]){
    try{
      const meta=await fbTimeout(db.doc(`ozet/${type}meta`).get(),10000);

      if(!meta.exists){
        if(type==="crm")document.getElementById("crmFN").textContent="Dosya seçilmedi";
        if(type==="ciro")document.getElementById("ciroFN").textContent="Dosya seçilmedi";
        continue;
      }

      const data=meta.data()||{};
      const chunks=Number(data.chunks)||0;
      const fname=data.fname||"";

      let all=[];

      const refs=[];

      for(let i=0;i<chunks;i++){
        refs.push(db.doc(`ozet/${type}_${i}`).get());
      }

      const docs=await fbTimeout(Promise.all(refs),30000);

      docs.forEach(d=>{
        if(d.exists){
          all=all.concat(d.data().rows||[]);
        }
      });

      if(!all.length){
        if(type==="crm")document.getElementById("crmFN").textContent="CRM Firebase boş / Dosya seç";
        if(type==="ciro")document.getElementById("ciroFN").textContent="Ciro Firebase boş / Dosya seç";
        continue;
      }

      if(type==="crm"){
        CRM=all;
        document.getElementById("crmFN").textContent=(fname||"CRM")+` ✅ (${all.length} satır)`;
      }else{
        CIRO=all;
        document.getElementById("ciroFN").textContent=(fname||"Ciro")+` ✅ (${all.length} satır)`;
      }

    }catch(e){
      console.warn(type,e);

      if(type==="crm"){
        document.getElementById("crmFN").textContent="CRM Firebase okunamadı / Dosya seç";
      }

      if(type==="ciro"){
        document.getElementById("ciroFN").textContent="Ciro Firebase okunamadı / Dosya seç";
      }
    }
  }

  build();
}

// ─── RANDEVU FONKSİYONU ───────────────────────────────────────────────
function getDateStr(offsetDays){
  const t=new Date();
  t.setDate(t.getDate()+offsetDays);
  return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
}

function buildRandevu(){
  const container=document.getElementById("rdvReport");
  if(!CRM){container.innerHTML="";return;}

  const crmKeys=CRM.length?Object.keys(CRM[0]):[];

  // Randevu tarihi sütununu bul
  const CRDV=findCol(crmKeys,[
    "randevutarihi","randevutar","rdvtarihi","rdvtar","appointment",
    "randevu tarihi","randevu"
  ]);

  // Personel ve Şube sütunları
  const CK2=findCol(crmKeys,["kaydeden"])||"Kaydeden";
  const CS2=findCol(crmKeys,["sube"])||"Şube";
  const CSONUC2=findCol(crmKeys,["sonuc","sonuç"])||"Sonuç";

  if(!CRDV){
    container.innerHTML=`<div class="card rdv-section">
      <div class="sec-title">📅 Yarınki Randevular</div>
      <div class="rdv-empty">⚠️ CRM Excel'de randevu tarihi sütunu bulunamadı.<br>
      Beklenen sütun adı: <b>Randevu Tarihi</b></div>
    </div>`;
    return;
  }

  const tomorrow=getDateStr(1);
  const tmrDisplay=tomorrow.split("-").reverse().join(".");

  const rdvRows=CRM.filter(r=>{
    const d=parseDateCRM(r[CRDV]);
    return d===tomorrow;
  });

  // Şube haritası
  const subeMap={};
  // Personel haritası
  const persMap={};

  for(const r of rdvRows){
    const sube=norm(r[CS2])||"Belirtilmemiş";
    const pers=norm(r[CK2])||"Belirtilmemiş";
    const sonuc=norm(r[CSONUC2]);

    // Şube
    if(!subeMap[sube])subeMap[sube]={toplam:0,olumlu:0,olumsuz:0,sonra:0,diger:0};
    subeMap[sube].toplam++;
    const cs=_cat(sonuc);
    if(cs.olumlu)subeMap[sube].olumlu++;
    else if(cs.olumsuz)subeMap[sube].olumsuz++;
    else if(cs.sonra)subeMap[sube].sonra++;
    else subeMap[sube].diger++;

    // Personel
    if(!persMap[pers])persMap[pers]={toplam:0,olumlu:0,olumsuz:0,sonra:0,diger:0,sube:sube};
    persMap[pers].toplam++;
    if(cs.olumlu)persMap[pers].olumlu++;
    else if(cs.olumsuz)persMap[pers].olumsuz++;
    else if(cs.sonra)persMap[pers].sonra++;
    else persMap[pers].diger++;
  }

  const total=rdvRows.length;

  const renderRdvTable=(title,map,showSube)=>{
    const arr=Object.entries(map)
      .filter(([k])=>k&&k!=="nan")
      .sort((a,b)=>b[1].toplam-a[1].toplam);

    if(!arr.length)return`<div class="rdv-empty">Veri yok</div>`;

    let tot={toplam:0,olumlu:0,olumsuz:0,sonra:0,diger:0};

    let rows="";
    for(const [name,d] of arr){
      rows+=`<tr>
        <td>${esc(name)}${showSube&&d.sube?`<span style="color:#8A8474;font-size:.6rem;font-weight:400;margin-left:4px">${esc(d.sube)}</span>`:""}</td>
        <td style="color:#FFE000;font-weight:800">${d.toplam}</td>
        <td style="color:#4ADE80">${d.olumlu||"—"}</td>
        <td style="color:#e74c3c">${d.olumsuz||"—"}</td>
        <td style="color:#F5C800">${d.sonra||"—"}</td>
        <td style="color:#8A8474">${d.diger||"—"}</td>
      </tr>`;
      tot.toplam+=d.toplam;
      tot.olumlu+=d.olumlu;
      tot.olumsuz+=d.olumsuz;
      tot.sonra+=d.sonra;
      tot.diger+=d.diger;
    }

    return`<div class="rdv-tbl-wrap">
      <table>
        <thead><tr>
          <th style="text-align:left;color:#C9A000">${title}</th>
          <th style="color:#FFE000">Randevu</th>
          <th style="color:#4ADE80">Olumlu</th>
          <th style="color:#e74c3c">Olumsuz</th>
          <th style="color:#F5C800">S.Ara</th>
          <th style="color:#8A8474">Diğer</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td>TOPLAM</td>
          <td style="color:#FFE000">${tot.toplam}</td>
          <td style="color:#4ADE80">${tot.olumlu||"—"}</td>
          <td style="color:#e74c3c">${tot.olumsuz||"—"}</td>
          <td style="color:#F5C800">${tot.sonra||"—"}</td>
          <td style="color:#8A8474">${tot.diger||"—"}</td>
        </tr></tfoot>
      </table>
    </div>`;
  };

  const noData=total===0
    ?`<div class="rdv-empty">📭 ${tmrDisplay} tarihine ait randevu kaydı yok.</div>`
    :"";

  container.innerHTML=`<div class="card rdv-section">
    <div class="sec-title">
      📅 Yarınki Randevular
      <span class="rdv-badge">${total}</span>
      <span class="rdv-date-lbl">${tmrDisplay}</span>
    </div>
    ${noData||`<div class="rdv-grid">
      ${renderRdvTable("🏢 Şube",subeMap,false)}
      ${renderRdvTable("👤 Personel",persMap,true)}
    </div>`}
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────
function build(){
  const sd=document.getElementById("sd").value;
  const ed=document.getElementById("ed").value;

  if(!CRM&&!CIRO){
    document.getElementById("report").innerHTML='<div class="loading">Excel dosyalarını yükleyin.</div>';
    document.getElementById("rdvReport").innerHTML="";
    document.getElementById("dbg").style.display="none";
    return;
  }

  buildRandevu();

  const crmKeys=CRM&&CRM.length?Object.keys(CRM[0]):[];
  const ciroKeys=CIRO&&CIRO.length?Object.keys(CIRO[0]):[];

  const CK=findCol(crmKeys,["kaydeden"])||"Kaydeden";
  const CS=findCol(crmKeys,["sube"])||"Şube";
  const CSONUC=findCol(crmKeys,["sonuc","sonuç"])||"Sonuç";
  const CNOT=findCol(crmKeys,["notlar","not"])||"Notlar";
  const CREF=findCol(crmKeys,["referans"])||"Referans";
  const CT=findCol(crmKeys,["sonteklif","teklifficiyati"])||"Son Teklif Fiyatı";
  const CDATE=findCol(crmKeys,["kayittarihi"])||"Kayıt Tarihi";
  const CRDV_B=findCol(crmKeys,["randevutarihi","randevutar","rdvtarihi","rdvtar","randevu tarihi","randevu"]);
  const todayStr=getDateStr(0);

  const CP=findCol(ciroKeys,["sonegitimekleyen","egitimekleyen"])||"Son Eğitim Ekleyen";
  const CSB=findCol(ciroKeys,["sube"])||"Şube";
  const CCREF=findCol(ciroKeys,["referans"])||"Referans";
  const CCIRO=findCol(ciroKeys,["egitimciro"])||"Eğitim Ciro";
  const CTAH=findCol(ciroKeys,["tahsilat"])||"Tahsilat";
  const CKUR=findCol(ciroKeys,["kur"])||"Kur";
  const CDATE2=findCol(ciroKeys,["kayittarihi"])||"Kayıt Tarihi";

  const inRange=(v,isCRM)=>{
    const d=isCRM?parseDateCRM(v):parseDateCiro(v);
    if(!d)return true;
    if(sd&&d<sd)return false;
    if(ed&&d>ed)return false;
    return true;
  };

  const kFilt=(CRM||[]).filter(r=>inRange(r[CDATE],true));
  const cFilt=(CIRO||[]).filter(r=>inRange(r[CDATE2],false));

  const sdF=sd?sd.split("-").reverse().join("."):"tümü";
  const edF=ed?ed.split("-").reverse().join("."):"tümü";

  const dbg=document.getElementById("dbg");
  dbg.style.display="block";
  dbg.textContent=`🔍 CRM: ${kFilt.length} satır | Ciro: ${cFilt.length} satır | Tarih: ${sdF} → ${edF}`;

  if(!kFilt.length&&!cFilt.length){
    document.getElementById("report").innerHTML='<div class="loading">Seçili tarih aralığında veri yok.</div>';
    return;
  }

  const emptyD=()=>({
    crm:0,
    ts:0,
    tc:0,
    ks:0,
    kc:0,
    kur:0,
    tahsilat:0,
    olumlu:0,
    olumsuz:0,
    sonra:0,
    alakasiz:0,
    pot_y:0,
    pot_o:0,
    pot_d:0,
    rdv:0,
    refs:{}
  });

  const addCRM=(map,key,ref,t,sonuc,note)=>{
    if(!key)return;
    if(!map[key])map[key]=emptyD();

    map[key].crm++;

    if(t>0){
      map[key].ts++;
      map[key].tc+=t;
    }

    const c=_cat(sonuc);
    const p=_pot(note);

    if(c.olumlu)map[key].olumlu++;
    if(c.olumsuz)map[key].olumsuz++;
    if(c.sonra)map[key].sonra++;
    if(c.alakasiz)map[key].alakasiz++;

    if(p==="y")map[key].pot_y++;
    else if(p==="o")map[key].pot_o++;
    else map[key].pot_d++;

    if(!map[key].refs[ref])map[key].refs[ref]=emptyD();

    map[key].refs[ref].crm++;

    if(t>0){
      map[key].refs[ref].ts++;
      map[key].refs[ref].tc+=t;
    }

    const rc=map[key].refs[ref];

    if(c.olumlu)rc.olumlu++;
    if(c.olumsuz)rc.olumsuz++;
    if(c.sonra)rc.sonra++;
    if(c.alakasiz)rc.alakasiz++;

    if(p==="y")rc.pot_y++;
    else if(p==="o")rc.pot_o++;
    else rc.pot_d++;
  };

  const addCiro=(map,key,ref,c,tah,kur)=>{
    if(!key)return;
    if(!map[key])map[key]=emptyD();

    map[key].ts++;
    map[key].tc+=c;
    map[key].ks++;
    map[key].kc+=c;
    map[key].tahsilat+=tah;
    map[key].kur+=kur;

    if(!map[key].refs[ref])map[key].refs[ref]=emptyD();

    map[key].refs[ref].ts++;
    map[key].refs[ref].tc+=c;
    map[key].refs[ref].ks++;
    map[key].refs[ref].kc+=c;
    map[key].refs[ref].tahsilat+=tah;
    map[key].refs[ref].kur+=kur;
  };

  const pMap={};
  const sMap={};

  for(const r of kFilt){
    const pKey=norm(r[CK]);
    const sKey=norm(r[CS]);
    const refKey=norm(r[CREF]).toUpperCase();

    addCRM(pMap,pKey,refKey,parseTeklif(r[CT]),r[CSONUC],r[CNOT]);
    addCRM(sMap,sKey,refKey,parseTeklif(r[CT]),r[CSONUC],r[CNOT]);

    if(CRDV_B&&parseDateCRM(r[CRDV_B])===todayStr){
      if(pMap[pKey])pMap[pKey].rdv++;
      if(sMap[sKey])sMap[sKey].rdv++;
    }
  }

  for(const r of cFilt){
    const c=parseCiroVal(r[CCIRO]);
    const tah=parseCiroVal(r[CTAH]);
    const kur=parseFloat(r[CKUR])||0;

    addCiro(
      pMap,
      norm(r[CP]),
      norm(r[CCREF]).toUpperCase(),
      c,
      tah,
      kur
    );

    addCiro(
      sMap,
      normSube(r[CSB]),
      norm(r[CCREF]).toUpperCase(),
      c,
      tah,
      kur
    );
  }

  _tableIdx=0;

  document.getElementById("report").innerHTML=
    renderTable("👤 Personel Bazlı Özet",pMap)+
    renderTable("🏢 Şube Bazlı Özet",sMap);

  document.querySelectorAll(".main-row").forEach(tr=>{
    tr.querySelector("td:first-child").addEventListener("click",()=>{
      const id=tr.dataset.id;

      document.querySelectorAll(`.ref-row[data-pid="${id}"]`).forEach(r=>{
        r.classList.toggle("open");
      });

      const arrow=tr.querySelector(".arrow");
      const firstRef=document.querySelector(`.ref-row[data-pid="${id}"]`);

      if(arrow){
        arrow.textContent=firstRef&&firstRef.classList.contains("open")?"▲":"▼";
      }
    });
  });
}

function renderTable(title,map){
  _tableIdx++;

  const tid=_tableIdx;

  const arr=Object.entries(map)
    .filter(([k])=>k&&k!=="nan")
    .map(([name,d])=>({name,d}))
    .sort((a,b)=>b.d.kc-a.d.kc);

  if(!arr.length)return"";

  const C={
    teklif:"#a78bfa",
    kayit:"#4ADE80",
    rdv:"#F5C800",
    kyt:"#4ADE80",
    kc:"#a78bfa",
    tc:"#e67e22",
    ciro:"#e74c3c",
    tah:"#4ADE80",
    kur:"#F5C800"
  };

  let thead=`<thead><tr>
    <th style="text-align:left;color:#C9A000">İsim</th>
    <th>T.Data</th>
    <th style="color:${C.teklif}">Teklif</th>
    <th style="color:${C.kayit}">Kayıt</th>
    <th style="color:${C.kur}">Kur</th>
    <th style="color:#4ADE80">Rdv</th>
    <th style="color:${C.rdv}">Rdv%</th>
    <th style="color:${C.kyt}">Kyt%</th>
    <th style="color:${C.kc}">Kayıt Ciro</th>
    <th style="color:${C.tc}">Top.Teklif Ciro</th>
    <th style="color:${C.ciro}">Ciro%</th>
    <th style="color:${C.tah}">Tahsilat</th>
    <th style="color:#4ADE80">Olumlu</th>
    <th style="color:#e74c3c">Olumsuz</th>
    <th style="color:#F5C800">S.Ara</th>
    <th style="color:#8A8474">Alksz</th>
    <th style="color:#4ADE80">🟢</th>
    <th style="color:#F5C800">🟡</th>
    <th style="color:#e74c3c">🔴</th>
  </tr></thead>`;

  let tot={
    td:0,
    ts:0,
    ks:0,
    kc:0,
    tc:0,
    tah:0,
    kur:0,
    rdv:0,
    olumlu:0,
    olumsuz:0,
    sonra:0,
    alakasiz:0,
    pot_y:0,
    pot_o:0,
    pot_d:0
  };

  let tbody="<tbody>";

  for(let i=0;i<arr.length;i++){
    const {name,d}=arr[i];
    const td=d.crm+d.ks;
    const tsTot=d.ts+d.ks;
    const rid=`${tid}_${i}`;
    const bg=i%2===0?"#161616":"#141414";

    tbody+=`<tr class="main-row" data-id="${rid}" style="background:${bg}">
      <td>${esc(name)}<span class="arrow">▼</span></td>
      <td>${td}</td>
      <td style="color:${C.teklif}">${tsTot}</td>
      <td style="color:${C.kayit}">${d.ks}</td>
      <td style="color:${C.kur}">${d.kur}</td>
      <td style="color:#4ADE80;font-weight:${d.rdv>0?"700":"400"}">${d.rdv||"—"}</td>
      <td style="color:${C.rdv}">${pct(tsTot,td)}</td>
      <td style="color:${C.kyt}">${pct(d.ks,tsTot)}</td>
      <td style="color:${C.kc}">${tl(d.kc)}</td>
      <td style="color:${C.tc}">${tl(d.tc)}</td>
      <td style="color:${C.ciro}">${pct(d.kc,d.tc)}</td>
      <td style="color:${C.tah}">${tl(d.tahsilat)}</td>
      <td style="color:#4ADE80">${d.olumlu}</td>
      <td style="color:#e74c3c">${d.olumsuz}</td>
      <td style="color:#F5C800">${d.sonra}</td>
      <td style="color:#8A8474">${d.alakasiz}</td>
      <td style="color:#4ADE80">${d.pot_y}</td>
      <td style="color:#F5C800">${d.pot_o}</td>
      <td style="color:#e74c3c">${d.pot_d}</td>
    </tr>`;

    const refs=Object.entries(d.refs)
      .filter(([,r])=>r.crm+r.ks>0)
      .sort((a,b)=>b[1].kc-a[1].kc);

    for(const [ref,rd] of refs){
      const rtd=rd.crm+rd.ks;
      const rtsTot=rd.ts+rd.ks;

      tbody+=`<tr class="ref-row" data-pid="${rid}">
        <td>↳ ${esc(ref)}</td>
        <td>${rtd}</td>
        <td style="color:${C.teklif}">${rtsTot||"—"}</td>
        <td style="color:${C.kayit}">${rd.ks||"—"}</td>
        <td style="color:${C.kur}">${rd.kur||"—"}</td>
        <td>—</td>
        <td style="color:${C.rdv}">${pct(rtsTot,rtd)}</td>
        <td style="color:${C.kyt}">${pct(rd.ks,rtsTot)}</td>
        <td style="color:${C.kc}">${tl(rd.kc)}</td>
        <td style="color:${C.tc}">${tl(rd.tc)}</td>
        <td style="color:${C.ciro}">${pct(rd.kc,rd.tc)}</td>
        <td style="color:${C.tah}">${tl(rd.tahsilat)}</td>
        <td colspan="7"></td>
      </tr>`;
    }

    tot.td+=td;
    tot.ts+=d.ts;
    tot.ks+=d.ks;
    tot.rdv+=d.rdv;
    tot.kc+=d.kc;
    tot.tc+=d.tc;
    tot.tah+=d.tahsilat;
    tot.kur+=d.kur;
    tot.olumlu+=d.olumlu;
    tot.olumsuz+=d.olumsuz;
    tot.sonra+=d.sonra;
    tot.alakasiz+=d.alakasiz;
    tot.pot_y+=d.pot_y;
    tot.pot_o+=d.pot_o;
    tot.pot_d+=d.pot_d;
  }

  tbody+="</tbody>";

  const tfoot=`<tfoot><tr>
    <td>TOPLAM</td>
    <td>${tot.td}</td>
    <td style="color:${C.teklif}">${tot.ts+tot.ks}</td>
    <td style="color:${C.kayit}">${tot.ks}</td>
    <td style="color:${C.kur}">${tot.kur}</td>
    <td style="color:#4ADE80;font-weight:${tot.rdv>0?"700":"400"}">${tot.rdv||"—"}</td>
    <td style="color:${C.rdv}">${pct(tot.ts+tot.ks,tot.td)}</td>
    <td style="color:${C.kyt}">${pct(tot.ks,tot.ts+tot.ks)}</td>
    <td style="color:${C.kc}">${tl(tot.kc)}</td>
    <td style="color:${C.tc}">${tl(tot.tc)}</td>
    <td style="color:${C.ciro}">${pct(tot.kc,tot.tc)}</td>
    <td style="color:${C.tah}">${tl(tot.tah)}</td>
    <td style="color:#4ADE80">${tot.olumlu}</td>
    <td style="color:#e74c3c">${tot.olumsuz}</td>
    <td style="color:#F5C800">${tot.sonra}</td>
    <td style="color:#8A8474">${tot.alakasiz}</td>
    <td style="color:#4ADE80">${tot.pot_y}</td>
    <td style="color:#F5C800">${tot.pot_o}</td>
    <td style="color:#e74c3c">${tot.pot_d}</td>
  </tr></tfoot>`;

  return`<div class="sec-title">${title}</div>
  <div class="tbl-wrap"><table>${thead}${tbody}${tfoot}</table></div>`;
}

function clearD(){
  document.getElementById("sd").value="";
  document.getElementById("ed").value="";
  build();
}

const t=new Date();

document.getElementById("sd").value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-01`;
document.getElementById("ed").value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;

loadFromFB();
</script>
