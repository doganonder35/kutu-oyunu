<style>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAk2oK4iQPQFIF5Z-aUCNTBfjP9NyP-GBQ",
  authDomain:"kutu-oyunu-8769b.firebaseapp.com",
  projectId:"kutu-oyunu-8769b"
});

const db=firebase.firestore();
let CRM=null;
let CIRO=null;
let _tableIdx=0;

const CHUNK=500;

const fbTimeout=(promise,ms=30000)=>{
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error("Firebase timeout")),ms))
  ]);
};

const _pot=note=>{
  const n=(note||"").toString().toUpperCase();
  const y=[
    "RANDEVU","GELECEĞİM","GELECEM","KESİNLİKLE","MUTLAKA","ALACAĞIM","KAYDOLMAK",
    "FİYAT","FIYAT","ÜCRET","TEKLİF","İLGİLENİYOR","BİLGİ VER","DÜŞÜNÜYORUM","MERAK",
    "HAFTA","YARIN","BUGÜN","TAM OLUR","PLANLAMA"
  ];
  const d=[
    "AÇMADI","ULAŞILAMIYOR","MEŞGUL","İLGİLENMİYOR","İSTEMİYOR","ALAKASIZ",
    "REDDETTİ","KAPAT","RAHATSIZ","TEKRAR ARAMAYACAK","YANLIŞLIKLA"
  ];
  if(n.length<3)return"d";
  if(y.some(k=>n.includes(k))&&!d.some(k=>n.includes(k)))return"y";
  if(d.some(k=>n.includes(k)))return"d";
  return"o";
};

const _cat=s=>{
  s=(s||"").toString().toUpperCase().trim();
  return{
    olumlu:s==="OLUMLU",
    olumsuz:s==="OLUMSUZ"||s==="TEKRAR",
    sonra:s==="SONRA ARANACAK",
    alakasiz:s.includes("ALAKASIZ")||s.includes("İLGİSİZ")||s.includes("ILGISIZ")
  };
};

const norm=s=>(s||"").toString().replace(/\s+/g," ").trim();

const normSube=s=>{
  s=(s||"").toString().trim();
  return s.includes("=>")?s.split("=>").pop().trim():s;
};

const parseTeklif=v=>{
  if(!v||String(v).trim()===""||String(v).trim()==="-")return 0;
  try{
    return parseInt(String(v).split(",")[0].replace(/\./g,"").trim())||0;
  }catch{
    return 0;
  }
};

const parseCiroVal=v=>{
  if(!v)return 0;
  if(typeof v==="number")return v;
  return parseFloat(String(v).replace(/[^\d.]/g,""))||0;
};

const parseDateCRM=v=>{
  if(!v)return null;
  const s=String(v).trim();

  if(/^\d{2}\.\d{2}\.\d{4}/.test(s)){
    const p=s.split(" ")[0].split(".");
    return`${p[2]}-${p[1]}-${p[0]}`;
  }

  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    return s.substring(0,10);
  }

  if(!isNaN(v)&&Number(v)>10000){
    const d=new Date(Math.round((Number(v)-25569)*86400*1000));
    return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
  }

  return null;
};

const parseDateCiro=v=>{
  if(!v)return null;

  if(v instanceof Date||String(v).includes("T")){
    const d=new Date(v);
    return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  if(typeof v==="number"&&v>10000){
    const d=new Date(Math.round((v-25569)*86400*1000));
    return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
  }

  return parseDateCRM(v);
};

const pct=(a,b)=>b>0?`${Math.round(a/b*100)}%`:"—";
const tl=n=>n>0?`${Math.round(n).toLocaleString("tr-TR")}₺`:"—";

const esc=s=>String(s||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");

const findCol=(keys,pats)=>{
  for(const k of keys){
    const n=k.replace(/[\s\u00a0]/g,"").toLowerCase()
      .replace(/ı/g,"i")
      .replace(/ş/g,"s")
      .replace(/ğ/g,"g")
      .replace(/ü/g,"u")
      .replace(/ö/g,"o")
      .replace(/ç/g,"c");

    if(pats.some(p=>n===p||n.includes(p)))return k;
  }
  return null;
};

const readXLSX=(file,cb)=>{
  const r=new FileReader();

  r.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    cb(XLSX.utils.sheet_to_json(ws,{defval:"",raw:false}));
  };

  r.onerror=()=>{
    alert("Excel dosyası okunamadı.");
  };

  r.readAsArrayBuffer(file);
};

function loadCRM(inp){
  const f=inp.files[0];
  if(!f)return;

  document.getElementById("crmFN").textContent="Yükleniyor...";

  readXLSX(f,rows=>{
    CRM=rows;
    document.getElementById("crmFN").textContent=`${f.name} ✅ (${rows.length} satır)`;
    saveToFB("crm",rows,f.name);
    build();
  });
}

function loadCiro(inp){
  const f=inp.files[0];
  if(!f)return;

  document.getElementById("ciroFN").textContent="Yükleniyor...";

  readXLSX(f,rows=>{
    CIRO=rows;
    document.getElementById("ciroFN").textContent=`${f.name} ✅ (${rows.length} satır)`;
    saveToFB("ciro",rows,f.name);
    build();
  });
}

function saveToFB(type,rows,fname){
  const chunks=[];

  for(let i=0;i<rows.length;i+=CHUNK){
    chunks.push(rows.slice(i,i+CHUNK));
  }

  const ts=Date.now();

  db.doc(`ozet/${type}meta`).set({
    ts,
    chunks:chunks.length,
    fname:fname||"",
    totalRows:rows.length
  }).catch(e=>console.warn("Meta kayıt hatası:",type,e));

  const writes=chunks.map((chunk,i)=>{
    return db.doc(`ozet/${type}_${i}`).set({
      rows:chunk,
      ts
    });
  });

  Promise.all(writes)
    .then(()=>console.log(`${type} Firebase kayıt tamamlandı:`,rows.length))
    .catch(e=>console.warn("Chunk kayıt hatası:",type,e));
}

async function loadFromFB(){
  document.getElementById("crmFN").textContent="Firebase kontrol ediliyor...";
  document.getElementById("ciroFN").textContent="Firebase kontrol ediliyor...";

  for(const type of ["ciro","crm"]){
    try{
      const meta=await fbTimeout(db.doc(`ozet/${type}meta`).get(),10000);

      if(!meta.exists){
        if(type==="crm")document.getElementById("crmFN").textContent="Dosya seçilmedi";
        if(type==="ciro")document.getElementById("ciroFN").textContent="Dosya seçilmedi";
        continue;
      }

      const data=meta.data()||{};
      const chunks=Number(data.chunks)||0;
      const fname=data.fname||"";

      let all=[];

      const refs=[];

      for(let i=0;i<chunks;i++){
        refs.push(db.doc(`ozet/${type}_${i}`).get());
      }

      const docs=await fbTimeout(Promise.all(refs),30000);

      docs.forEach(d=>{
        if(d.exists){
          all=all.concat(d.data().rows||[]);
        }
      });

      if(!all.length){
        if(type==="crm")document.getElementById("crmFN").textContent="CRM Firebase boş / Dosya seç";
        if(type==="ciro")document.getElementById("ciroFN").textContent="Ciro Firebase boş / Dosya seç";
        continue;
      }

      if(type==="crm"){
        CRM=all;
        document.getElementById("crmFN").textContent=(fname||"CRM")+` ✅ (${all.length} satır)`;
      }else{
        CIRO=all;
        document.getElementById("ciroFN").textContent=(fname||"Ciro")+` ✅ (${all.length} satır)`;
      }

    }catch(e){
      console.warn(type,e);

      if(type==="crm"){
        document.getElementById("crmFN").textContent="CRM Firebase okunamadı / Dosya seç";
      }

      if(type==="ciro"){
        document.getElementById("ciroFN").textContent="Ciro Firebase okunamadı / Dosya seç";
      }
    }
  }

  build();
}

// ─── RANDEVU FONKSİYONU ───────────────────────────────────────────────
function getDateStr(offsetDays){
  var t=new Date();
  t.setDate(t.getDate()+offsetDays);
  return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
}

function rdvTabSwitch(containerId,panelId){
  var container=document.getElementById(containerId);
  if(!container)return;
  var panels=container.querySelectorAll(".rdvlist-panel");
  panels.forEach(function(p){p.classList.remove("active");});
  var target=document.getElementById(panelId);
  if(target)target.classList.add("active");
  var tabsEl=container.closest(".rdvlist-section");
  if(tabsEl){
    var tabs=tabsEl.querySelectorAll(".rdvlist-tab");
    tabs.forEach(function(tab){
      var onclick=tab.getAttribute("onclick")||"";
      tab.classList.toggle("active",onclick.indexOf("'"+panelId+"'")>-1);
    });
  }
}

function buildRandevu(){
  var container=document.getElementById("rdvReport");
  if(!CRM){container.innerHTML="";return;}

  var crmKeys=CRM.length?Object.keys(CRM[0]):[];
  var CRDV=findCol(crmKeys,["randevutarihi","randevutar","rdvtarihi","rdvtar","appointment","randevu tarihi","randevu"]);
  var CK2=findCol(crmKeys,["kaydeden"])||"Kaydeden";
  var CS2=findCol(crmKeys,["sube"])||"Şube";
  var CSONUC2=findCol(crmKeys,["sonuc","sonuç"])||"Sonuç";
  var CADSOYAD=findCol(crmKeys,["adsoyadi","adsoyad","adisoyadi","musteriadi","musteri adi","ad soyad","isim","müşteri adı","müşteri","ad"])||null;
  var CTEL=findCol(crmKeys,["telefon","tel","gsm","cep","phone","mobile"])||null;
  var CACIKLAMA=findCol(crmKeys,["aciklama","açıklama","notlar","not","notes","acıklama"])||null;

  if(!CRDV){
    container.innerHTML='<div class="card rdv-section"><div class="sec-title">📅 Randevular</div><div class="rdv-empty">⚠️ CRM Excel\'de randevu tarihi sütunu bulunamadı.<br>Beklenen sütun adı: <b>Randevu Tarihi</b></div></div>';
    return;
  }

  // Saat çıkarıcı
  var extractTime=function(text){
    if(!text)return"";
    var t=String(text);
    var lines=t.split(/[\n\r]+/).map(function(l){return l.trim();}).filter(Boolean);
    var checkLines=lines.slice(-3).reverse();
    checkLines.push(t);
    for(var li=0;li<checkLines.length;li++){
      var line=checkLines[li];
      var m=line.match(/saat\s+([0-9]{1,2})[:\.]?([0-9]{2})?/i);
      if(m){var h=parseInt(m[1]);var min=m[2]||"00";if(h>=7&&h<=22)return String(h).padStart(2,"0")+":"+min;}
      m=line.match(/\b([0-9]{1,2}):([0-9]{2})['\u2019]?(a|de|da|te|ta)/i);
      if(m){var h=parseInt(m[1]);if(h>=7&&h<=22)return String(h).padStart(2,"0")+":"+m[2];}
      m=line.match(/\b([0-9]{1,2}):([0-9]{2})\b/);
      if(m){var h=parseInt(m[1]);var min=parseInt(m[2]);if(h>=7&&h<=22&&min>=0&&min<=59)return String(h).padStart(2,"0")+":"+String(min).padStart(2,"0");}
      m=line.match(/\b([0-9]{1,2})\.([0-9]{2})\b/);
      if(m){var h=parseInt(m[1]);var min=parseInt(m[2]);if(h>=7&&h<=22&&min>=0&&min<=59&&(min>12||h>12))return String(h).padStart(2,"0")+":"+String(min).padStart(2,"0");}
    }
    return"";
  };

  var buildMaps=function(targetDate){
    var rows=CRM.filter(function(r){return parseDateCRM(r[CRDV])===targetDate;});
    var subeMap={};var persMap={};
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      var sube=norm(r[CS2])||"Belirtilmemiş";
      var pers=norm(r[CK2])||"Belirtilmemiş";
      var cs=_cat(norm(r[CSONUC2]));
      if(!subeMap[sube])subeMap[sube]={toplam:0,olumlu:0,olumsuz:0,sonra:0,diger:0};
      subeMap[sube].toplam++;
      if(cs.olumlu)subeMap[sube].olumlu++;else if(cs.olumsuz)subeMap[sube].olumsuz++;else if(cs.sonra)subeMap[sube].sonra++;else subeMap[sube].diger++;
      if(!persMap[pers])persMap[pers]={toplam:0,olumlu:0,olumsuz:0,sonra:0,diger:0,sube:sube};
      persMap[pers].toplam++;
      if(cs.olumlu)persMap[pers].olumlu++;else if(cs.olumsuz)persMap[pers].olumsuz++;else if(cs.sonra)persMap[pers].sonra++;else persMap[pers].diger++;
    }
    return{rows:rows,subeMap:subeMap,persMap:persMap};
  };

  var renderRdvTable=function(title,map,showSube){
    var arr=Object.entries(map).filter(function(e){return e[0]&&e[0]!=="nan";}).sort(function(a,b){return b[1].toplam-a[1].toplam;});
    if(!arr.length)return'<div class="rdv-empty">Veri yok</div>';
    var tot={toplam:0,olumlu:0,olumsuz:0,sonra:0,diger:0};
    var rows="";
    for(var i=0;i<arr.length;i++){
      var name=arr[i][0];var d=arr[i][1];
      rows+="<tr><td>"+esc(name)+(showSube&&d.sube?'<span style="color:#8A8474;font-size:.6rem;font-weight:400;margin-left:4px">'+esc(d.sube)+"</span>":"")+"</td>"
        +'<td style="color:#FFE000;font-weight:800">'+d.toplam+"</td>"
        +'<td style="color:#4ADE80">'+(d.olumlu||"—")+"</td>"
        +'<td style="color:#e74c3c">'+(d.olumsuz||"—")+"</td>"
        +'<td style="color:#F5C800">'+(d.sonra||"—")+"</td>"
        +'<td style="color:#8A8474">'+(d.diger||"—")+"</td></tr>";
      tot.toplam+=d.toplam;tot.olumlu+=d.olumlu;tot.olumsuz+=d.olumsuz;tot.sonra+=d.sonra;tot.diger+=d.diger;
    }
    return'<div class="rdv-tbl-wrap"><table>'
      +'<thead><tr><th style="text-align:left;color:#C9A000">'+title+'</th><th style="color:#FFE000">Randevu</th><th style="color:#4ADE80">Olumlu</th><th style="color:#e74c3c">Olumsuz</th><th style="color:#F5C800">S.Ara</th><th style="color:#8A8474">Diğer</th></tr></thead>'
      +'<tbody>'+rows+'</tbody>'
      +'<tfoot><tr><td>TOPLAM</td><td style="color:#FFE000">'+tot.toplam+'</td><td style="color:#4ADE80">'+(tot.olumlu||"—")+'</td><td style="color:#e74c3c">'+(tot.olumsuz||"—")+'</td><td style="color:#F5C800">'+(tot.sonra||"—")+'</td><td style="color:#8A8474">'+(tot.diger||"—")+'</td></tr></tfoot></table></div>';
  };

  var renderList=function(label,emoji,accentColor,offset){
    var targetDate=getDateStr(offset);
    var display=targetDate.split("-").reverse().join(".");
    var rows=CRM.filter(function(r){return parseDateCRM(r[CRDV])===targetDate;});
    if(!rows.length){
      return'<div class="card rdvlist-section" style="border-left:3px solid '+accentColor+'">'
        +'<div class="sec-title">'+emoji+" "+label+' <span class="rdv-badge" style="background:'+accentColor+';color:#000">0</span> <span class="rdv-date-lbl">'+display+'</span></div>'
        +'<div class="rdvlist-empty">📭 Bu tarihe ait randevu yok.</div></div>';
    }
    var subeGroups={};
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      var sube=norm(r[CS2])||"Belirtilmemiş";
      if(!subeGroups[sube])subeGroups[sube]=[];
      var ad=CADSOYAD?String(r[CADSOYAD]||"").trim():"";
      var tel=CTEL?String(r[CTEL]||"").trim():"";
      var aciklama=CACIKLAMA?String(r[CACIKLAMA]||"").trim():"";
      var saat=extractTime(aciklama);
      subeGroups[sube].push({ad:ad,tel:tel,saat:saat});
    }
    var subeList=Object.keys(subeGroups).sort();
    var uid="rdvl_"+offset+"_"+Date.now();
    var tabs="";
    for(var si=0;si<subeList.length;si++){
      var s=subeList[si];
      tabs+='<button class="rdvlist-tab'+(si===0?" active":"")+'" onclick="rdvTabSwitch(\''+uid+'\',\''+uid+"_"+si+'\')" id="'+uid+'_tab_'+si+'">'+esc(s)+' <span style="opacity:.7">('+subeGroups[s].length+')</span></button>';
    }
    var panels="";
    for(var pi=0;pi<subeList.length;pi++){
      var ps=subeList[pi];
      var items=subeGroups[ps];
      items.sort(function(a,b){if(a.saat&&!b.saat)return-1;if(!a.saat&&b.saat)return 1;return a.saat<b.saat?-1:a.saat>b.saat?1:0;});
      var itemHtml="";
      for(var ii=0;ii<items.length;ii++){
        var itm=items[ii];
        itemHtml+='<div class="rdvlist-item"><div class="rdvlist-num">'+(ii+1)+'</div><div class="rdvlist-info"><div class="rdvlist-name">'+(itm.ad||'<span style="color:#8A8474">—</span>')+'</div>'+(itm.tel?'<div class="rdvlist-phone">📞 '+esc(itm.tel)+'</div>':'<div class="rdvlist-phone" style="color:#8A8474">Telefon yok</div>')+'</div>'+(itm.saat?'<div class="rdvlist-time">⏰ '+itm.saat+'</div>':'<div class="rdvlist-notime">—</div>')+'</div>';
      }
      panels+='<div class="rdvlist-panel'+(pi===0?" active":"")+'" id="'+uid+'_'+pi+'">'+itemHtml+'</div>';
    }
    return'<div class="card rdvlist-section" style="border-left:3px solid '+accentColor+'">'
      +'<div class="sec-title">'+emoji+" "+label+' <span class="rdv-badge" style="background:'+accentColor+';color:#000">'+rows.length+'</span> <span class="rdv-date-lbl">'+display+'</span></div>'
      +'<div class="rdvlist-sube-tabs">'+tabs+'</div><div id="'+uid+'">'+panels+'</div></div>';
  };

  var renderBlock=function(label,emoji,accentColor,offset){
    var targetDate=getDateStr(offset);
    var display=targetDate.split("-").reverse().join(".");
    var maps=buildMaps(targetDate);
    var total=maps.rows.length;
    var inner=total===0?'<div class="rdv-empty">📭 '+display+' tarihine ait randevu kaydı yok.</div>'
      :'<div class="rdv-grid">'+renderRdvTable("🏢 Şube",maps.subeMap,false)+renderRdvTable("👤 Personel",maps.persMap,true)+"</div>";
    return'<div class="card rdv-section" style="border-left:3px solid '+accentColor+'">'
      +'<div class="sec-title">'+emoji+" "+label+' <span class="rdv-badge" style="background:'+accentColor+';color:#000">'+total+'</span> <span class="rdv-date-lbl">'+display+'</span></div>'+inner+"</div>";
  };

  container.innerHTML=
    renderBlock("Bugünkü Randevular","📋","#4ADE80",0)+
    renderBlock("Yarınki Randevular","📅","#FFE000",1)+
    renderList("Bugün Detay Listesi","📋","#4ADE80",0)+
    renderList("Yarın Detay Listesi","📅","#FFE000",1);
}


// ─────────────────────────────────────────────────────────────────────
function build(){
  const sd=document.getElementById("sd").value;
  const ed=document.getElementById("ed").value;

  if(!CRM&&!CIRO){
    document.getElementById("report").innerHTML='<div class="loading">Excel dosyalarını yükleyin.</div>';
    document.getElementById("rdvReport").innerHTML="";
    document.getElementById("dbg").style.display="none";
    return;
  }

  buildRandevu();

  const crmKeys=CRM&&CRM.length?Object.keys(CRM[0]):[];
  const ciroKeys=CIRO&&CIRO.length?Object.keys(CIRO[0]):[];

  const CK=findCol(crmKeys,["kaydeden"])||"Kaydeden";
  const CS=findCol(crmKeys,["sube"])||"Şube";
  const CSONUC=findCol(crmKeys,["sonuc","sonuç"])||"Sonuç";
  const CNOT=findCol(crmKeys,["notlar","not"])||"Notlar";
  const CREF=findCol(crmKeys,["referans"])||"Referans";
  const CT=findCol(crmKeys,["sonteklif","teklifficiyati"])||"Son Teklif Fiyatı";
  const CDATE=findCol(crmKeys,["kayittarihi"])||"Kayıt Tarihi";
  const CRDV_B=findCol(crmKeys,["randevutarihi","randevutar","rdvtarihi","rdvtar","randevu tarihi","randevu"]);
  const tomorrowStr=getDateStr(1);

  const CP=findCol(ciroKeys,["sonegitimekleyen","egitimekleyen"])||"Son Eğitim Ekleyen";
  const CSB=findCol(ciroKeys,["sube"])||"Şube";
  const CCREF=findCol(ciroKeys,["referans"])||"Referans";
  const CCIRO=findCol(ciroKeys,["egitimciro"])||"Eğitim Ciro";
  const CTAH=findCol(ciroKeys,["tahsilat"])||"Tahsilat";
  const CKUR=findCol(ciroKeys,["kur"])||"Kur";
  const CDATE2=findCol(ciroKeys,["kayittarihi"])||"Kayıt Tarihi";

  const inRange=(v,isCRM)=>{
    const d=isCRM?parseDateCRM(v):parseDateCiro(v);
    if(!d)return true;
    if(sd&&d<sd)return false;
    if(ed&&d>ed)return false;
    return true;
  };

  const kFilt=(CRM||[]).filter(r=>inRange(r[CDATE],true));
  const cFilt=(CIRO||[]).filter(r=>inRange(r[CDATE2],false));

  const sdF=sd?sd.split("-").reverse().join("."):"tümü";
  const edF=ed?ed.split("-").reverse().join("."):"tümü";

  const dbg=document.getElementById("dbg");
  dbg.style.display="block";
  dbg.textContent=`🔍 CRM: ${kFilt.length} satır | Ciro: ${cFilt.length} satır | Tarih: ${sdF} → ${edF}`;

  if(!kFilt.length&&!cFilt.length){
    document.getElementById("report").innerHTML='<div class="loading">Seçili tarih aralığında veri yok.</div>';
    return;
  }

  const emptyD=()=>({
    crm:0,
    ts:0,
    tc:0,
    ks:0,
    kc:0,
    kur:0,
    tahsilat:0,
    olumlu:0,
    olumsuz:0,
    sonra:0,
    alakasiz:0,
    pot_y:0,
    pot_o:0,
    pot_d:0,
    rdv:0,
    refs:{}
  });

  const addCRM=(map,key,ref,t,sonuc,note)=>{
    if(!key)return;
    if(!map[key])map[key]=emptyD();

    map[key].crm++;

    if(t>0){
      map[key].ts++;
      map[key].tc+=t;
    }

    const c=_cat(sonuc);
    const p=_pot(note);

    if(c.olumlu)map[key].olumlu++;
    if(c.olumsuz)map[key].olumsuz++;
    if(c.sonra)map[key].sonra++;
    if(c.alakasiz)map[key].alakasiz++;

    if(p==="y")map[key].pot_y++;
    else if(p==="o")map[key].pot_o++;
    else map[key].pot_d++;

    if(!map[key].refs[ref])map[key].refs[ref]=emptyD();

    map[key].refs[ref].crm++;

    if(t>0){
      map[key].refs[ref].ts++;
      map[key].refs[ref].tc+=t;
    }

    const rc=map[key].refs[ref];

    if(c.olumlu)rc.olumlu++;
    if(c.olumsuz)rc.olumsuz++;
    if(c.sonra)rc.sonra++;
    if(c.alakasiz)rc.alakasiz++;

    if(p==="y")rc.pot_y++;
    else if(p==="o")rc.pot_o++;
    else rc.pot_d++;
  };

  const addCiro=(map,key,ref,c,tah,kur)=>{
    if(!key)return;
    if(!map[key])map[key]=emptyD();

    map[key].ts++;
    map[key].tc+=c;
    map[key].ks++;
    map[key].kc+=c;
    map[key].tahsilat+=tah;
    map[key].kur+=kur;

    if(!map[key].refs[ref])map[key].refs[ref]=emptyD();

    map[key].refs[ref].ts++;
    map[key].refs[ref].tc+=c;
    map[key].refs[ref].ks++;
    map[key].refs[ref].kc+=c;
    map[key].refs[ref].tahsilat+=tah;
    map[key].refs[ref].kur+=kur;
  };

  const pMap={};
  const sMap={};

  for(const r of kFilt){
    const pKey=norm(r[CK]);
    const sKey=norm(r[CS]);
    const refKey=norm(r[CREF]).toUpperCase();
    addCRM(pMap,pKey,refKey,parseTeklif(r[CT]),r[CSONUC],r[CNOT]);
    addCRM(sMap,sKey,refKey,parseTeklif(r[CT]),r[CSONUC],r[CNOT]);
    if(CRDV_B&&parseDateCRM(r[CRDV_B])===tomorrowStr){
      if(pMap[pKey])pMap[pKey].rdv++;
      if(sMap[sKey])sMap[sKey].rdv++;
    }
  }

  for(const r of cFilt){
    const c=parseCiroVal(r[CCIRO]);
    const tah=parseCiroVal(r[CTAH]);
    const kur=parseFloat(r[CKUR])||0;

    addCiro(
      pMap,
      norm(r[CP]),
      norm(r[CCREF]).toUpperCase(),
      c,
      tah,
      kur
    );

    addCiro(
      sMap,
      normSube(r[CSB]),
      norm(r[CCREF]).toUpperCase(),
      c,
      tah,
      kur
    );
  }

  _tableIdx=0;

  document.getElementById("report").innerHTML=
    renderTable("👤 Personel Bazlı Özet",pMap)+
    renderTable("🏢 Şube Bazlı Özet",sMap);

  document.querySelectorAll(".main-row").forEach(tr=>{
    tr.querySelector("td:first-child").addEventListener("click",()=>{
      const id=tr.dataset.id;

      document.querySelectorAll(`.ref-row[data-pid="${id}"]`).forEach(r=>{
        r.classList.toggle("open");
      });

      const arrow=tr.querySelector(".arrow");
      const firstRef=document.querySelector(`.ref-row[data-pid="${id}"]`);

      if(arrow){
        arrow.textContent=firstRef&&firstRef.classList.contains("open")?"▲":"▼";
      }
    });
  });
}

function renderTable(title,map){
  _tableIdx++;
  const tid=_tableIdx;

  const arr=Object.entries(map)
    .filter(([k])=>k&&k!=="nan")
    .map(([name,d])=>({name,d}))
    .sort((a,b)=>b.d.kc-a.d.kc);

  if(!arr.length)return"";

  const C={
    teklif:"#a78bfa",
    kayit:"#4ADE80",
    rdv:"#F5C800",
    kyt:"#4ADE80",
    kc:"#a78bfa",
    tc:"#e67e22",
    ciro:"#e74c3c",
    tah:"#4ADE80",
    kur:"#F5C800"
  };

  // Kolon başlıkları (her kart için tekrar edilecek)
  const theadHtml=`<thead class="ph"><tr>
    <th style="text-align:left;color:#C9A000">İsim</th>
    <th>T.Data</th>
    <th style="color:${C.teklif}">Teklif</th>
    <th style="color:${C.kayit}">Kayıt</th>
    <th style="color:${C.kur}">Kur</th>
    <th style="color:#FFE000" title="Yarınki randevu">Rdv↑</th>
    <th style="color:${C.rdv}">Rdv%</th>
    <th style="color:${C.kyt}">Kyt%</th>
    <th style="color:${C.kc}">Kayıt Ciro</th>
    <th style="color:${C.tc}">Top.Teklif Ciro</th>
    <th style="color:${C.ciro}">Ciro%</th>
    <th style="color:${C.tah}">Tahsilat</th>
    <th style="color:#4ADE80">Olumlu</th>
    <th style="color:#e74c3c">Olumsuz</th>
    <th style="color:#F5C800">S.Ara</th>
    <th style="color:#8A8474">Alksz</th>
    <th style="color:#4ADE80">🟢</th>
    <th style="color:#F5C800">🟡</th>
    <th style="color:#e74c3c">🔴</th>
  </tr></thead>`;

  let tot={td:0,ts:0,ks:0,kc:0,tc:0,tah:0,kur:0,rdv:0,
    olumlu:0,olumsuz:0,sonra:0,alakasiz:0,pot_y:0,pot_o:0,pot_d:0};

  let cards="";

  for(let i=0;i<arr.length;i++){
    const {name,d}=arr[i];
    const td=d.crm+d.ks;
    const tsTot=d.ts+d.ks;
    const rdvVal=d.rdv||0;

    // Ana satır
    const mainRow=`<tr class="pm">
      <td style="color:#FFE000">${esc(name)}</td>
      <td style="color:#F0ECD8">${td}</td>
      <td style="color:${C.teklif}">${tsTot}</td>
      <td style="color:${C.kayit}">${d.ks}</td>
      <td style="color:${C.kur}">${d.kur}</td>
      <td style="color:#FFE000;font-weight:${rdvVal>0?"800":"400"}">${rdvVal||"—"}</td>
      <td style="color:${C.rdv}">${pct(tsTot,td)}</td>
      <td style="color:${C.kyt}">${pct(d.ks,tsTot)}</td>
      <td style="color:${C.kc}">${tl(d.kc)}</td>
      <td style="color:${C.tc}">${tl(d.tc+d.kc)}</td>
      <td style="color:${C.ciro}">${pct(d.kc,d.tc+d.kc)}</td>
      <td style="color:${C.tah}">${tl(d.tahsilat)}</td>
      <td style="color:#4ADE80">${d.olumlu}</td>
      <td style="color:#e74c3c">${d.olumsuz}</td>
      <td style="color:#F5C800">${d.sonra}</td>
      <td style="color:#8A8474">${d.alakasiz}</td>
      <td style="color:#4ADE80">${d.pot_y}</td>
      <td style="color:#F5C800">${d.pot_o}</td>
      <td style="color:#e74c3c">${d.pot_d}</td>
    </tr>`;

    // Ref satırları
    const refs=Object.entries(d.refs)
      .filter(([,r])=>r.crm+r.ks>0)
      .sort((a,b)=>b[1].kc-a[1].kc);

    let refRows="";
    for(const [ref,rd] of refs){
      const rtd=rd.crm+rd.ks;
      const rtsTot=rd.ts+rd.ks;
      refRows+=`<tr class="pr">
        <td>↳ ${esc(ref)}</td>
        <td>${rtd}</td>
        <td style="color:${C.teklif}">${rtsTot||"—"}</td>
        <td style="color:${C.kayit}">${rd.ks||"—"}</td>
        <td style="color:${C.kur}">${rd.kur||"—"}</td>
        <td>—</td>
        <td style="color:${C.rdv}">${pct(rtsTot,rtd)}</td>
        <td style="color:${C.kyt}">${pct(rd.ks,rtsTot)}</td>
        <td style="color:${C.kc}">${tl(rd.kc)}</td>
        <td style="color:${C.tc}">${tl(rd.tc+rd.kc)}</td>
        <td style="color:${C.ciro}">${pct(rd.kc,rd.tc+rd.kc)}</td>
        <td style="color:${C.tah}">${tl(rd.tahsilat)}</td>
        <td colspan="7"></td>
      </tr>`;
    }

    cards+=`<div class="pers-card">
      <table>${theadHtml}<tbody>${mainRow}${refRows}</tbody></table>
    </div>`;

    tot.td+=td; tot.ts+=d.ts; tot.ks+=d.ks; tot.kc+=d.kc; tot.tc+=d.tc;
    tot.tah+=d.tahsilat; tot.kur+=d.kur; tot.rdv+=rdvVal;
    tot.olumlu+=d.olumlu; tot.olumsuz+=d.olumsuz; tot.sonra+=d.sonra;
    tot.alakasiz+=d.alakasiz; tot.pot_y+=d.pot_y; tot.pot_o+=d.pot_o; tot.pot_d+=d.pot_d;
  }

  const totTs=tot.ts+tot.ks;
  const totTc=tot.tc+tot.kc;
  const totRow=`<div class="pers-card" style="border-color:rgba(255,224,0,.3)">
    <table><tbody><tr class="pm" style="background:rgba(255,224,0,.06)">
      <td style="color:#F5C800">TOPLAM</td>
      <td style="color:#F0ECD8">${tot.td}</td>
      <td style="color:${C.teklif}">${totTs}</td>
      <td style="color:${C.kayit}">${tot.ks}</td>
      <td style="color:${C.kur}">${tot.kur}</td>
      <td style="color:#FFE000">${tot.rdv||"—"}</td>
      <td style="color:${C.rdv}">${pct(totTs,tot.td)}</td>
      <td style="color:${C.kyt}">${pct(tot.ks,totTs)}</td>
      <td style="color:${C.kc}">${tl(tot.kc)}</td>
      <td style="color:${C.tc}">${tl(totTc)}</td>
      <td style="color:${C.ciro}">${pct(tot.kc,totTc)}</td>
      <td style="color:${C.tah}">${tl(tot.tah)}</td>
      <td style="color:#4ADE80">${tot.olumlu}</td>
      <td style="color:#e74c3c">${tot.olumsuz}</td>
      <td style="color:#F5C800">${tot.sonra}</td>
      <td style="color:#8A8474">${tot.alakasiz}</td>
      <td style="color:#4ADE80">${tot.pot_y}</td>
      <td style="color:#F5C800">${tot.pot_o}</td>
      <td style="color:#e74c3c">${tot.pot_d}</td>
    </tr></tbody></table>
  </div>`;

  return`<div class="sec-title">${title}</div>
  <div class="pers-cards-wrap">${cards}${totRow}</div>`;
}

function clearD(){
  document.getElementById("sd").value="";
  document.getElementById("ed").value="";
  build();
}

const t=new Date();

document.getElementById("sd").value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-01`;
document.getElementById("ed").value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;

loadFromFB();
</script>
