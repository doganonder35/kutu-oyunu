const db=firebase.firestore();
let CRM=null,CIRO=null;

const _pot=note=>{
  const n=(note||"").toString().toUpperCase();
  const y=["RANDEVU","GELECEĞİM","GELECEM","KESİNLİKLE","MUTLAKA","ALACAĞIM","KAYDOLMAK","FİYAT","FIYAT","ÜCRET","TEKLİF","İLGİLENİYOR","BİLGİ VER","DÜŞÜNÜYORUM","MERAK","HAFTA","YARIN","BUGÜN","TAM OLUR","PLANLAMA"];
  const d=["AÇMADI","ULAŞILAMIYOR","MEŞGUL","İLGİLENMİYOR","İSTEMİYOR","ALAKASIZ","REDDETTİ","KAPAT","RAHATSIZ","TEKRAR ARAMAYACAK","YANLIŞLIKLA"];
  if(n.length<3)return"d";
  if(y.some(k=>n.includes(k))&&!d.some(k=>n.includes(k)))return"y";
  if(d.some(k=>n.includes(k)))return"d";
  return"o";
};

const _cat=s=>{
  s=(s||"").toString().toUpperCase().trim();
  return{
    olumlu:s==="OLUMLU",
    olumsuz:s==="OLUMSUZ"||s==="TEKRAR",
    sonra:s==="SONRA ARANACAK",
    alakasiz:s.includes("ALAKASIZ")||s.includes("İLGİSİZ")||s.includes("ILGISIZ")
  };
};

const norm=s=>(s||"").toString().replace(/\s+/g," ").trim();
const normSube=s=>{s=(s||"").toString().trim();return s.includes("=>")?s.split("=>").pop().trim():s;};

const parseTeklif=v=>{
  if(!v||String(v).trim()===""||String(v).trim()==="-")return 0;
  try{return parseInt(String(v).split(",")[0].replace(/\./g,"").trim())||0;}
  catch{return 0;}
};

const parseCiroVal=v=>{
  if(!v)return 0;
  if(typeof v==="number")return v;
  return parseFloat(String(v).replace(/[^\d.]/g,""))||0;
};

const parseDateCRM=v=>{
  if(!v)return null;
  const s=String(v).trim();
  if(/^\d{2}\.\d{2}\.\d{4}/.test(s)){
    const p=s.split(" ")[0].split(".");
    return `${p[2]}-${p[1]}-${p[0]}`;
  }
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.substring(0,10);
  if(!isNaN(v)&&Number(v)>10000){
    const d=new Date(Math.round((Number(v)-25569)*86400*1000));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
  }
  return null;
};

const parseDateCiro=v=>{
  if(!v)return null;
  if(v instanceof Date||String(v).includes("T")){
    const d=new Date(v);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  if(typeof v==="number"&&v>10000){
    const d=new Date(Math.round((v-25569)*86400*1000));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
  }
  return parseDateCRM(v);
};

const pct=(a,b)=>b>0?`${Math.round(a/b*100)}%`:"—";
const tl=n=>n>0?`${Math.round(n).toLocaleString("tr-TR")}₺`:"—";
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const findCol=(keys,pats)=>{
  for(const k of keys){
    const n=k.replace(/[\s\u00a0]/g,"").toLowerCase()
      .replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
      .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");
    if(pats.some(p=>n===p||n.includes(p)))return k;
  }
  return null;
};

const readXLSX=(file,cb)=>{
  const r=new FileReader();
  r.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    cb(XLSX.utils.sheet_to_json(ws,{defval:"",raw:false}));
  };
  r.readAsArrayBuffer(file);
};

function loadCRM(inp){
  const f=inp.files[0];
  if(!f)return;
  document.getElementById("crmFN").textContent="Yükleniyor...";
  readXLSX(f,rows=>{
    CRM=rows;
    document.getElementById("crmFN").textContent=`${f.name} ✅ (${rows.length} satır)`;
    saveToFB("crm",rows,f.name);
    build();
  });
}

function loadCiro(inp){
  const f=inp.files[0];
  if(!f)return;
  document.getElementById("ciroFN").textContent="Yükleniyor...";
  readXLSX(f,rows=>{
    CIRO=rows;
    document.getElementById("ciroFN").textContent=`${f.name} ✅ (${rows.length} satır)`;
    saveToFB("ciro",rows,f.name);
    build();
  });
}

const CHUNK=150;

function saveToFB(type,rows,fname){
  const chunks=[];
  for(let i=0;i<rows.length;i+=CHUNK)chunks.push(rows.slice(i,i+CHUNK));
  const ts=Date.now();

  db.doc(`ozet/${type}meta`).set({ts,chunks:chunks.length,fname:fname||""}).catch(console.warn);

  const write=i=>{
    if(i>=chunks.length)return;
    db.doc(`ozet/${type}_${i}`).set({rows:chunks[i],ts})
      .then(()=>write(i+1))
      .catch(console.warn);
  };

  write(0);
}

function timeoutPromise(ms){
  return new Promise((_,reject)=>setTimeout(()=>reject(new Error("Firebase timeout")),ms));
}

async function loadFromFB(){
  document.getElementById("crmFN").textContent="Dosya seçilmedi";
  document.getElementById("ciroFN").textContent="Dosya seçilmedi";

  for(const type of ["crm","ciro"]){
    try{
      const meta=await Promise.race([
        db.doc(`ozet/${type}meta`).get(),
        timeoutPromise(4000)
      ]);

      if(!meta.exists)continue;

      const data=meta.data()||{};
      const chunks=Number(data.chunks)||0;
      const fname=data.fname||"";

      if(!chunks)continue;

      let all=[];

      for(let i=0;i<chunks;i++){
        const d=await Promise.race([
          db.doc(`ozet/${type}_${i}`).get(),
          timeoutPromise(4000)
        ]);

        if(d.exists)all=all.concat(d.data().rows||[]);
      }

      if(!all.length)continue;

      if(type==="crm"){
        CRM=all;
        document.getElementById("crmFN").textContent=(fname||"CRM")+` ✅ (${all.length} satır)`;
      }else{
        CIRO=all;
        document.getElementById("ciroFN").textContent=(fname||"Ciro")+` ✅ (${all.length} satır)`;
      }

    }catch(e){
      console.warn(type,e);
      if(type==="crm")document.getElementById("crmFN").textContent="Dosya seçilmedi";
      if(type==="ciro")document.getElementById("ciroFN").textContent="Dosya seçilmedi";
    }
  }

  build();
}
