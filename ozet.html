<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"/>
<title>📈 Özet Rapor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0A;color:#F0ECD8;font-family:'Raleway',sans-serif;min-height:100vh;padding:16px}
@import url('https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap');
h1{font-size:1.6rem;font-weight:800;color:#FFE000;margin-bottom:16px;letter-spacing:.05em}
.card{background:#161616;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label{font-size:.62rem;color:#C9A000;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
input[type=date]{padding:5px 8px;background:#0F0F0F;border:1px solid rgba(255,255,255,.1);color:#F0ECD8;font-family:Raleway,sans-serif;font-size:.78rem;border-radius:5px;outline:none}
button{padding:5px 12px;border:none;border-radius:5px;font-family:Raleway,sans-serif;font-weight:800;font-size:.72rem;cursor:pointer}
.btn-yellow{background:#FFE000;color:#000}
.btn-gray{background:none;border:1px solid rgba(255,255,255,.12);color:#8A8474}
.btn-toggle{padding:6px 14px;font-size:.74rem}
.btn-toggle.active{background:#FFE000;color:#000;border-color:#FFE000}
.btn-toggle:not(.active){background:#0F0F0F;color:#8A8474;border:1px solid rgba(255,255,255,.1)}
.debug{font-size:.66rem;color:#8A8474;padding:5px 10px;background:#111;border-radius:5px;margin-bottom:10px}
.section-title{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:#C9A000;font-weight:700;margin-bottom:8px}
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid rgba(255,255,255,.08);margin-bottom:20px}
table{width:100%;border-collapse:collapse;min-width:700px}
thead th{padding:5px 8px;font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;text-align:right;border-bottom:2px solid rgba(255,224,0,.3);white-space:nowrap}
thead th:first-child{text-align:left;color:#C9A000}
tbody td{padding:4px 8px;font-size:.72rem;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
tbody td:first-child{text-align:left;font-weight:700;color:#FFE000}
tbody tr.ref-row td{font-size:.64rem;font-weight:400;color:#8A8474}
tbody tr.ref-row td:first-child{color:#8A8474}
tfoot td{padding:5px 8px;font-size:.7rem;font-weight:800;text-align:right;border-top:2px solid rgba(255,224,0,.3);background:rgba(255,224,0,.04)}
tfoot td:first-child{text-align:left;color:#F5C800}
.loading{padding:20px;color:#8A8474;font-size:.82rem}
.file-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.file-label{padding:6px 14px;background:#FFE000;border-radius:5px;color:#000;font-weight:800;font-size:.74rem;cursor:pointer;white-space:nowrap}
.file-name{font-size:.72rem;color:#8A8474}
</style>
</head>
<body>
<h1>📈 Özet Rapor</h1>

<!-- Dosya yükleme -->
<div class="card">
  <div class="file-row">
    <span style="font-size:.62rem;color:#C9A000;font-weight:700;letter-spacing:.1em;text-transform:uppercase">📂 CRM Excel</span>
    <input type="file" id="crmFile" accept=".xlsx,.xls" style="display:none" onchange="loadCRMFile(this)"/>
    <label for="crmFile" class="file-label">Dosya Seç</label>
    <span id="crmFileName" class="file-name">Yüklenmedi</span>
  </div>
  <div class="file-row">
    <span style="font-size:.62rem;color:#C9A000;font-weight:700;letter-spacing:.1em;text-transform:uppercase">📂 Ciro Excel</span>
    <input type="file" id="ciroFile" accept=".xlsx,.xls" style="display:none" onchange="loadCiroFile(this)"/>
    <label for="ciroFile" class="file-label">Dosya Seç</label>
    <span id="ciroFileName" class="file-name">Yüklenmedi</span>
  </div>
</div>

<!-- Tarih & Toggle -->
<div class="card">
  <div class="row" style="margin-bottom:8px">
    <label>📅 Tarih Aralığı</label>
    <input type="date" id="sd" onchange="buildReport()"/>
    <span style="color:#8A8474">—</span>
    <input type="date" id="ed" onchange="buildReport()"/>
    <button class="btn-yellow" onclick="buildReport()">Filtrele</button>
    <button class="btn-gray" onclick="clearDates()">Tümü</button>
  </div>
  <div class="row">
    <button class="btn-toggle active" id="btnKuHaric" onclick="setKU(false)">KU Hariç</button>
    <button class="btn-toggle" id="btnKuDahil" onclick="setKU(true)">KU Dahil</button>
  </div>
</div>

<div id="debugLine" class="debug" style="display:none"></div>
<div id="report"></div>

<script>
// Firebase
const fbCfg={apiKey:"AIzaSyAk2oK4iQPQFIF5Z-aUCNTBfjP9NyP-GBQ",authDomain:"kutu-oyunu-8769b.firebaseapp.com",projectId:"kutu-oyunu-8769b"};
firebase.initializeApp(fbCfg);
const db=firebase.firestore();

let crmRows=null, ciroRows=null, showKU=false;

// ── Utils ──
function norm(s){return(s||"").toString().replace(/\s+/g," ").trim();}
function normSube(s){s=(s||"").toString().trim();return s.includes("=>")?s.split("=>").pop().trim():s;}
function parseTeklif(v){
  if(!v||String(v).trim()===""||String(v).trim()==="-")return 0;
  try{return parseInt(String(v).split(",")[0].replace(/\./g,"").trim())||0;}catch(e){return 0;}
}
function parseCiroVal(v){if(!v)return 0;if(typeof v==="number")return v;return parseFloat(String(v).replace(/[^\d.]/g,""))||0;}
function parseCRMDate(v){
  if(!v)return null;
  const s=String(v).trim();
  if(/^\d{2}\.\d{2}\.\d{4}/.test(s)){const p=s.split(" ")[0].split(".");return`${p[2]}-${p[1]}-${p[0]}`;}
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.substring(0,10);
  if(!isNaN(v)&&Number(v)>10000){const d=new Date(Math.round((Number(v)-25569)*86400*1000));return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;}
  return null;
}
function parseCiroDate(v){
  if(!v)return null;
  if(typeof v==="number"&&v>10000){const d=new Date(Math.round((v-25569)*86400*1000));return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;}
  return parseCRMDate(v);
}
function isKU(ref){return(ref||"").toString().toUpperCase().includes("KUR UZATMA");}
function pct(a,b){return b>0?`${Math.round(a/b*100)}%`:"—";}
function tl(n){return n>0?`${parseInt(n).toLocaleString("tr-TR")}₺`:"—";}

// ── Sütun adı tespiti ──
function findCol(keys,patterns){
  for(const k of keys){
    const n=k.replace(/[\s\u00a0]/g,"").toLowerCase()
      .replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
      .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");
    if(patterns.some(p=>n===p||n.includes(p)))return k;
  }
  return null;
}

// ── Excel yükleme ──
function readXLSX(file,cb){
  const r=new FileReader();
  r.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:"array",cellDates:false});
    const ws=wb.Sheets[wb.SheetNames[0]];
    cb(XLSX.utils.sheet_to_json(ws,{defval:""}));
  };
  r.readAsArrayBuffer(file);
}

function loadCRMFile(inp){
  const f=inp.files[0];if(!f)return;
  document.getElementById("crmFileName").textContent="Yükleniyor...";
  readXLSX(f,rows=>{
    crmRows=rows;
    document.getElementById("crmFileName").textContent=f.name+` ✅ (${rows.length} satır)`;
    // Firebase'e kaydet
    saveCRMToFirebase(rows,f.name);
    buildReport();
  });
}

function loadCiroFile(inp){
  const f=inp.files[0];if(!f)return;
  document.getElementById("ciroFileName").textContent="Yükleniyor...";
  readXLSX(f,rows=>{
    ciroRows=rows;
    document.getElementById("ciroFileName").textContent=f.name+` ✅ (${rows.length} satır)`;
    saveCiroToFirebase(rows,f.name);
    buildReport();
  });
}

// ── Firebase kaydet/yükle ──
const CHUNK=200;
function saveCRMToFirebase(rows,fname){
  const chunks=[];
  for(let i=0;i<rows.length;i+=CHUNK)chunks.push(rows.slice(i,i+CHUNK));
  const ts=Date.now();
  db.doc("ozet/crmmeta").set({ts,chunks:chunks.length,fname:fname||""});
  function write(i){
    if(i>=chunks.length)return;
    db.doc(`ozet/crm_${i}`).set({rows:chunks[i],ts}).then(()=>write(i+1));
  }
  write(0);
}
function saveCiroToFirebase(rows,fname){
  const chunks=[];
  for(let i=0;i<rows.length;i+=CHUNK)chunks.push(rows.slice(i,i+CHUNK));
  const ts=Date.now();
  db.doc("ozet/cirometa").set({ts,chunks:chunks.length,fname:fname||""});
  function write(i){
    if(i>=chunks.length)return;
    db.doc(`ozet/ciro_${i}`).set({rows:chunks[i],ts}).then(()=>write(i+1));
  }
  write(0);
}

async function loadFromFirebase(){
  try{
    // CRM
    const crmMeta=await db.doc("ozet/crmmeta").get();
    if(crmMeta.exists){
      const {chunks,fname}=crmMeta.data();
      let all=[];
      for(let i=0;i<chunks;i++){
        const d=await db.doc(`ozet/crm_${i}`).get();
        if(d.exists)all=all.concat(d.data().rows||[]);
      }
      if(all.length){crmRows=all;document.getElementById("crmFileName").textContent=(fname||"")+" ✅ ("+all.length+" satır)";}
    }
    // Ciro
    const ciroMeta=await db.doc("ozet/cirometa").get();
    if(ciroMeta.exists){
      const {chunks,fname}=ciroMeta.data();
      let all=[];
      for(let i=0;i<chunks;i++){
        const d=await db.doc(`ozet/ciro_${i}`).get();
        if(d.exists)all=all.concat(d.data().rows||[]);
      }
      if(all.length){ciroRows=all;document.getElementById("ciroFileName").textContent=(fname||"")+" ✅ ("+all.length+" satır)";}
    }
    buildReport();
  }catch(e){console.warn("Firebase load error:",e);}
}

// ── Hesaplama ──
function buildReport(){
  const sd=document.getElementById("sd").value;
  const ed=document.getElementById("ed").value;

  if(!crmRows&&!ciroRows){
    document.getElementById("report").innerHTML='<div class="loading">CRM ve Ciro Excel dosyalarını yükleyin.</div>';
    document.getElementById("debugLine").style.display="none";
    return;
  }

  // Sütun adları
  const crmKeys=crmRows&&crmRows.length?Object.keys(crmRows[0]):[];
  const ciroKeys=ciroRows&&ciroRows.length?Object.keys(ciroRows[0]):[];

  const CK=findCol(crmKeys,["kaydeden"])||"Kaydeden";
  const CS=findCol(crmKeys,["sube"])||"Şube";
  const CREF=findCol(crmKeys,["referans"])||"Referans";
  const CT=findCol(crmKeys,["sonteklif","teklifficiyati"])||"Son Teklif Fiyatı";
  const CDATE=findCol(crmKeys,["kayittarihi","kayittarih"])||"Kayıt Tarihi";

  const CP=findCol(ciroKeys,["sonegitimekleyen","egitimekleyen"])||"Son Eğitim Ekleyen";
  const CSB=findCol(ciroKeys,["sube"])||"Şube";
  const CCREF=findCol(ciroKeys,["referans"])||"Referans";
  const CCIRO=findCol(ciroKeys,["egitimciro"])||"Eğitim Ciro";
  const CDATE2=findCol(ciroKeys,["kayittarihi","kayittarih"])||"Kayıt Tarihi";

  // Tarih filtresi
  function inRange(dateStr,isCRM){
    const d=isCRM?parseCRMDate(dateStr):parseCiroDate(dateStr);
    if(!d)return true; // tarih yoksa dahil et
    if(sd&&d<sd)return false;
    if(ed&&d>ed)return false;
    return true;
  }

  const kFilt=(crmRows||[]).filter(r=>inRange(r[CDATE],true));
  const cAll=(ciroRows||[]).filter(r=>inRange(r[CDATE2],false));
  const cFilt=showKU?cAll:cAll.filter(r=>!isKU(r[CCREF]));

  const sdFmt=sd?sd.split("-").reverse().join("."):"tümü";
  const edFmt=ed?ed.split("-").reverse().join("."):"tümü";
  const dbg=document.getElementById("debugLine");
  dbg.style.display="block";
  dbg.textContent=`🔍 CRM: ${kFilt.length} satır | Ciro: ${cFilt.length} satır | Tarih: ${sdFmt} → ${edFmt}`;

  if(!kFilt.length&&!cFilt.length){
    document.getElementById("report").innerHTML='<div class="loading">Seçili tarih aralığında veri yok.</div>';
    return;
  }

  // Map oluştur
  function emptyD(){return{crm:0,ts:0,tc:0,ks:0,kc:0,refs:{}};}
  function addCRM(map,key,ref,teklif){
    if(!key)return;
    if(!map[key])map[key]=emptyD();
    map[key].crm++;
    if(teklif>0){map[key].ts++;map[key].tc+=teklif;}
    if(!map[key].refs[ref])map[key].refs[ref]=emptyD();
    map[key].refs[ref].crm++;
    if(teklif>0){map[key].refs[ref].ts++;map[key].refs[ref].tc+=teklif;}
  }
  function addCiro(map,key,ref,ciro){
    if(!key)return;
    if(!map[key])map[key]=emptyD();
    map[key].ts++;map[key].tc+=ciro;map[key].ks++;map[key].kc+=ciro;
    if(!map[key].refs[ref])map[key].refs[ref]=emptyD();
    map[key].refs[ref].ts++;map[key].refs[ref].tc+=ciro;
    map[key].refs[ref].ks++;map[key].refs[ref].kc+=ciro;
  }

  const pMap={},sMap={};
  for(const r of kFilt){
    const isim=norm(r[CK]);
    const sube=norm(r[CS]);
    const ref=norm(r[CREF]).toUpperCase();
    const teklif=parseTeklif(r[CT]);
    addCRM(pMap,isim,ref,teklif);
    addCRM(sMap,sube,ref,teklif);
  }
  for(const r of cFilt){
    const isim=norm(r[CP]);
    const sube=normSube(r[CSB]);
    const ref=norm(r[CCREF]).toUpperCase();
    const ciro=parseCiroVal(r[CCIRO]);
    addCiro(pMap,isim,ref,ciro);
    addCiro(sMap,sube,ref,ciro);
  }

  const kuSuf=showKU?" (KU Dahil)":" (KU Hariç)";
  document.getElementById("report").innerHTML=
    renderTable("👤 Personel Bazlı Özet"+kuSuf,pMap)+
    renderTable("🏢 Şube Bazlı Özet"+kuSuf,sMap);
}

function renderTable(title,map){
  const arr=Object.entries(map)
    .filter(([k])=>k)
    .map(([name,d])=>({name,d}))
    .sort((a,b)=>(b.d.crm+b.d.ks)-(a.d.crm+a.d.ks));
  if(!arr.length)return"";

  const C={td:"#C9A000",teklif:"#a78bfa",kayit:"#4ADE80",rdv:"#F5C800",kyt:"#4ADE80",kc:"#a78bfa",tc:"#e67e22",ciro:"#e74c3c"};

  let thead=`<thead><tr>
    <th style="color:#C9A000">İsim</th>
    <th style="color:${C.td}">T.Data</th>
    <th style="color:${C.teklif}">Teklif</th>
    <th style="color:${C.kayit}">Kayıt</th>
    <th style="color:${C.rdv}">Rdv%</th>
    <th style="color:${C.kyt}">Kyt%</th>
    <th style="color:${C.kc}">Kayıt Ciro</th>
    <th style="color:${C.tc}">Top.Teklif Ciro</th>
    <th style="color:${C.ciro}">Ciro%</th>
  </tr></thead>`;

  let tot={td:0,ts:0,ks:0,kc:0,tc:0};
  let tbody="<tbody>";

  for(let i=0;i<arr.length;i++){
    const {name,d}=arr[i];
    const td=d.crm+d.ks;
    const bg=i%2===0?"#161616":"#141414";
    tbody+=`<tr style="background:${bg}">
      <td>${esc(name)}</td>
      <td>${td}</td>
      <td style="color:${C.teklif}">${d.ts}</td>
      <td style="color:${C.kayit}">${d.ks}</td>
      <td style="color:${C.rdv}">${pct(d.ts,td)}</td>
      <td style="color:${C.kyt}">${pct(d.ks,d.ts)}</td>
      <td style="color:${C.kc}">${tl(d.kc)}</td>
      <td style="color:${C.tc}">${tl(d.tc)}</td>
      <td style="color:${C.ciro}">${pct(d.kc,d.tc)}</td>
    </tr>`;
    // Referans kırılımı
    const refs=Object.entries(d.refs)
      .filter(([,rd])=>rd.crm+rd.ks>0)
      .sort((a,b)=>(b[1].ts+b[1].crm)-(a[1].ts+a[1].crm));
    for(const [ref,rd] of refs){
      const rtd=rd.crm+rd.ks;
      tbody+=`<tr class="ref-row">
        <td>↳ ${esc(ref)}</td>
        <td style="color:#3A3830">${rtd}</td>
        <td style="color:${C.teklif}">${rd.ts||"—"}</td>
        <td style="color:${C.kayit}">${rd.ks||"—"}</td>
        <td style="color:${C.rdv}">${pct(rd.ts,rtd)}</td>
        <td style="color:${C.kyt}">${pct(rd.ks,rd.ts)}</td>
        <td style="color:${C.kc}">${tl(rd.kc)}</td>
        <td style="color:${C.tc}">${tl(rd.tc)}</td>
        <td style="color:${C.ciro}">${pct(rd.kc,rd.tc)}</td>
      </tr>`;
    }
    tot.td+=td;tot.ts+=d.ts;tot.ks+=d.ks;tot.kc+=d.kc;tot.tc+=d.tc;
  }
  tbody+="</tbody>";

  const tfoot=`<tfoot><tr>
    <td>TOPLAM</td>
    <td>${tot.td}</td>
    <td style="color:${C.teklif}">${tot.ts}</td>
    <td style="color:${C.kayit}">${tot.ks}</td>
    <td style="color:${C.rdv}">${pct(tot.ts,tot.td)}</td>
    <td style="color:${C.kyt}">${pct(tot.ks,tot.ts)}</td>
    <td style="color:${C.kc}">${tl(tot.kc)}</td>
    <td style="color:${C.tc}">${tl(tot.tc)}</td>
    <td style="color:${C.ciro}">${pct(tot.kc,tot.tc)}</td>
  </tr></tfoot>`;

  return`<div class="section-title">${title}</div>
  <div class="table-wrap">
    <table>${thead}${tbody}${tfoot}</table>
  </div>`;
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function setKU(v){
  showKU=v;
  document.getElementById("btnKuHaric").className="btn-toggle"+(v?"":" active");
  document.getElementById("btnKuDahil").className="btn-toggle"+(v?" active":"");
  buildReport();
}

function clearDates(){
  document.getElementById("sd").value="";
  document.getElementById("ed").value="";
  buildReport();
}

// Varsayılan tarih: bu ayın başından bugüne
const today=new Date();
const mm=String(today.getMonth()+1).padStart(2,"0");
const dd=String(today.getDate()).padStart(2,"0");
const yy=today.getFullYear();
document.getElementById("sd").value=`${yy}-${mm}-01`;
document.getElementById("ed").value=`${yy}-${mm}-${dd}`;

// Firebase'den yükle
loadFromFirebase();
</script>
</body>
</html>
