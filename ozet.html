<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"/>
<title>📈 Özet Rapor</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0A;color:#F0ECD8;font-family:'Raleway',sans-serif;min-height:100vh;padding:16px}
h1{font-size:1.5rem;font-weight:800;color:#FFE000;margin-bottom:14px;letter-spacing:.04em}
.card{background:#161616;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font-size:.6rem;color:#C9A000;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
input[type=date]{padding:5px 8px;background:#0F0F0F;border:1px solid rgba(255,255,255,.1);color:#F0ECD8;font-family:Raleway,sans-serif;font-size:.76rem;border-radius:5px;outline:none}
button{padding:5px 12px;border:none;border-radius:5px;font-family:Raleway,sans-serif;font-weight:800;font-size:.72rem;cursor:pointer}
.btn-y{background:#FFE000;color:#000}
.btn-g{background:none;border:1px solid rgba(255,255,255,.12);color:#8A8474}
.file-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.file-btn{padding:6px 14px;background:#FFE000;border-radius:5px;color:#000;font-weight:800;font-size:.74rem;cursor:pointer;white-space:nowrap}
.file-name{font-size:.7rem;color:#8A8474}
.debug{font-size:.64rem;color:#8A8474;padding:5px 10px;background:#111;border-radius:5px;margin-bottom:10px}
.sec-title{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:#C9A000;font-weight:700;margin-bottom:8px;margin-top:16px}
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid rgba(255,255,255,.08);margin-bottom:4px}
table{width:100%;border-collapse:collapse;min-width:720px}
thead th{padding:5px 8px;font-size:.54rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;text-align:right;border-bottom:2px solid rgba(255,224,0,.3);white-space:nowrap}
thead th:first-child{text-align:left;color:#C9A000}
tbody td{padding:3px 8px;font-size:.7rem;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
tbody td:first-child{text-align:left;font-weight:700;color:#FFE000}
tbody tr.ref td{font-size:.62rem;font-weight:400;color:#8A8474;background:#111}
tbody tr.ref td:first-child{color:#6A6464}
tfoot td{padding:4px 8px;font-size:.7rem;font-weight:800;text-align:right;border-top:2px solid rgba(255,224,0,.3);background:rgba(255,224,0,.04)}
tfoot td:first-child{text-align:left;color:#F5C800}
.loading{padding:20px;color:#8A8474;font-size:.8rem}
</style>
</head>
<body>
<h1>📈 Özet Rapor</h1>

<div class="card">
  <div class="file-row">
    <span class="lbl">📂 CRM Excel</span>
    <input type="file" id="crmFile" accept=".xlsx,.xls" style="display:none" onchange="loadCRM(this)"/>
    <label for="crmFile" class="file-btn">Dosya Seç</label>
    <span id="crmFN" class="file-name">Yükleniyor...</span>
  </div>
  <div class="file-row">
    <span class="lbl">📂 Ciro Excel</span>
    <input type="file" id="ciroFile" accept=".xlsx,.xls" style="display:none" onchange="loadCiro(this)"/>
    <label for="ciroFile" class="file-btn">Dosya Seç</label>
    <span id="ciroFN" class="file-name">Yükleniyor...</span>
  </div>
</div>

<div class="card">
  <div class="row">
    <span class="lbl">📅 Tarih Aralığı</span>
    <input type="date" id="sd" onchange="build()"/>
    <span style="color:#8A8474">—</span>
    <input type="date" id="ed" onchange="build()"/>
    <button class="btn-y" onclick="build()">Filtrele</button>
    <button class="btn-g" onclick="clearD()">Tümü</button>
  </div>
</div>

<div id="dbg" class="debug" style="display:none"></div>
<div id="report"></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyAk2oK4iQPQFIF5Z-aUCNTBfjP9NyP-GBQ",authDomain:"kutu-oyunu-8769b.firebaseapp.com",projectId:"kutu-oyunu-8769b"});
const db=firebase.firestore();
let CRM=null,CIRO=null;

// ── Yardımcı ──
const norm=s=>(s||"").toString().replace(/\s+/g," ").trim();
const normSube=s=>{s=(s||"").toString().trim();return s.includes("=>")?s.split("=>").pop().trim():s;};
const parseTeklif=v=>{
  if(!v||String(v).trim()===""||String(v).trim()==="-")return 0;
  try{return parseInt(String(v).split(",")[0].replace(/\./g,"").trim())||0;}catch{return 0;}
};
const parseCiro=v=>{if(!v)return 0;if(typeof v==="number")return v;return parseFloat(String(v).replace(/[^\d.]/g,""))||0;};
const parseDateCRM=v=>{
  if(!v)return null;
  const s=String(v).trim();
  if(/^\d{2}\.\d{2}\.\d{4}/.test(s)){const p=s.split(" ")[0].split(".");return`${p[2]}-${p[1]}-${p[0]}`;}
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.substring(0,10);
  if(!isNaN(v)&&Number(v)>10000){const d=new Date(Math.round((Number(v)-25569)*86400*1000));return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;}
  return null;
};
const parseDateCiro=v=>{
  if(!v)return null;
  if(v instanceof Date){const y=v.getFullYear(),m=v.getMonth()+1,d=v.getDate();return`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;}
  if(typeof v==="number"&&v>10000){const d=new Date(Math.round((v-25569)*86400*1000));return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;}
  return parseDateCRM(v);
};
const pct=(a,b)=>b>0?`${Math.round(a/b*100)}%`:"—";
const tl=n=>n>0?`${Math.round(n).toLocaleString("tr-TR")}₺`:"—";
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// Sütun bul
const findCol=(keys,pats)=>{
  for(const k of keys){
    const n=k.replace(/[\s\u00a0]/g,"").toLowerCase()
      .replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
      .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");
    if(pats.some(p=>n===p||n.includes(p)))return k;
  }
  return null;
};

// ── Excel yükleme ──
const readXLSX=(file,cb)=>{
  const r=new FileReader();
  r.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    cb(XLSX.utils.sheet_to_json(ws,{defval:"",raw:false}));
  };
  r.readAsArrayBuffer(file);
};

function loadCRM(inp){
  const f=inp.files[0];if(!f)return;
  document.getElementById("crmFN").textContent="Yükleniyor...";
  readXLSX(f,rows=>{
    CRM=rows;
    document.getElementById("crmFN").textContent=`${f.name} ✅ (${rows.length} satır)`;
    saveToFB("crm",rows,f.name);
    build();
  });
}

function loadCiro(inp){
  const f=inp.files[0];if(!f)return;
  document.getElementById("ciroFN").textContent="Yükleniyor...";
  readXLSX(f,rows=>{
    CIRO=rows;
    document.getElementById("ciroFN").textContent=`${f.name} ✅ (${rows.length} satır)`;
    saveToFB("ciro",rows,f.name);
    build();
  });
}

// ── Firebase ──
const CHUNK=150;
function saveToFB(type,rows,fname){
  const chunks=[];
  for(let i=0;i<rows.length;i+=CHUNK)chunks.push(rows.slice(i,i+CHUNK));
  const ts=Date.now();
  db.doc(`ozet/${type}meta`).set({ts,chunks:chunks.length,fname:fname||""});
  const write=i=>{
    if(i>=chunks.length)return;
    db.doc(`ozet/${type}_${i}`).set({rows:chunks[i],ts}).then(()=>write(i+1));
  };
  write(0);
}

async function loadFromFB(){
  for(const type of ["crm","ciro"]){
    try{
      const meta=await db.doc(`ozet/${type}meta`).get();
      if(!meta.exists)continue;
      const {chunks,fname}=meta.data();
      let all=[];
      for(let i=0;i<chunks;i++){
        const d=await db.doc(`ozet/${type}_${i}`).get();
        if(d.exists)all=all.concat(d.data().rows||[]);
      }
      if(!all.length)continue;
      if(type==="crm"){CRM=all;document.getElementById("crmFN").textContent=(fname||"CRM")+` ✅ (${all.length} satır)`;}
      else{CIRO=all;document.getElementById("ciroFN").textContent=(fname||"Ciro")+` ✅ (${all.length} satır)`;}
    }catch(e){console.warn(type,"load error:",e);}
  }
  build();
}

// ── Rapor ──
function build(){
  const sd=document.getElementById("sd").value;
  const ed=document.getElementById("ed").value;

  if(!CRM&&!CIRO){
    document.getElementById("report").innerHTML='<div class="loading">Excel dosyalarını yükleyin.</div>';
    document.getElementById("dbg").style.display="none";
    return;
  }

  // Sütun adları
  const crmKeys=CRM&&CRM.length?Object.keys(CRM[0]):[];
  const ciroKeys=CIRO&&CIRO.length?Object.keys(CIRO[0]):[];
  const CK=findCol(crmKeys,["kaydeden"])||"Kaydeden";
  const CS=findCol(crmKeys,["sube"])||"Şube";
  const CREF=findCol(crmKeys,["referans"])||"Referans";
  const CT=findCol(crmKeys,["sonteklif","teklifficiyati"])||"Son Teklif Fiyatı";
  const CDATE=findCol(crmKeys,["kayittarihi"])||"Kayıt Tarihi";
  const CP=findCol(ciroKeys,["sonegitimekleyen","egitimekleyen"])||"Son Eğitim Ekleyen";
  const CSB=findCol(ciroKeys,["sube"])||"Şube";
  const CCREF=findCol(ciroKeys,["referans"])||"Referans";
  const CCIRO=findCol(ciroKeys,["egitimciro"])||"Eğitim Ciro";
  const CDATE2=findCol(ciroKeys,["kayittarihi"])||"Kayıt Tarihi";

  const inRange=(v,isCRM)=>{
    const d=isCRM?parseDateCRM(v):parseDateCiro(v);
    if(!d)return true;
    if(sd&&d<sd)return false;
    if(ed&&d>ed)return false;
    return true;
  };

  const kFilt=(CRM||[]).filter(r=>inRange(r[CDATE],true));
  const cFilt=(CIRO||[]).filter(r=>inRange(r[CDATE2],false));

  const sdF=sd?sd.split("-").reverse().join("."):"tümü";
  const edF=ed?ed.split("-").reverse().join("."):"tümü";
  const dbg=document.getElementById("dbg");
  dbg.style.display="block";
  dbg.textContent=`🔍 CRM: ${kFilt.length} satır | Ciro: ${cFilt.length} satır | Tarih: ${sdF} → ${edF}`;

  if(!kFilt.length&&!cFilt.length){
    document.getElementById("report").innerHTML='<div class="loading">Seçili tarih aralığında veri yok.</div>';
    return;
  }

  // Map oluştur
  const emptyD=()=>({crm:0,ts:0,tc:0,ks:0,kc:0,refs:{}});
  const addCRM=(map,key,ref,t)=>{
    if(!key)return;
    if(!map[key])map[key]=emptyD();
    map[key].crm++;
    if(t>0){map[key].ts++;map[key].tc+=t;}
    if(!map[key].refs[ref])map[key].refs[ref]=emptyD();
    map[key].refs[ref].crm++;
    if(t>0){map[key].refs[ref].ts++;map[key].refs[ref].tc+=t;}
  };
  const addCiro=(map,key,ref,c)=>{
    if(!key)return;
    if(!map[key])map[key]=emptyD();
    map[key].ts++;map[key].tc+=c;map[key].ks++;map[key].kc+=c;
    if(!map[key].refs[ref])map[key].refs[ref]=emptyD();
    map[key].refs[ref].ts++;map[key].refs[ref].tc+=c;
    map[key].refs[ref].ks++;map[key].refs[ref].kc+=c;
  };

  const pMap={},sMap={};
  for(const r of kFilt){
    addCRM(pMap,norm(r[CK]),norm(r[CREF]).toUpperCase(),parseTeklif(r[CT]));
    addCRM(sMap,norm(r[CS]),norm(r[CREF]).toUpperCase(),parseTeklif(r[CT]));
  }
  for(const r of cFilt){
    addCiro(pMap,norm(r[CP]),norm(r[CCREF]).toUpperCase(),parseCiro(r[CCIRO]));
    addCiro(sMap,normSube(r[CSB]),norm(r[CCREF]).toUpperCase(),parseCiro(r[CCIRO]));
  }

  document.getElementById("report").innerHTML=
    renderTable("👤 Personel Bazlı Özet",pMap)+
    renderTable("🏢 Şube Bazlı Özet",sMap);
}

function renderTable(title,map){
  const arr=Object.entries(map).filter(([k])=>k&&k!=="nan")
    .map(([name,d])=>({name,d}))
    .sort((a,b)=>(b.d.crm+b.d.ks)-(a.d.crm+a.d.ks));
  if(!arr.length)return"";

  const C={t:"#C9A000",teklif:"#a78bfa",kayit:"#4ADE80",rdv:"#F5C800",kyt:"#4ADE80",kc:"#a78bfa",tc:"#e67e22",ciro:"#e74c3c"};
  let thead=`<thead><tr>
    <th style="color:${C.t}">İsim</th>
    <th style="color:${C.t}">T.Data</th>
    <th style="color:${C.teklif}">Teklif</th>
    <th style="color:${C.kayit}">Kayıt</th>
    <th style="color:${C.rdv}">Rdv%</th>
    <th style="color:${C.kyt}">Kyt%</th>
    <th style="color:${C.kc}">Kayıt Ciro</th>
    <th style="color:${C.tc}">Top.Teklif Ciro</th>
    <th style="color:${C.ciro}">Ciro%</th>
  </tr></thead>`;

  let tot={td:0,ts:0,ks:0,kc:0,tc:0};
  let tbody="<tbody>";
  for(let i=0;i<arr.length;i++){
    const {name,d}=arr[i];
    const td=d.crm+d.ks;
    const bg=i%2===0?"#161616":"#141414";
    tbody+=`<tr style="background:${bg}">
      <td>${esc(name)}</td>
      <td>${td}</td>
      <td style="color:${C.teklif}">${d.ts}</td>
      <td style="color:${C.kayit}">${d.ks}</td>
      <td style="color:${C.rdv}">${pct(d.ts,td)}</td>
      <td style="color:${C.kyt}">${pct(d.ks,d.ts)}</td>
      <td style="color:${C.kc}">${tl(d.kc)}</td>
      <td style="color:${C.tc}">${tl(d.tc)}</td>
      <td style="color:${C.ciro}">${pct(d.kc,d.tc)}</td>
    </tr>`;
    // Referans kırılımı
    const refs=Object.entries(d.refs)
      .filter(([,r])=>r.crm+r.ks>0)
      .sort((a,b)=>(b[1].ts+b[1].crm)-(a[1].ts+a[1].crm));
    for(const [ref,rd] of refs){
      const rtd=rd.crm+rd.ks;
      tbody+=`<tr class="ref">
        <td>↳ ${esc(ref)}</td>
        <td style="color:#3A3830">${rtd}</td>
        <td style="color:${C.teklif}">${rd.ts||"—"}</td>
        <td style="color:${C.kayit}">${rd.ks||"—"}</td>
        <td style="color:${C.rdv}">${pct(rd.ts,rtd)}</td>
        <td style="color:${C.kyt}">${pct(rd.ks,rd.ts)}</td>
        <td style="color:${C.kc}">${tl(rd.kc)}</td>
        <td style="color:${C.tc}">${tl(rd.tc)}</td>
        <td style="color:${C.ciro}">${pct(rd.kc,rd.tc)}</td>
      </tr>`;
    }
    tot.td+=td;tot.ts+=d.ts;tot.ks+=d.ks;tot.kc+=d.kc;tot.tc+=d.tc;
  }
  tbody+="</tbody>";
  const tfoot=`<tfoot><tr>
    <td>TOPLAM</td><td>${tot.td}</td>
    <td style="color:${C.teklif}">${tot.ts}</td>
    <td style="color:${C.kayit}">${tot.ks}</td>
    <td style="color:${C.rdv}">${pct(tot.ts,tot.td)}</td>
    <td style="color:${C.kyt}">${pct(tot.ks,tot.ts)}</td>
    <td style="color:${C.kc}">${tl(tot.kc)}</td>
    <td style="color:${C.tc}">${tl(tot.tc)}</td>
    <td style="color:${C.ciro}">${pct(tot.kc,tot.tc)}</td>
  </tr></tfoot>`;

  return`<div class="sec-title">${title}</div>
  <div class="tbl-wrap"><table>${thead}${tbody}${tfoot}</table></div>`;
}

function clearD(){
  document.getElementById("sd").value="";
  document.getElementById("ed").value="";
  build();
}

// Varsayılan: bu ayın başından bugüne
const t=new Date();
document.getElementById("sd").value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-01`;
document.getElementById("ed").value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;

// Firebase'den yükle
loadFromFB();
</script>
</body>
</html>
