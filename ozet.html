<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0A;color:#F0ECD8;font-family:'Raleway',sans-serif;min-height:100vh;padding:16px}

<script>
// ── Firebase ──────────────────────────────────────────────────────────
firebase.initializeApp({
  apiKey:"AIzaSyAk2oK4iQPQFIF5Z-aUCNTBfjP9NyP-GBQ",
  authDomain:"kutu-oyunu-8769b.firebaseapp.com",
  projectId:"kutu-oyunu-8769b"
});
const db = firebase.firestore();

let CRM  = null;
let CIRO = null;
let _tableIdx = 0;
const CHUNK = 500;

// ── Yardımcılar ───────────────────────────────────────────────────────
const fbTimeout = (p, ms=30000) => Promise.race([
  p,
  new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),ms))
]);

const norm = s => (s||"").toString().replace(/\s+/g," ").trim();

const normSube = s => {
  s = (s||"").toString().trim();
  return s.includes("=>") ? s.split("=>").pop().trim() : s;
};

const findCol = (keys, pats) => {
  for(const k of keys){
    const n = k.replace(/[\s\u00a0]/g,"").toLowerCase()
      .replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
      .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");
    if(pats.some(p => n===p || n.includes(p))) return k;
  }
  return null;
};

const parseTeklif = v => {
  if(!v || String(v).trim()==="" || String(v).trim()==="-") return 0;
  try{ return parseInt(String(v).split(",")[0].replace(/\./g,"").trim())||0; }
  catch{ return 0; }
};

const parseCiroVal = v => {
  if(!v) return 0;
  if(typeof v==="number") return v;
  return parseFloat(String(v).replace(/[^\d.]/g,""))||0;
};

const parseDateCRM = v => {
  if(!v) return null;
  const s = String(v).trim();
  if(/^\d{2}\.\d{2}\.\d{4}/.test(s)){
    const p = s.split(" ")[0].split(".");
    return `${p[2]}-${p[1]}-${p[0]}`;
  }
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
  if(!isNaN(v) && Number(v)>10000){
    const d = new Date(Math.round((Number(v)-25569)*86400*1000));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
  }
  return null;
};

const parseDateCiro = v => {
  if(v === null || v === undefined || v === "") return null;

  // Date objesi
  if(v instanceof Date){
    if(isNaN(v.getTime())) return null;
    return `${v.getUTCFullYear()}-${String(v.getUTCMonth()+1).padStart(2,"0")}-${String(v.getUTCDate()).padStart(2,"0")}`;
  }

  const s = String(v).trim();
  if(!s || s==="-") return null;

  // ISO: "2026-07-07" veya "2026-07-07T..."
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    return s.substring(0,10);
  }

  // "07.07.2026" veya "07/07/2026"
  const dm = s.match(/^(\d{1,2})[\/\.](\d{1,2})[\/\.](\d{4})/);
  if(dm) return `${dm[3]}-${dm[2].padStart(2,"0")}-${dm[1].padStart(2,"0")}`;

  // "2026.07.07"
  const ym = s.match(/^(\d{4})[\/\.](\d{2})[\/\.](\d{2})/);
  if(ym) return `${ym[1]}-${ym[2]}-${ym[3]}`;

  // Excel serial number
  const n = Number(v);
  if(!isNaN(n) && n > 10000){
    const d = new Date(Math.round((n-25569)*86400*1000));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
  }

  // Son çare: Date constructor ile dene
  const d = new Date(s);
  if(!isNaN(d.getTime())){
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
  }

  return null;
};

const pct = (a,b) => b>0 ? `${Math.round(a/b*100)}%` : "—";
const tl  = n  => n>0  ? `${Math.round(n).toLocaleString("tr-TR")}₺` : "—";
const esc = s  => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const _pot = note => {
  const n = (note||"").toString().toUpperCase();
  const y = ["RANDEVU","GELECEĞİM","GELECEM","KESİNLİKLE","MUTLAKA","ALACAĞIM","KAYDOLMAK",
    "FİYAT","FIYAT","ÜCRET","TEKLİF","İLGİLENİYOR","BİLGİ VER","DÜŞÜNÜYORUM","MERAK",
    "HAFTA","YARIN","BUGÜN","TAM OLUR","PLANLAMA"];
  const d = ["AÇMADI","ULAŞILAMIYOR","MEŞGUL","İLGİLENMİYOR","İSTEMİYOR","ALAKASIZ",
    "REDDETTİ","KAPAT","RAHATSIZ","TEKRAR ARAMAYACAK","YANLIŞLIKLA"];
  if(n.length<3) return "d";
  if(y.some(k=>n.includes(k)) && !d.some(k=>n.includes(k))) return "y";
  if(d.some(k=>n.includes(k))) return "d";
  return "o";
};

const _cat = s => {
  s = (s||"").toString().toUpperCase().trim();
  return {
    olumlu:  s==="OLUMLU",
    olumsuz: s==="OLUMSUZ"||s==="TEKRAR",
    sonra:   s==="SONRA ARANACAK",
    alakasiz:s.includes("ALAKASIZ")||s.includes("İLGİSİZ")||s.includes("ILGISIZ")
  };
};

// ── Excel yükleme ─────────────────────────────────────────────────────
const readXLSX = (file, cb) => {
  const r = new FileReader();
  r.onload = e => {
    const wb = XLSX.read(e.target.result,{type:"array",cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];
    cb(XLSX.utils.sheet_to_json(ws,{defval:"",raw:false}));
  };
  r.onerror = () => alert("Excel dosyası okunamadı.");
  r.readAsArrayBuffer(file);
};

function loadCRM(inp){
  const f = inp.files[0]; if(!f) return;
  document.getElementById("crmFN").textContent = "Yükleniyor...";
  readXLSX(f, rows => {
    CRM = rows;
    document.getElementById("crmFN").textContent = `${f.name} ✅ (${rows.length} satır)`;
    saveToFB("crm", rows, f.name);
    build();
  });
}

function loadCiro(inp){
  const f = inp.files[0]; if(!f) return;
  document.getElementById("ciroFN").textContent = "Yükleniyor...";
  readXLSX(f, rows => {
    CIRO = rows;
    document.getElementById("ciroFN").textContent = `${f.name} ✅ (${rows.length} satır)`;
    saveToFB("ciro", rows, f.name);
    build();
  });
}

// ── Firebase kaydet ───────────────────────────────────────────────────
function saveToFB(type, rows, fname){
  const chunks = [];
  for(let i=0; i<rows.length; i+=CHUNK) chunks.push(rows.slice(i,i+CHUNK));
  const ts = Date.now();
  db.doc(`ozet/${type}meta`).set({ts, chunks:chunks.length, fname:fname||"", totalRows:rows.length})
    .catch(e => console.warn("Meta kayıt hatası:",type,e));
  chunks.forEach((chunk,i) => {
    db.doc(`ozet/${type}_${i}`).set({rows:chunk,ts})
      .catch(e => console.warn("Chunk kayıt hatası:",type,i,e));
  });
}

// ── Firebase yükle ────────────────────────────────────────────────────
async function loadFromFB(){
  document.getElementById("crmFN").textContent  = "Firebase yükleniyor...";
  document.getElementById("ciroFN").textContent = "Firebase yükleniyor...";

  const loadType = async (type) => {
    const elId = type==="crm" ? "crmFN" : "ciroFN";
    const el = document.getElementById(elId);

    try{
      // Meta oku
      const meta = await fbTimeout(db.doc(`ozet/${type}meta`).get(), 15000);
      if(!meta.exists){
        el.textContent = "Dosya seçilmedi";
        return null;
      }
      const data   = meta.data()||{};
      const nChunk = Number(data.chunks)||0;
      const fname  = data.fname||"";

      if(nChunk===0){
        el.textContent = "Firebase boş / Dosya seç";
        return null;
      }

      // Chunk'ları sırayla oku (paralel değil — daha güvenilir)
      let all = [];
      for(let i=0; i<nChunk; i++){
        el.textContent = `Yükleniyor... (${i+1}/${nChunk})`;
        let doc = null;
        // 3 kez dene
        for(let attempt=0; attempt<3; attempt++){
          try{
            doc = await fbTimeout(db.doc(`ozet/${type}_${i}`).get(), 15000);
            break;
          } catch(e){
            if(attempt===2) throw e;
            await new Promise(r=>setTimeout(r, 1000)); // 1sn bekle, tekrar dene
          }
        }
        if(doc && doc.exists) all = all.concat(doc.data().rows||[]);
      }

      if(!all.length){
        el.textContent = "Firebase boş / Dosya seç";
        return null;
      }

      el.textContent = `${fname||type.toUpperCase()} ✅ (${all.length} satır)`;
      return all;

    } catch(e){
      console.warn(type, e);
      el.textContent = "Yüklenemedi — Dosya seç";
      return null;
    }
  };

  // CRM ve Ciro'yu sırayla yükle
  const crmData  = await loadType("crm");
  const ciroData = await loadType("ciro");

  if(crmData)  CRM  = crmData;
  if(ciroData) CIRO = ciroData;

  build();
}

// ── Tarih yardımcısı ──────────────────────────────────────────────────
function getDateStr(offsetDays){
  const t = new Date();
  t.setDate(t.getDate()+offsetDays);
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
}

// ── Randevu detay sekmesi geçişi ──────────────────────────────────────
function rdvTabSwitch(containerId, panelId){
  const container = document.getElementById(containerId);
  if(!container) return;
  container.querySelectorAll(".rdvlist-panel").forEach(p => p.classList.remove("active"));
  const target = document.getElementById(panelId);
  if(target) target.classList.add("active");
  const section = container.closest(".rdvlist-section");
  if(section){
    section.querySelectorAll(".rdvlist-tab").forEach(tab => {
      tab.classList.toggle("active", (tab.getAttribute("onclick")||"").includes(`'${panelId}'`));
    });
  }
}

// ── Açıklamadan saat çıkar ───────────────────────────────────────────
function extractTime(text){
  if(!text) return "";
  const t = String(text);
  const lines = t.split(/[\n\r]+/).map(l=>l.trim()).filter(Boolean);
  const checks = [...lines.slice(-3).reverse(), t];
  for(const line of checks){
    let m;
    // "saat 14:30" / "saat 14.30"
    m = line.match(/saat\s+([0-9]{1,2})[:\.]?([0-9]{2})?/i);
    if(m){ const h=parseInt(m[1]); if(h>=7&&h<=22) return String(h).padStart(2,"0")+":"+(m[2]||"00"); }
    // "14:30'a" vb
    m = line.match(/\b([0-9]{1,2}):([0-9]{2})['\u2019]?(a|de|da|te|ta)/i);
    if(m){ const h=parseInt(m[1]); if(h>=7&&h<=22) return String(h).padStart(2,"0")+":"+m[2]; }
    // HH:MM (iki nokta)
    m = line.match(/\b([0-9]{1,2}):([0-9]{2})\b/);
    if(m){ const h=parseInt(m[1]),min=parseInt(m[2]); if(h>=7&&h<=22&&min>=0&&min<=59) return String(h).padStart(2,"0")+":"+String(min).padStart(2,"0"); }
    // HH.MM — tarih filtresi (min>12 veya h>12)
    m = line.match(/\b([0-9]{1,2})\.([0-9]{2})\b/);
    if(m){ const h=parseInt(m[1]),min=parseInt(m[2]); if(h>=7&&h<=22&&min>=0&&min<=59&&(min>12||h>12)) return String(h).padStart(2,"0")+":"+String(min).padStart(2,"0"); }
  }
  return "";
}

// ── Randevu bölümleri ─────────────────────────────────────────────────
function buildRandevu(sd, ed){
  const container = document.getElementById("rdvReport");
  if(!CRM){ container.innerHTML=""; return; }

  const crmKeys  = CRM.length ? Object.keys(CRM[0]) : [];
  const CRDV     = findCol(crmKeys,["randevutarihi","randevutar","rdvtarihi","rdvtar","appointment","randevu tarihi","randevu"]);
  const CK2      = findCol(crmKeys,["kaydeden"]) || "Kaydeden";
  const CS2      = findCol(crmKeys,["sube"])     || "Şube";
  const CSONUC2  = findCol(crmKeys,["sonuc","sonuç"]) || "Sonuç";
  const CADSOYAD = findCol(crmKeys,["adsoyadi","adsoyad","adisoyadi","musteriadi","musteri adi","ad soyad","isim","müşteri adı","müşteri","ad"]);
  const CTEL     = findCol(crmKeys,["telefon","tel","gsm","cep","phone","mobile"]);
  const CACIKLAMA= findCol(crmKeys,["aciklama","açıklama","notlar","not","notes","acıklama"]);
  const CDATE_CRM= findCol(crmKeys,["kayittarihi"]) || "Kayıt Tarihi";

  // Tarih filtreli CRM satırları
  const filteredCRM = CRM.filter(r => {
    const d = parseDateCRM(r[CDATE_CRM]);
    if(!d) return true;
    if(sd && d < sd) return false;
    if(ed && d > ed) return false;
    return true;
  });

  if(!CRDV){
    container.innerHTML = '<div class="card rdv-section"><div class="sec-title">📅 Randevular</div>'
      +'<div class="rdv-empty">⚠️ CRM Excel\'de <b>Randevu Tarihi</b> sütunu bulunamadı.</div></div>';
    return;
  }

  const buildMaps = targetDate => {
    const rows = filteredCRM.filter(r => parseDateCRM(r[CRDV])===targetDate);
    const subeMap={}, persMap={};
    for(const r of rows){
      const sube = norm(r[CS2])||"Belirtilmemiş";
      const pers = norm(r[CK2])||"Belirtilmemiş";
      const cs   = _cat(norm(r[CSONUC2]));
      if(!subeMap[sube]) subeMap[sube]={toplam:0,olumlu:0,olumsuz:0,sonra:0,diger:0};
      subeMap[sube].toplam++;
      if(cs.olumlu)subeMap[sube].olumlu++; else if(cs.olumsuz)subeMap[sube].olumsuz++; else if(cs.sonra)subeMap[sube].sonra++; else subeMap[sube].diger++;
      if(!persMap[pers]) persMap[pers]={toplam:0,olumlu:0,olumsuz:0,sonra:0,diger:0,sube};
      persMap[pers].toplam++;
      if(cs.olumlu)persMap[pers].olumlu++; else if(cs.olumsuz)persMap[pers].olumsuz++; else if(cs.sonra)persMap[pers].sonra++; else persMap[pers].diger++;
    }
    return {rows, subeMap, persMap};
  };

  const renderRdvTable = (title, map, showSube) => {
    const arr = Object.entries(map).filter(([k])=>k&&k!=="nan").sort((a,b)=>b[1].toplam-a[1].toplam);
    if(!arr.length) return '<div class="rdv-empty">Veri yok</div>';
    let tot={toplam:0,olumlu:0,olumsuz:0,sonra:0,diger:0}, rows="";
    for(const [name,d] of arr){
      rows += `<tr><td>${esc(name)}${showSube&&d.sube?`<span style="color:#8A8474;font-size:.6rem;font-weight:400;margin-left:4px">${esc(d.sube)}</span>`:""}</td>`
        +`<td style="color:#FFE000;font-weight:800">${d.toplam}</td>`
        +`<td style="color:#4ADE80">${d.olumlu||"—"}</td>`
        +`<td style="color:#e74c3c">${d.olumsuz||"—"}</td>`
        +`<td style="color:#F5C800">${d.sonra||"—"}</td>`
        +`<td style="color:#8A8474">${d.diger||"—"}</td></tr>`;
      tot.toplam+=d.toplam; tot.olumlu+=d.olumlu; tot.olumsuz+=d.olumsuz; tot.sonra+=d.sonra; tot.diger+=d.diger;
    }
    return `<div class="rdv-tbl-wrap"><table>`
      +`<thead><tr><th style="text-align:left;color:#C9A000">${title}</th><th style="color:#FFE000">Randevu</th><th style="color:#4ADE80">Olumlu</th><th style="color:#e74c3c">Olumsuz</th><th style="color:#F5C800">S.Ara</th><th style="color:#8A8474">Diğer</th></tr></thead>`
      +`<tbody>${rows}</tbody>`
      +`<tfoot><tr><td>TOPLAM</td><td style="color:#FFE000">${tot.toplam}</td><td style="color:#4ADE80">${tot.olumlu||"—"}</td><td style="color:#e74c3c">${tot.olumsuz||"—"}</td><td style="color:#F5C800">${tot.sonra||"—"}</td><td style="color:#8A8474">${tot.diger||"—"}</td></tr></tfoot>`
      +`</table></div>`;
  };

  const renderBlock = (label, emoji, accentColor, offset) => {
    const targetDate = getDateStr(offset);
    const display    = targetDate.split("-").reverse().join(".");
    const {rows, subeMap, persMap} = buildMaps(targetDate);
    const total = rows.length;
    const inner = total===0
      ? `<div class="rdv-empty">📭 ${display} tarihine ait randevu kaydı yok.</div>`
      : `<div class="rdv-grid">${renderRdvTable("🏢 Şube",subeMap,false)}${renderRdvTable("👤 Personel",persMap,true)}</div>`;
    return `<div class="card rdv-section" style="border-left:3px solid ${accentColor}">`
      +`<div class="sec-title">${emoji} ${label}<span class="rdv-badge" style="background:${accentColor};color:#000">${total}</span><span class="rdv-date-lbl">${display}</span></div>`
      +inner+`</div>`;
  };

  const renderList = (label, emoji, accentColor, offset) => {
    const targetDate = getDateStr(offset);
    const display    = targetDate.split("-").reverse().join(".");
    const rows = filteredCRM.filter(r => parseDateCRM(r[CRDV])===targetDate);
    if(!rows.length){
      return `<div class="card rdvlist-section" style="border-left:3px solid ${accentColor}">`
        +`<div class="sec-title">${emoji} ${label}<span class="rdv-badge" style="background:${accentColor};color:#000">0</span><span class="rdv-date-lbl">${display}</span></div>`
        +`<div class="rdvlist-empty">📭 Bu tarihe ait randevu yok.</div></div>`;
    }
    const subeGroups = {};
    for(const r of rows){
      const sube = norm(r[CS2])||"Belirtilmemiş";
      if(!subeGroups[sube]) subeGroups[sube]=[];
      subeGroups[sube].push({
        ad:   CADSOYAD  ? String(r[CADSOYAD]||"").trim()   : "",
        tel:  CTEL      ? String(r[CTEL]||"").trim()       : "",
        saat: extractTime(CACIKLAMA ? String(r[CACIKLAMA]||"").trim() : "")
      });
    }
    const subeList = Object.keys(subeGroups).sort();
    const uid = `rdvl_${offset}_${Date.now()}`;
    let tabs="", panels="";
    subeList.forEach((s,si) => {
      tabs += `<button class="rdvlist-tab${si===0?" active":""}" onclick="rdvTabSwitch('${uid}','${uid}_${si}')">${esc(s)} <span style="opacity:.7">(${subeGroups[s].length})</span></button>`;
      const items = [...subeGroups[s]].sort((a,b)=>{ if(a.saat&&!b.saat)return-1; if(!a.saat&&b.saat)return 1; return a.saat<b.saat?-1:a.saat>b.saat?1:0; });
      let itemHtml="";
      items.forEach((itm,ii) => {
        itemHtml += `<div class="rdvlist-item">`
          +`<div class="rdvlist-num">${ii+1}</div>`
          +`<div class="rdvlist-info"><div class="rdvlist-name">${itm.ad||'<span style="color:#8A8474">—</span>'}</div>`
          +(itm.tel?`<div class="rdvlist-phone">📞 ${esc(itm.tel)}</div>`:`<div class="rdvlist-phone" style="color:#8A8474">Telefon yok</div>`)
          +`</div>`
          +(itm.saat?`<div class="rdvlist-time">⏰ ${itm.saat}</div>`:`<div class="rdvlist-notime">—</div>`)
          +`</div>`;
      });
      panels += `<div class="rdvlist-panel${si===0?" active":""}" id="${uid}_${si}">${itemHtml}</div>`;
    });
    return `<div class="card rdvlist-section" style="border-left:3px solid ${accentColor}">`
      +`<div class="sec-title">${emoji} ${label}<span class="rdv-badge" style="background:${accentColor};color:#000">${rows.length}</span><span class="rdv-date-lbl">${display}</span></div>`
      +`<div class="rdvlist-sube-tabs">${tabs}</div><div id="${uid}">${panels}</div></div>`;
  };

  container.innerHTML =
    renderBlock("Yarınki Randevular","📅","#FFE000",1);
}

// ── Ana build ─────────────────────────────────────────────────────────
function build(){
  const sd = document.getElementById("sd").value;
  const ed = document.getElementById("ed").value;

  if(!CRM && !CIRO){
    document.getElementById("report").innerHTML = '<div class="loading">Excel dosyalarını yükleyin.</div>';
    document.getElementById("rdvReport").innerHTML = "";
    document.getElementById("dbg").style.display = "none";
    return;
  }

  buildRandevu(sd, ed);

  const crmKeys  = CRM  && CRM.length  ? Object.keys(CRM[0])  : [];
  const ciroKeys = CIRO && CIRO.length ? Object.keys(CIRO[0]) : [];

  const CK     = findCol(crmKeys,["kaydeden"])    || "Kaydeden";
  const CS     = findCol(crmKeys,["sube"])        || "Şube";
  const CSONUC = findCol(crmKeys,["sonuc","sonuç"]) || "Sonuç";
  const CNOT   = findCol(crmKeys,["notlar","not"]) || "Notlar";
  const CREF   = findCol(crmKeys,["referans"])    || "Referans";
  const CT     = findCol(crmKeys,["sonteklif","teklifficiyati"]) || "Son Teklif Fiyatı";
  const CDATE  = findCol(crmKeys,["kayittarihi"]) || "Kayıt Tarihi";
  const CRDV_B = findCol(crmKeys,["randevutarihi","randevutar","rdvtarihi","rdvtar","randevu tarihi","randevu"]);
  const tomorrowStr = getDateStr(1);

  const CP    = findCol(ciroKeys,["sonegitimekleyen","egitimekleyen"]) || "Son Eğitim Ekleyen";
  const CSB   = findCol(ciroKeys,["sube"])      || "Şube";
  const CCREF = findCol(ciroKeys,["referans"])  || "Referans";
  const CCIRO = findCol(ciroKeys,["egitimciro"])|| "Eğitim Ciro";
  const CTAH  = findCol(ciroKeys,["tahsilat"])  || "Tahsilat";
  const CKUR  = findCol(ciroKeys,["kur"])       || "Kur";
  const CDATE2= findCol(ciroKeys,["kayittarihi","kayıttarihi","tarih","date","kayit tarihi","kayıt tarihi","egitimtarihi","eğitimtarihi"]) || "Kayıt Tarihi";

  const inRange = (v, isCRM) => {
    const d = isCRM ? parseDateCRM(v) : parseDateCiro(v);
    if(!d) return true;
    if(sd && d<sd) return false;
    if(ed && d>ed) return false;
    return true;
  };

  const kFilt = (CRM||[]).filter(r => inRange(r[CDATE],true));
  const cFilt = (CIRO||[]).filter(r => inRange(r[CDATE2],false));

  let ciroSample = "—";
  if(CIRO && CIRO.length){
    const raw = CIRO[0][CDATE2];
    const parsed = parseDateCiro(raw);
    ciroSample = `"${raw}" (${typeof raw}) → ${parsed||"null"}`;
    console.log("Ciro tarih örnek:", raw, typeof raw, "→", parsed);
    console.log("Ciro tüm sütunlar:", ciroKeys.join(" | "));
    // İlk satırdaki tüm değerleri de yazdır
    console.log("Ciro ilk satır:", JSON.stringify(CIRO[0]));
  }

  const dbg = document.getElementById("dbg");
  dbg.style.display = "block";
  dbg.innerHTML = `🔍 CRM: ${kFilt.length}/${(CRM||[]).length} | Ciro: ${cFilt.length}/${(CIRO||[]).length} | ${sd||"başlangıç"} → ${ed||"bugün"}<br>`
    + `Ciro sütun: "${CDATE2}" | Örnek: ${ciroSample}<br>`
    + `<span style="color:#666;font-size:.58rem">Ciro sütunlar: ${ciroKeys.slice(0,10).join(", ")}</span>`;

  if(!kFilt.length && !cFilt.length){
    document.getElementById("report").innerHTML = '<div class="loading">Seçili tarih aralığında veri yok.</div>';
    return;
  }

  const emptyD = () => ({
    crm:0, ts:0, tc:0, ks:0, kc:0, kur:0, tahsilat:0,
    olumlu:0, olumsuz:0, sonra:0, alakasiz:0,
    pot_y:0, pot_o:0, pot_d:0, rdv:0, refs:{}
  });

  const addCRM = (map, key, ref, t, sonuc, note) => {
    if(!key) return;
    if(!map[key]) map[key] = emptyD();
    map[key].crm++;
    if(t>0){ map[key].ts++; map[key].tc+=t; }
    const c=_cat(sonuc), p=_pot(note);
    if(c.olumlu)map[key].olumlu++; if(c.olumsuz)map[key].olumsuz++;
    if(c.sonra)map[key].sonra++;   if(c.alakasiz)map[key].alakasiz++;
    if(p==="y")map[key].pot_y++; else if(p==="o")map[key].pot_o++; else map[key].pot_d++;
    if(!map[key].refs[ref]) map[key].refs[ref]=emptyD();
    const rc=map[key].refs[ref];
    rc.crm++;
    if(t>0){ rc.ts++; rc.tc+=t; }
    if(c.olumlu)rc.olumlu++; if(c.olumsuz)rc.olumsuz++;
    if(c.sonra)rc.sonra++;   if(c.alakasiz)rc.alakasiz++;
    if(p==="y")rc.pot_y++; else if(p==="o")rc.pot_o++; else rc.pot_d++;
  };

  const addCiro = (map, key, ref, c, tah, kur) => {
    if(!key) return;
    if(!map[key]) map[key]=emptyD();
    map[key].ks++; map[key].kc+=c; map[key].tahsilat+=tah; map[key].kur+=kur;
    if(!map[key].refs[ref]) map[key].refs[ref]=emptyD();
    map[key].refs[ref].ks++; map[key].refs[ref].kc+=c;
    map[key].refs[ref].tahsilat+=tah; map[key].refs[ref].kur+=kur;
  };

  const pMap={}, sMap={};

  for(const r of kFilt){
    const pKey   = norm(r[CK]);
    const sKey   = norm(r[CS]);
    const refKey = norm(r[CREF]).toUpperCase();
    addCRM(pMap, pKey, refKey, parseTeklif(r[CT]), r[CSONUC], r[CNOT]);
    addCRM(sMap, sKey, refKey, parseTeklif(r[CT]), r[CSONUC], r[CNOT]);
    if(CRDV_B && parseDateCRM(r[CRDV_B])===tomorrowStr){
      if(pMap[pKey]) pMap[pKey].rdv++;
      if(sMap[sKey]) sMap[sKey].rdv++;
    }
  }

  for(const r of cFilt){
    const c   = parseCiroVal(r[CCIRO]);
    const tah = parseCiroVal(r[CTAH]);
    const kur = parseFloat(r[CKUR])||0;
    addCiro(pMap, norm(r[CP]),         norm(r[CCREF]).toUpperCase(), c, tah, kur);
    addCiro(sMap, normSube(r[CSB]),    norm(r[CCREF]).toUpperCase(), c, tah, kur);
  }

  _tableIdx = 0;
  document.getElementById("report").innerHTML =
    renderTable("👤 Personel Bazlı Özet", pMap) +
    renderTable("🏢 Şube Bazlı Özet",    sMap);
}

// ── Tablo render ──────────────────────────────────────────────────────
function renderTable(title, map){
  const arr = Object.entries(map)
    .filter(([k])=>k&&k!=="nan")
    .map(([name,d])=>({name,d}))
    .sort((a,b)=>b.d.kc-a.d.kc);
  if(!arr.length) return "";

  const C = {
    teklif:"#a78bfa", kayit:"#4ADE80", rdv:"#F5C800", kyt:"#4ADE80",
    kc:"#a78bfa", tc:"#e67e22", ciro:"#e74c3c", tah:"#4ADE80", kur:"#F5C800"
  };

  const theadHtml = `<thead class="ph"><tr>
    <th style="text-align:left;color:#C9A000">İsim</th>
    <th>T.Data</th>
    <th style="color:${C.teklif}">Teklif</th>
    <th style="color:${C.kayit}">Kayıt</th>
    <th style="color:${C.kur}">Kur</th>
    <th style="color:#FFE000" title="Yarınki randevu">Rdv↑</th>
    <th style="color:${C.rdv}">Rdv%</th>
    <th style="color:${C.kyt}">Kyt%</th>
    <th style="color:${C.kc}">Kayıt Ciro</th>
    <th style="color:${C.tc}">Top.Teklif Ciro</th>
    <th style="color:${C.ciro}">Ciro%</th>
    <th style="color:${C.tah}">Tahsilat</th>
    <th style="color:#4ADE80">Olumlu</th>
    <th style="color:#e74c3c">Olumsuz</th>
    <th style="color:#F5C800">S.Ara</th>
    <th style="color:#8A8474">Alksz</th>
    <th style="color:#4ADE80">🟢</th>
    <th style="color:#F5C800">🟡</th>
    <th style="color:#e74c3c">🔴</th>
  </tr></thead>`;

  let tot = {td:0,ts:0,ks:0,kc:0,tc:0,tah:0,kur:0,rdv:0,
    olumlu:0,olumsuz:0,sonra:0,alakasiz:0,pot_y:0,pot_o:0,pot_d:0};
  let cards = "";

  for(const {name,d} of arr){
    const td    = d.crm + d.ks;
    const tsTot = d.ts  + d.ks;
    const rdvVal= d.rdv ||0;

    const mainRow = `<tr class="pm">
      <td style="color:#FFE000">${esc(name)}</td>
      <td style="color:#F0ECD8">${td}</td>
      <td style="color:${C.teklif}">${tsTot}</td>
      <td style="color:${C.kayit}">${d.ks}</td>
      <td style="color:${C.kur}">${d.kur}</td>
      <td style="color:#FFE000;font-weight:${rdvVal>0?"800":"400"}">${rdvVal||"—"}</td>
      <td style="color:${C.rdv}">${pct(tsTot,td)}</td>
      <td style="color:${C.kyt}">${pct(d.ks,tsTot)}</td>
      <td style="color:${C.kc}">${tl(d.kc)}</td>
      <td style="color:${C.tc}">${tl(d.tc+d.kc)}</td>
      <td style="color:${C.ciro}">${pct(d.kc,d.tc+d.kc)}</td>
      <td style="color:${C.tah}">${tl(d.tahsilat)}</td>
      <td style="color:#4ADE80">${d.olumlu}</td>
      <td style="color:#e74c3c">${d.olumsuz}</td>
      <td style="color:#F5C800">${d.sonra}</td>
      <td style="color:#8A8474">${d.alakasiz}</td>
      <td style="color:#4ADE80">${d.pot_y}</td>
      <td style="color:#F5C800">${d.pot_o}</td>
      <td style="color:#e74c3c">${d.pot_d}</td>
    </tr>`;

    let refRows = "";
    for(const [ref,rd] of Object.entries(d.refs).filter(([,r])=>r.crm+r.ks>0).sort((a,b)=>b[1].kc-a[1].kc)){
      const rtd   = rd.crm+rd.ks;
      const rtsTot= rd.ts +rd.ks;
      refRows += `<tr class="pr">
        <td>↳ ${esc(ref)}</td>
        <td>${rtd}</td>
        <td style="color:${C.teklif}">${rtsTot||"—"}</td>
        <td style="color:${C.kayit}">${rd.ks||"—"}</td>
        <td style="color:${C.kur}">${rd.kur||"—"}</td>
        <td>—</td>
        <td style="color:${C.rdv}">${pct(rtsTot,rtd)}</td>
        <td style="color:${C.kyt}">${pct(rd.ks,rtsTot)}</td>
        <td style="color:${C.kc}">${tl(rd.kc)}</td>
        <td style="color:${C.tc}">${tl(rd.tc+rd.kc)}</td>
        <td style="color:${C.ciro}">${pct(rd.kc,rd.tc+rd.kc)}</td>
        <td style="color:${C.tah}">${tl(rd.tahsilat)}</td>
        <td colspan="7"></td>
      </tr>`;
    }

    cards += `<div class="pers-card"><table>${theadHtml}<tbody>${mainRow}${refRows}</tbody></table></div>`;

    tot.td+=td; tot.ts+=d.ts; tot.ks+=d.ks; tot.kc+=d.kc; tot.tc+=d.tc;
    tot.tah+=d.tahsilat; tot.kur+=d.kur; tot.rdv+=rdvVal;
    tot.olumlu+=d.olumlu; tot.olumsuz+=d.olumsuz; tot.sonra+=d.sonra;
    tot.alakasiz+=d.alakasiz; tot.pot_y+=d.pot_y; tot.pot_o+=d.pot_o; tot.pot_d+=d.pot_d;
  }

  const totTs=tot.ts+tot.ks, totTc=tot.tc+tot.kc;
  const totRow = `<div class="pers-card" style="border-color:rgba(255,224,0,.3)">
    <table><tbody><tr class="pm" style="background:rgba(255,224,0,.06)">
      <td style="color:#F5C800">TOPLAM</td>
      <td style="color:#F0ECD8">${tot.td}</td>
      <td style="color:${C.teklif}">${totTs}</td>
      <td style="color:${C.kayit}">${tot.ks}</td>
      <td style="color:${C.kur}">${tot.kur}</td>
      <td style="color:#FFE000">${tot.rdv||"—"}</td>
      <td style="color:${C.rdv}">${pct(totTs,tot.td)}</td>
      <td style="color:${C.kyt}">${pct(tot.ks,totTs)}</td>
      <td style="color:${C.kc}">${tl(tot.kc)}</td>
      <td style="color:${C.tc}">${tl(totTc)}</td>
      <td style="color:${C.ciro}">${pct(tot.kc,totTc)}</td>
      <td style="color:${C.tah}">${tl(tot.tah)}</td>
      <td style="color:#4ADE80">${tot.olumlu}</td>
      <td style="color:#e74c3c">${tot.olumsuz}</td>
      <td style="color:#F5C800">${tot.sonra}</td>
      <td style="color:#8A8474">${tot.alakasiz}</td>
      <td style="color:#4ADE80">${tot.pot_y}</td>
      <td style="color:#F5C800">${tot.pot_o}</td>
      <td style="color:#e74c3c">${tot.pot_d}</td>
    </tr></tbody></table>
  </div>`;

  return `<div class="sec-title">${title}</div><div class="pers-cards-wrap">${cards}${totRow}</div>`;
}

// ── Temizle ───────────────────────────────────────────────────────────
function clearD(){
  document.getElementById("sd").value="";
  document.getElementById("ed").value="";
  build();
}

  document.getElementById("ed").value = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;

</script>
